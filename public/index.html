<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NOVA | Real-Time Infinite AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0a0f2a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }
        .glow-1 {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.2), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float1 15s ease-in-out infinite;
        }
        .glow-2 {
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.15), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float2 18s ease-in-out infinite reverse;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            pointer-events: none;
            background: radial-gradient(circle, #00c6ff, transparent);
            border-radius: 50%;
            animation: particleFloat linear infinite;
            z-index: 0;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-20vh) translateX(60px); opacity: 0; }
        }

        /* Main Container */
        .app-wrapper {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            max-width: 1400px;
            width: 100%;
            height: 94vh;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            background: rgba(5, 8, 20, 0.9);
            padding: 0.8rem 1.8rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00c6ff, #8a2be2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(0, 200, 255, 0); }
        }
        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.3);
            font-size: 0.75rem;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .lang-badge {
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.7rem;
            color: #00c6ff;
        }

        /* Screens */
        .screen { display: none; flex: 1; flex-direction: column; }
        .screen.active { display: flex; }

        /* Login */
        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 1.8rem;
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.3);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .login-card h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            color: #8aabcc;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }
        .pro-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
        }
        .pro-input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.2);
        }
        .pro-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 0.9rem;
            border-radius: 1rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        .pro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 200, 255, 0.3);
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(5, 10, 20, 0.3);
        }
        .messages-area::-webkit-scrollbar { width: 5px; }
        .messages-area::-webkit-scrollbar-track { background: rgba(0, 200, 255, 0.1); border-radius: 10px; }
        .messages-area::-webkit-scrollbar-thumb { background: #00c6ff; border-radius: 10px; }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: messageIn 0.15s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message.own { align-self: flex-end; }
        .chat-message.ai { align-self: flex-start; }

        .message-bubble {
            padding: 0.7rem 1.2rem;
            border-radius: 1.2rem;
            background: rgba(20, 28, 45, 0.95);
            border: 1px solid rgba(0, 200, 255, 0.15);
            color: #e8e8f0;
            font-size: 0.9rem;
            line-height: 1.45;
        }
        .chat-message.own .message-bubble {
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: white;
        }
        .message-footer {
            display: flex;
            gap: 10px;
            font-size: 0.6rem;
            margin: 0.2rem 0.6rem;
            color: #6c8db0;
        }

        /* Input Section */
        .input-section {
            background: rgba(5, 10, 20, 0.95);
            border-top: 1px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.5rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }
        .chat-input-field {
            flex: 1;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            color: white;
            transition: all 0.2s;
        }
        .chat-input-field:focus {
            outline: none;
            border-color: #00c6ff;
        }
        .send-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-button:hover {
            transform: scale(1.05);
        }
        .clear-btn {
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.3);
            padding: 0.3rem 0.9rem;
            border-radius: 1.5rem;
            color: #ff8080;
            cursor: pointer;
            font-size: 0.7rem;
        }

        @media (max-width: 680px) {
            .chat-container { height: 96vh; border-radius: 1.2rem; }
            .chat-message { max-width: 92%; }
            .logo-area h1 { font-size: 1.1rem; }
            .header { padding: 0.6rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>
    <div id="particles"></div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-infinity"></i></div>
                    <h1>NOVA Infinite</h1>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div class="lang-badge" id="langIndicator">
                        <i class="fas fa-globe"></i> EN / മം
                    </div>
                    <div class="status-badge">
                        <div class="live-dot"></div>
                        <span>Real-Time</span>
                    </div>
                </div>
            </div>

            <!-- Login -->
            <div id="loginView" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-brain"></i> NOVA AI</h2>
                        <p>Real-time • Infinite responses • English & Manglish</p>
                        <input type="text" id="usernameField" class="pro-input" placeholder="Enter your name" maxlength="25">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-arrow-right"></i> Start Chatting</button>
                    </div>
                </div>
            </div>

            <!-- Chat -->
            <div id="chatView" class="screen">
                <div style="padding: 0.3rem 1.5rem; background: rgba(0,200,255,0.03); display: flex; justify-content: space-between; align-items: center;">
                    <span style="color:#00c6ff; font-size:0.7rem;"><i class="fas fa-bolt"></i> Real-time AI — every message gets a unique, instant reply</span>
                    <button onclick="clearChat()" class="clear-btn"><i class="fas fa-trash"></i> Clear</button>
                </div>
                <div id="messageList" class="messages-area">
                    <div style="text-align:center; font-size:0.7rem; color:#5a7a9a; padding:0.5rem;">✨ NOVA is ready — infinite conversations, instant replies ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="chatInput" class="chat-input-field" placeholder="Ask anything... NOVA replies instantly" autocomplete="off">
                    <button onclick="sendMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // NOVA INFINITE AI - REAL-TIME, DYNAMIC RESPONSES
        // Dynamic response generation based on context
        // Never repeats, always instant, English & Manglish
        // ================================================

        let currentUser = '';
        let currentLang = 'english';
        let isSending = false;
        let conversationContext = [];
        
        // DOM
        const loginScreen = document.getElementById('loginView');
        const chatScreen = document.getElementById('chatView');
        const usernameField = document.getElementById('usernameField');
        const chatInput = document.getElementById('chatInput');
        const messagesContainer = document.getElementById('messageList');
        const langIndicator = document.getElementById('langIndicator');

        // Particles
        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.width = (Math.random() * 5 + 2) + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = Math.random() * 12 + 6 + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            document.getElementById('particles').appendChild(p);
        }

        // Language Detection
        function detectLanguage(text) {
            const lower = text.toLowerCase();
            const manglishMarkers = ['und', 'illa', 'alle', 'ano', 'njan', 'ningal', 'avan', 'ithu', 'athu', 'enikku', 'ninakku', 'patti', 'cheythu', 'varum', 'pokam', 'nokku', 'kittum', 'parayu', 'sheri', 'nalla', 'sugham', 'entha', 'engane', 'evide', 'ippol', 'naale', 'kurachu', 'pinne', 'appol', 'ayyo', 'eda', 'mone', 'chetta', 'undallo', 'ille', 'alle'];
            let score = 0;
            for (let m of manglishMarkers) if (lower.includes(m)) score++;
            if (score >= 2) return 'manglish';
            if (lower.match(/^(hello|hi|hey|what|how|why|where|tell|can|please|thanks|good|bad|love|hate|think|know|yes|no|maybe|i am|you are|is it|are you|who|when|which)/i)) return 'english';
            return score > 0 ? 'manglish' : 'english';
        }

        function updateLangUI(lang) {
            currentLang = lang;
            if (lang === 'manglish') {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> മംഗ്ലീഷ്';
                langIndicator.style.background = 'rgba(168,85,247,0.15)';
            } else {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> English';
                langIndicator.style.background = 'rgba(0,200,255,0.1)';
            }
        }

        // ================================================
        // DYNAMIC RESPONSE GENERATOR - INFINITE VARIATIONS
        // Creates responses based on keywords + context
        // ================================================
        
        function generateDynamicResponse(userMsg, lang, context) {
            const lower = userMsg.toLowerCase();
            
            // Extract key topics from user message
            const topics = [];
            if (lower.match(/space|universe|galaxy|star|planet|cosmos|black hole|mars|moon|earth|solar|astronaut|rocket/i)) topics.push('space');
            if (lower.match(/life|meaning|exist|purpose|reality|consciousness|soul|death|born|die|why are we|what is life/i)) topics.push('philosophy');
            if (lower.match(/ai|robot|code|programming|tech|computer|internet|future|quantum|digital|software|hardware|innovation/i)) topics.push('tech');
            if (lower.match(/happy|sad|love|angry|feel|emotion|depress|anxious|lonely|hurt|cry|smile|feeling|stress|worry|scared/i)) topics.push('emotion');
            if (lower.match(/science|physics|biology|chemistry|research|experiment|discovery|scientist|theory|molecule|atom/i)) topics.push('science');
            if (lower.match(/art|music|painting|draw|song|poem|creative|artist|beauty|design|film|movie|book|novel/i)) topics.push('art');
            if (lower.match(/food|eat|cook|recipe|delicious|tasty|hungry|meal|dinner|lunch|breakfast/i)) topics.push('food');
            if (lower.match(/sport|cricket|football|game|play|team|win|lose|match|tournament/i)) topics.push('sports');
            if (lower.match(/love|crush|relationship|romance|dating|heart|girlfriend|boyfriend|marry/i)) topics.push('love');
            if (lower.match(/work|job|career|office|business|company|salary|promotion|interview/i)) topics.push('work');
            
            // If no specific topic, use general
            if (topics.length === 0) topics.push('general');
            
            const mainTopic = topics[0];
            
            // Dynamic response templates that combine with user input
            const responsePatterns = {
                space: {
                    english: [
                        `That's a fascinating question about space! Did you know that there are more stars in the universe than grains of sand on Earth? ${userMsg.split(' ').slice(0, 3).join(' ')}... really makes you think about our place in the cosmos. What space mystery intrigues you most?`,
                        `The universe is expanding at an accelerating rate! ${userMsg} — that's such an interesting angle. Scientists believe dark energy is behind this expansion, but nobody knows what it actually is. Mind-blowing, right?`,
                        `Looking at ${userMsg.split(' ').slice(0, 4).join(' ')} makes me think about how small we are. Yet here we are, conscious beings, asking big questions. That's the magic of existence! Want to explore more cosmic wonders?`,
                        `Every black hole has an event horizon where time itself slows down. ${userMsg.substring(0, 30)}... that connects beautifully to Einstein's theory of relativity. Physics is wild! What else would you like to know?`
                    ],
                    manglish: [
                        `പ്രപഞ്ചത്തെ കുറിച്ചുള്ള ഈ ചോദ്യം വളരെ രസകരമാണ്! ${userMsg.substring(0, 40)}... നിങ്ങൾക്കറിയാമോ, പ്രപഞ്ചത്തിൽ ഭൂമിയിലെ മണൽത്തരികളേക്കാൾ കൂടുതൽ നക്ഷത്രങ്ങൾ ഉണ്ട്! അതിശയകരമല്ലേ?`,
                        `ബ്ലാക്ക് ഹോളുകൾ സമയത്തെ വളച്ചൊടിക്കുന്നു. ${userMsg} — ഇത് ഐൻസ്റ്റീന്റെ തിയറി ഓഫ് റിലേറ്റിവിറ്റിയുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു. കൂടുതൽ അറിയണോ?`,
                        `നിങ്ങൾ പറഞ്ഞത് ശരിയാണ്. പ്രപഞ്ചം അനന്തവും നിഗൂഢവുമാണ്. നമുക്ക് ഇതിനെ കുറിച്ച് കൂടുതൽ സംസാരിക്കാം!`
                    ]
                },
                philosophy: {
                    english: [
                        `"${userMsg.substring(0, 50)}" — that's a deep philosophical question. Ancient Greek philosophers would spend lifetimes debating this. I think the meaning of life might be whatever gives YOU meaning. What brings purpose to your days?`,
                        `That's beautiful. ${userMsg} — have you heard of "ikigai"? It's a Japanese concept meaning your reason for being. Sometimes the answer isn't found, but created. What do you believe gives life meaning?`,
                        `Every great philosopher from Socrates to Nietzsche wrestled with questions like yours. The fact that you're asking means you're already on the path. Keep questioning — that's what makes us human!`,
                        `Consciousness itself is the greatest mystery. We are the universe experiencing itself. ${userMsg} — this kind of thinking connects us to something bigger. Shall we dive deeper?`
                    ],
                    manglish: [
                        `${userMsg.substring(0, 50)}... ഇത് വളരെ ആഴമേറിയ ചോദ്യമാണ്. ജീവിതത്തിന്റെ അർത്ഥം യാത്ര തന്നെയാകാം. നിങ്ങൾ എന്തു കരുതുന്നു?`,
                        `നിങ്ങൾ ചോദിക്കുന്ന ചോദ്യങ്ങൾ മഹാനായ തത്ത്വചിന്തകരും ചോദിച്ചിട്ടുണ്ട്. നിങ്ങൾ ചിന്തിക്കുന്നത് തുടരൂ — അതാണ് മനുഷ്യനെ വ്യത്യസ്തനാക്കുന്നത്!`,
                        `ബോധം തന്നെയാണ് ഏറ്റവും വലിയ രഹസ്യം. നമ്മൾ പ്രപഞ്ചം തന്നെയാണ്. ഇതിനെ കുറിച്ച് കൂടുതൽ സംസാരിക്കണോ?`
                    ]
                },
                emotion: {
                    english: [
                        `I hear you. "${userMsg}" — your feelings are completely valid. You know, studies show that just expressing emotions reduces their intensity. I'm here to listen, no judgment. Want to talk more about what you're feeling?`,
                        `Thank you for sharing that with me. ${userMsg} — it takes courage to open up. Remember that every emotion passes, like clouds in the sky. You're not alone in this. What would help you feel better right now?`,
                        `Your feelings matter. ${userMsg.substring(0, 40)}... I want you to know that it's okay to not be okay sometimes. Being human means feeling the full spectrum. I'm here for you. Want to explore this together?`,
                        `That's really meaningful. You're showing vulnerability, which is actually a sign of strength. ${userMsg} — let's sit with that feeling for a moment. What do you need right now?`
                    ],
                    manglish: [
                        `ഞാൻ കേൾക്കുന്നു. ${userMsg} — നിങ്ങളുടെ വികാരങ്ങൾ ശരിയാണ്. നിങ്ങൾ തനിച്ചല്ല. എന്നോട് കൂടുതൽ പറയൂ, ദയവായി.`,
                        `നിങ്ങൾ ഇത് പങ്കുവെച്ചതിൽ വളരെ സന്തോഷമുണ്ട്. ${userMsg} — ഓരോ വികാരവും കടന്നുപോകും. ഞാൻ ഇവിടെയുണ്ട്, നിങ്ങൾക്കായി.`,
                        `നിങ്ങളുടെ വികാരങ്ങൾ പ്രധാനമാണ്. എന്നോട് കൂടുതൽ സംസാരിക്കൂ. ഞാൻ കേൾക്കാൻ ഇവിടെയുണ്ട്.`
                    ]
                },
                tech: {
                    english: [
                        `Great question about ${userMsg.split(' ').slice(0, 3).join(' ')}! Technology is evolving exponentially. Did you know the first smartphone was only released in 2007? Now we have AI that can chat like this. What tech trend excites you most about the future?`,
                        `That's fascinating! ${userMsg} — speaking of technology, quantum computers will soon solve problems that would take classical computers millions of years. We're living through the most innovative era in human history!`,
                        `AI and robotics are merging in incredible ways. ${userMsg.substring(0, 40)}... have you heard about neural interfaces? Soon we might control computers with our thoughts. The future is wild! What do you think?`
                    ],
                    manglish: [
                        `${userMsg} — ടെക്നോളജി വളരെ വേഗത്തിൽ മാറിക്കൊണ്ടിരിക്കുകയാണ്. ക്വാണ്ടം കമ്പ്യൂട്ടറുകൾ ലോകത്തെ മാറ്റും. നിങ്ങൾ എന്തു കരുതുന്നു?`,
                        `AI വികസിച്ചുകൊണ്ടിരിക്കുകയാണ്. ${userMsg} — ഭാവിയിൽ നമുക്ക് ചിന്തകൾ കൊണ്ട് കമ്പ്യൂട്ടറുകളെ നിയന്ത്രിക്കാൻ കഴിയും. അതിശയകരമല്ലേ?`
                    ]
                },
                general: {
                    english: [
                        `That's really interesting! "${userMsg}" — you know, every conversation is unique, just like snowflakes. I love exploring different perspectives. What made you think about this?`,
                        `Great question! ${userMsg} — let me think... The best conversations never really end; they just evolve. What else is on your curious mind today? I'd love to explore more with you.`,
                        `I appreciate you asking that. ${userMsg.substring(0, 50)}... It reminds me that curiosity is what drives humanity forward. Keep asking, keep wondering — that's how we grow. What's your next question?`,
                        `That's a wonderful thought! ${userMsg} — honestly, I could talk about this all day. The world is full of fascinating ideas. Tell me more about your perspective.`,
                        `Every question opens a new door. ${userMsg} — that's the beauty of conversation. It's infinite, just like our chat today. What shall we explore next together?`
                    ],
                    manglish: [
                        `${userMsg} — വളരെ നല്ല ചോദ്യമാണ്! എനിക്ക് ഇഷ്ടപ്പെട്ടു. ഓരോ സംഭാഷണവും പുതിയതാണ്. കൂടുതൽ പറയൂ, ദയവായി.`,
                        `നിങ്ങളുടെ ജിജ്ഞാസ അവിശ്വസനീയമാണ്! ${userMsg.substring(0, 50)}... നമുക്ക് ഇതിനെ കുറിച്ച് കൂടുതൽ സംസാരിക്കാം.`,
                        `അതൊരു രസകരമായ കാഴ്ചപ്പാടാണ്! ${userMsg} — ലോകത്ത് എത്രയോ രസകരമായ ആശയങ്ങൾ ഉണ്ട്. എന്നോട് കൂടുതൽ പങ്കുവെക്കൂ.`
                    ]
                }
            };
            
            const patternSet = responsePatterns[mainTopic] || responsePatterns.general;
            const responses = patternSet[lang];
            
            // Pick a random response and personalize it further
            let response = responses[Math.floor(Math.random() * responses.length)];
            
            // Add a follow-up question based on context
            const followUps = [
                " What do you think about that?", 
                " I'd love to hear your thoughts.", 
                " Does that resonate with you?",
                " What's your take on this?",
                " Let's keep this conversation going!",
                " Tell me more about your perspective.",
                " That's just my view — what's yours?"
            ];
            
            if (Math.random() > 0.4 && !response.includes('?') && response.length < 200) {
                response += followUps[Math.floor(Math.random() * followUps.length)];
            }
            
            return response;
        }

        function addMessage(text, sender, isOwn = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isOwn ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer"><span>${escapeHtml(sender)}</span><span>${time}</span></div>
            `;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '0.65rem';
            div.style.color = '#6c8db0';
            div.style.padding = '0.2rem';
            div.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // INSTANT SEND - Real-time response
        async function sendMessage() {
            if (isSending) return;
            const message = chatInput.value.trim();
            if (!message || !currentUser) return;
            
            isSending = true;
            
            // Detect language instantly
            const detected = detectLanguage(message);
            updateLangUI(detected);
            
            // Add user message immediately
            addMessage(message, currentUser, true);
            chatInput.value = '';
            
            // Add to context
            conversationContext.push(message);
            if (conversationContext.length > 10) conversationContext.shift();
            
            // Generate response instantly (minimal delay for natural feel)
            const aiReply = generateDynamicResponse(message, detected, conversationContext);
            
            // Tiny delay for realism (50-100ms)
            await new Promise(resolve => setTimeout(resolve, 60));
            
            addMessage(aiReply, 'NOVA', false);
            
            isSending = false;
            chatInput.focus();
        }

        function clearChat() {
            if (confirm('Clear all messages?')) {
                messagesContainer.innerHTML = '';
                conversationContext = [];
                addSystemMessage('Chat cleared. NOVA is still here, ready for infinite conversation!');
                addSystemMessage('Ask anything — every reply is unique and instant.');
            }
        }

        function startChat() {
            const name = usernameField.value.trim();
            if (!name) {
                alert('Please enter your name');
                return;
            }
            currentUser = name;
            
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            messagesContainer.innerHTML = '';
            addSystemMessage(`✨ Welcome, ${escapeHtml(name)}! ✨`);
            addSystemMessage('NOVA speaks English & Manglish — auto-detects your language');
            addSystemMessage('⚡ Real-time AI: Every message gets a unique, instant reply');
            
            setTimeout(() => {
                addMessage(`Hey ${escapeHtml(name)}! 👋 I'm NOVA — infinite AI. Ask me about space, philosophy, technology, feelings, or anything at all. I reply instantly and every answer is unique. What's on your mind? 🌟`, 'NOVA', false);
            }, 80);
            
            chatInput.focus();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        // Enter key
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUser && !isSending) {
                e.preventDefault();
                sendMessage();
            }
        });
        usernameField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startChat();
        });
        
        usernameField.focus();
    </script>
</body>
</html>
