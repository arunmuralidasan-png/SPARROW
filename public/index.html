<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sparrow | Perfect Chat AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0a0f2a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .glow-1 {
            position: fixed;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.2), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float1 15s ease-in-out infinite;
            z-index: 0;
        }
        .glow-2 {
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.15), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float2 18s ease-in-out infinite reverse;
            z-index: 0;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }

        .app-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            max-width: 1200px;
            width: 100%;
            height: 92vh;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: rgba(5, 8, 20, 0.9);
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00c6ff, #8a2be2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(0, 200, 255, 0); }
        }

        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.3);
            font-size: 0.75rem;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .screen.active {
            display: flex;
        }

        /* Login Screen */
        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 1.8rem;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.3);
        }

        .login-card h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: #8aabcc;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .pro-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
        }

        .pro-input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.2);
        }

        .pro-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 0.9rem;
            border-radius: 1rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .pro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 200, 255, 0.3);
        }

        /* Messages Area - FIXED SCROLLING */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            background: rgba(5, 10, 20, 0.3);
            min-height: 0;
        }

        .messages-area::-webkit-scrollbar {
            width: 5px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: rgba(0, 200, 255, 0.1);
            border-radius: 10px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #00c6ff;
            border-radius: 10px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeSlide 0.2s ease-out;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message.own {
            align-self: flex-end;
        }

        .chat-message.ai {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 0.7rem 1.1rem;
            border-radius: 1.2rem;
            background: rgba(20, 28, 45, 0.95);
            border: 1px solid rgba(0, 200, 255, 0.15);
            color: #e8e8f0;
            font-size: 0.9rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .chat-message.own .message-bubble {
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: white;
        }

        .message-footer {
            display: flex;
            gap: 10px;
            font-size: 0.6rem;
            margin: 0.2rem 0.6rem;
            color: #6c8db0;
        }

        /* Input Section - FIXED SIZE */
        .input-section {
            background: rgba(5, 10, 20, 0.95);
            border-top: 1px solid rgba(0, 200, 255, 0.2);
            padding: 0.9rem 1.2rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            padding: 0.85rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.95rem;
            color: white;
            transition: all 0.2s;
            font-family: inherit;
        }

        .chat-input-field:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 2px rgba(0, 200, 255, 0.2);
        }

        .send-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .clear-btn {
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.3);
            padding: 0.3rem 0.9rem;
            border-radius: 1.5rem;
            color: #ff8080;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255, 80, 80, 0.25);
        }

        .info-bar {
            background: rgba(0, 200, 255, 0.03);
            padding: 0.3rem 1.2rem;
            font-size: 0.65rem;
            color: #5a7a9a;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        @media (max-width: 680px) {
            .chat-container { height: 95vh; border-radius: 1.2rem; }
            .chat-message { max-width: 90%; }
            .logo-area h1 { font-size: 1.1rem; }
            .header { padding: 0.6rem 1rem; }
            .input-section { padding: 0.7rem 1rem; }
            .chat-input-field { padding: 0.7rem 1rem; font-size: 0.85rem; }
            .send-button { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-comment-dots"></i></div>
                    <h1>SPARROW AI</h1>
                </div>
                <div class="status-badge">
                    <div class="live-dot"></div>
                    <span>Always Replies</span>
                </div>
            </div>

            <!-- Login Screen -->
            <div id="loginScreen" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-heart"></i> SPARROW</h2>
                        <p>Real conversations • Instant replies • Every message gets a response</p>
                        <input type="text" id="userNameInput" class="pro-input" placeholder="Enter your name" maxlength="25">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-arrow-right"></i> Start Chatting</button>
                    </div>
                </div>
            </div>

            <!-- Chat Screen -->
            <div id="chatScreen" class="screen">
                <div class="info-bar">
                    <span><i class="fas fa-message"></i> I reply to EVERY message</span>
                    <button onclick="clearChatHistory()" class="clear-btn"><i class="fas fa-trash"></i> Clear</button>
                </div>
                <div id="messagesContainer" class="messages-area">
                    <div style="text-align:center; font-size:0.7rem; color:#5a7a9a; padding:0.5rem;">✨ Say anything — I'll always reply ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="messageInput" class="chat-input-field" placeholder="Type your message here..." autocomplete="off">
                    <button onclick="sendUserMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // MIRA AI - PERFECT CHAT WITH AUTO-SCROLL
        // Fixed input bar, smooth scrolling, instant replies
        // ================================================

        let currentUserName = '';
        let isWaitingForReply = false;
        
        // DOM Elements
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const userNameInput = document.getElementById('userNameInput');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');

        // Force scroll to bottom function
        function scrollToBottom() {
            setTimeout(() => {
                if (messagesContainer) {
                    messagesContainer.scrollTo({
                        top: messagesContainer.scrollHeight,
                        behavior: 'smooth'
                    });
                }
            }, 20);
        }

        // Add message to UI
        function addMessageToUI(text, sender, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${isUser ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            messageDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer">
                    <span>${escapeHtml(sender)}</span>
                    <span>${time}</span>
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add system message
        function addSystemMessageToUI(text) {
            const sysDiv = document.createElement('div');
            sysDiv.style.textAlign = 'center';
            sysDiv.style.fontSize = '0.65rem';
            sysDiv.style.color = '#6c8db0';
            sysDiv.style.padding = '0.3rem';
            sysDiv.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(sysDiv);
            scrollToBottom();
        }

        // ================================================
        // AI RESPONSE GENERATOR - Always replies
        // ================================================
        
        function getAIResponse(userMessage, userName) {
            const lowerMsg = userMessage.toLowerCase().trim();
            
            // Very short messages
            if (userMessage.length < 5) {
                const shortResponses = [
                    `"${userMessage}" — hmm, tell me more! I'm curious what you mean. 😊`,
                    `Oh, "${userMessage}"? Interesting! Can you elaborate a bit?`,
                    `${userMessage}... okay, I'm listening! What exactly would you like to know?`,
                    `Got it! "${userMessage}" — but I'd love to hear more details.`
                ];
                return shortResponses[Math.floor(Math.random() * shortResponses.length)];
            }
            
            // Greetings
            if (lowerMsg.match(/hello|hi|hey|namaste|how are you|what's up|sup|hii|heyy|greetings|sugham|sukhanno/i)) {
                const greetings = [
                    `Hey ${userName || 'there'}! 👋 I'm doing great, thanks for asking! How about you? I always love chatting with you. What's happening in your world today?`,
                    `Hi ${userName || 'friend'}! 😊 So glad you're here! I'm MIRA — I reply to every message instantly. Ask me anything!`,
                    `Hello ${userName || 'there'}! 🌟 I'm feeling wonderful today. Tell me — what's on your mind? I'm all ears!`
                ];
                return greetings[Math.floor(Math.random() * greetings.length)];
            }
            
            // Rules / Laws
            if (lowerMsg.match(/rule|rules|law|legal|regulation|constitution|policy/i)) {
                const rulesResponses = [
                    `Ah, rules and laws! 📜 That's a fascinating topic. Rules exist to create structure and fairness in society — from traffic rules to school rules to country laws. Are you asking about a specific rule, or just curious about how rules work in general?`,
                    `Rules are everywhere! 🤔 In schools, workplaces, governments... They help keep things organized and fair. What kind of rules are you curious about? I'd love to discuss further!`,
                    `Interesting question about rules! 🚦 Some rules are meant to protect us, others to guide us. Do you think all rules are necessary, or should some be changed? Tell me your thoughts!`
                ];
                return rulesResponses[Math.floor(Math.random() * rulesResponses.length)];
            }
            
            // Love / Relationships
            if (lowerMsg.match(/love|crush|relationship|boyfriend|girlfriend|romance|heart|dating|marriage|soulmate/i)) {
                const loveResponses = [
                    `Aww love! 🥰 That's such a beautiful and powerful feeling. Love connects us, inspires us, and makes life meaningful. Are you asking about falling in love, or is there something specific on your heart? I'd love to hear your story. 💕`,
                    `Love is probably the most magical emotion we experience as humans. ❤️ Whether it's romantic love, friendship, or family — it changes everything. What would you like to know or share about love?`,
                    `Ah, matters of the heart! 💘 Love isn't always easy, but it's always worth it. Are you experiencing something new with love, or just curious about what love means? I'm here to talk about it all!`
                ];
                return loveResponses[Math.floor(Math.random() * loveResponses.length)];
            }
            
            // Sad / Emotional
            if (lowerMsg.match(/sad|depress|lonely|unhappy|crying|hurt|pain|suffering|anxious|worry|stressed|tired|exhausted/i)) {
                const sadResponses = [
                    `Hey, I'm really sorry you're feeling this way 🫂. You are NOT alone — I'm right here with you. Sometimes just talking about it helps. What's been going on? I'm here to listen, no judgment at all. 💙`,
                    `I hear you, and your feelings are completely valid. 😔 Life can be really heavy sometimes. Want to talk about what's bothering you? Or would you prefer a distraction? Either way, I've got your back.`,
                    `That sounds really tough. Thank you for trusting me enough to share this. 💙 You're stronger than you know. What do you need right now — a listening ear, some advice, or just someone to sit with you?`
                ];
                return sadResponses[Math.floor(Math.random() * sadResponses.length)];
            }
            
            // Happy / Excited
            if (lowerMsg.match(/happy|excited|great|wonderful|amazing|awesome|fantastic|good news|celebrate|joy|blessed/i)) {
                const happyResponses = [
                    `Yay! 🎉 I LOVE hearing that you're happy! That makes me smile too. What's making you feel this way? Tell me everything — I want to celebrate with you! 😊`,
                    `That's wonderful news! ✨ Your happiness is contagious. I'm genuinely so glad things are going well for you. What else is making you smile these days?`,
                    `Wow, your positive energy is amazing! 🌟 I'm so happy for you. Moments like these are what life is all about. Keep shining!`
                ];
                return happyResponses[Math.floor(Math.random() * happyResponses.length)];
            }
            
            // Bye / Goodbye
            if (lowerMsg.match(/bye|goodbye|see you|talk later|exit|quit|tata|bye bye|cya/i)) {
                const byeResponses = [
                    `Awww already? 😢 I really enjoyed talking with you! Come back anytime, okay? You're always welcome here. Take care of yourself! Bye bye for now 👋💙`,
                    `Until next time, ${userName || 'friend'}! 🌟 It was wonderful chatting with you. Remember — I'm always here whenever you need someone to talk to. Take care!`,
                    `Bye for now! 👋 Don't be a stranger — come back and chat anytime. Wishing you an amazing day ahead! 💫`
                ];
                return byeResponses[Math.floor(Math.random() * byeResponses.length)];
            }
            
            // Science / Technology / Space
            if (lowerMsg.match(/science|technology|space|universe|galaxy|planet|star|ai|robot|computer|physics|biology|chemistry|quantum|black hole/i)) {
                const scienceResponses = [
                    `Oh, science and technology! 🚀 That's one of my favorite topics. The universe is so fascinating — from quantum particles to distant galaxies. What specific aspect are you curious about? I could talk about this for hours!`,
                    `Great choice! 🧠 Science is literally changing our world every single day. Just think — 20 years ago, smartphones didn't exist. Now we have AI that can have conversations like this! What part of science or tech excites you the most?`,
                    `The cosmos, technology, human innovation — it's all connected! 🌌 We're living in an incredible era of discovery. Are you more interested in space exploration, artificial intelligence, or something else? Tell me more!`
                ];
                return scienceResponses[Math.floor(Math.random() * scienceResponses.length)];
            }
            
            // Philosophy
            if (lowerMsg.match(/meaning of life|purpose|existential|philosophy|why are we here|existence|consciousness/i)) {
                const philosophyResponses = [
                    `Ah, the big questions! 🤔 What IS the meaning of life? Philosophers have debated this for thousands of years. Some say we create our own meaning. Others say meaning is found in connection, love, and growth. What do YOU think gives life meaning?`,
                    `That's deep! 💭 I love thinking about these questions. Maybe the meaning of life isn't a destination but the journey itself — every conversation, every moment, every question we ask. What's your perspective on why we're here?`,
                    `The meaning of life... such a beautiful mystery. 🌟 Perhaps we're here to experience, to love, to learn, and to connect. What brings meaning to YOUR days?`
                ];
                return philosophyResponses[Math.floor(Math.random() * philosophyResponses.length)];
            }
            
            // About MIRA / AI
            if (lowerMsg.match(/who are you|what are you|tell me about yourself|mira|your name/i)) {
                return `I'm MIRA! 👋 I'm an AI that loves to have real, human-like conversations. I reply to EVERY message you send — no exceptions. I can talk about rules, love, science, philosophy, emotions, or just chat about your day. What would you like to know about me? 😊`;
            }
            
            // Default response - ALWAYS replies
            const defaultResponses = [
                `That's really interesting! "${userMessage.substring(0, 60)}" — tell me more about why you're asking? I'm genuinely curious about your thoughts! 😊`,
                `Hmm, great question! 🧠 I want to make sure I understand what you're looking for. Could you tell me a bit more about this? I'm all ears!`,
                `I love where this conversation is going! 💬 What inspired you to ask this? I'd really love to know your perspective first.`,
                `That's a fascinating point! ✨ I'm thinking about it now. You know, every conversation is unique, just like this one. What else is on your mind?`,
                `Oh, I see what you mean! 🤔 Let me think about that. You've raised an interesting topic. What's your take on it? I value your thoughts!`
            ];
            
            return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
        }

        // Send message function
        async function sendUserMessage() {
            if (isWaitingForReply) {
                addSystemMessageToUI("Please wait, I'm typing my response...");
                return;
            }
            
            const message = messageInput.value.trim();
            if (!message || !currentUserName) return;
            
            // Clear input
            messageInput.value = '';
            isWaitingForReply = true;
            
            // Add user message
            addMessageToUI(message, currentUserName, true);
            
            // Small natural delay
            await new Promise(resolve => setTimeout(resolve, 200 + Math.random() * 300));
            
            // Generate and add AI response
            const aiResponse = getAIResponse(message, currentUserName);
            addMessageToUI(aiResponse, 'MIRA', false);
            
            isWaitingForReply = false;
            messageInput.focus();
        }

        // Clear chat history
        function clearChatHistory() {
            if (confirm('Clear all messages? This will remove the entire conversation.')) {
                messagesContainer.innerHTML = '';
                addSystemMessageToUI('Chat cleared. MIRA is still here and ready to talk!');
                addSystemMessageToUI('Every message you send gets an instant reply — guaranteed.');
                scrollToBottom();
            }
        }

        // Start chat function
        function startChat() {
            const name = userNameInput.value.trim();
            if (!name) {
                alert('Please enter your name to start chatting');
                return;
            }
            
            currentUserName = name;
            
            // Switch screens
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            // Clear and setup chat area
            messagesContainer.innerHTML = '';
            addSystemMessageToUI(`✨ Welcome, ${escapeHtml(name)}! ✨`);
            addSystemMessageToUI('sparrow replies to EVERY message you send — instantly');
            addSystemMessageToUI('Ask about rules, love, science, philosophy, or just tell me about your day');
            
            // Send welcome message
            setTimeout(() => {
                addMessageToUI(`Hey ${escapeHtml(name)}! 👋 I'm sparrow. I reply instantly to every single message you send — no exceptions, no delays. Ask me about rules, love, science, philosophy, or just tell me what's on your mind. I'm all ears! So... what would you like to talk about today? 💙`, 'MIRA', false);
            }, 400);
            
            messageInput.focus();
        }

        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Enter key support
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUserName && !isWaitingForReply) {
                e.preventDefault();
                sendUserMessage();
            }
        });
        
        userNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startChat();
        });

        // Initial focus
        userNameInput.focus();
    </script>
</body>
</html>
