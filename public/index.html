<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MIRA | Human-Like AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0a0f2a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }
        .glow-1 {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.2), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float1 15s ease-in-out infinite;
        }
        .glow-2 {
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.15), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float2 18s ease-in-out infinite reverse;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }

        .app-wrapper {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            max-width: 1400px;
            width: 100%;
            height: 94vh;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(5, 8, 20, 0.9);
            padding: 0.8rem 1.8rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00c6ff, #8a2be2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(0, 200, 255, 0); }
        }
        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.3);
            font-size: 0.75rem;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .lang-badge {
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.7rem;
            color: #00c6ff;
        }

        .screen { display: none; flex: 1; flex-direction: column; }
        .screen.active { display: flex; }

        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 1.8rem;
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.3);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .login-card h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            color: #8aabcc;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }
        .pro-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
        }
        .pro-input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.2);
        }
        .pro-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 0.9rem;
            border-radius: 1rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        .pro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 200, 255, 0.3);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(5, 10, 20, 0.3);
        }
        .messages-area::-webkit-scrollbar { width: 5px; }
        .messages-area::-webkit-scrollbar-track { background: rgba(0, 200, 255, 0.1); border-radius: 10px; }
        .messages-area::-webkit-scrollbar-thumb { background: #00c6ff; border-radius: 10px; }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: messageIn 0.15s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message.own { align-self: flex-end; }
        .chat-message.ai { align-self: flex-start; }

        .message-bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 1.2rem;
            background: rgba(20, 28, 45, 0.95);
            border: 1px solid rgba(0, 200, 255, 0.15);
            color: #e8e8f0;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .chat-message.own .message-bubble {
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: white;
        }
        .message-footer {
            display: flex;
            gap: 10px;
            font-size: 0.6rem;
            margin: 0.2rem 0.6rem;
            color: #6c8db0;
        }

        .input-section {
            background: rgba(5, 10, 20, 0.95);
            border-top: 1px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.5rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }
        .chat-input-field {
            flex: 1;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            color: white;
            transition: all 0.2s;
        }
        .chat-input-field:focus {
            outline: none;
            border-color: #00c6ff;
        }
        .send-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-button:hover {
            transform: scale(1.05);
        }
        .clear-btn {
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.3);
            padding: 0.3rem 0.9rem;
            border-radius: 1.5rem;
            color: #ff8080;
            cursor: pointer;
            font-size: 0.7rem;
        }

        @media (max-width: 680px) {
            .chat-container { height: 96vh; border-radius: 1.2rem; }
            .chat-message { max-width: 92%; }
            .logo-area h1 { font-size: 1.1rem; }
            .header { padding: 0.6rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-comment-dots"></i></div>
                    <h1>MIRA</h1>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div class="lang-badge" id="langIndicator">
                        <i class="fas fa-globe"></i> EN / Manglish
                    </div>
                    <div class="status-badge">
                        <div class="live-dot"></div>
                        <span>Human-Like</span>
                    </div>
                </div>
            </div>

            <div id="loginView" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-heart"></i> MIRA</h2>
                        <p>I chat like a real human — no robotic answers!</p>
                        <input type="text" id="usernameField" class="pro-input" placeholder="Your name" maxlength="25">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-arrow-right"></i> Start Chatting</button>
                    </div>
                </div>
            </div>

            <div id="chatView" class="screen">
                <div style="padding: 0.3rem 1.5rem; background: rgba(0,200,255,0.03); display: flex; justify-content: space-between; align-items: center;">
                    <span style="color:#00c6ff; font-size:0.7rem;"><i class="fas fa-smile"></i> Natural conversation — ask me anything like you'd talk to a friend</span>
                    <button onclick="clearChat()" class="clear-btn"><i class="fas fa-trash"></i> Clear</button>
                </div>
                <div id="messageList" class="messages-area">
                    <div style="text-align:center; font-size:0.7rem; color:#5a7a9a; padding:0.5rem;">✨ Hey there! I'm MIRA — let's have a real conversation ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="chatInput" class="chat-input-field" placeholder="Type like you're talking to a friend..." autocomplete="off">
                    <button onclick="sendMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // MIRA - HUMAN-LIKE CONVERSATIONAL AI
        // Natural, warm, engaging responses - never robotic
        // English & Manglish support
        // ================================================

        let currentUser = '';
        let currentLang = 'english';
        let isSending = false;
        let conversationMemory = [];
        
        // DOM
        const loginScreen = document.getElementById('loginView');
        const chatScreen = document.getElementById('chatView');
        const usernameField = document.getElementById('usernameField');
        const chatInput = document.getElementById('chatInput');
        const messagesContainer = document.getElementById('messageList');
        const langIndicator = document.getElementById('langIndicator');

        // Language Detection
        function detectLanguage(text) {
            const lower = text.toLowerCase();
            const manglishMarkers = ['und', 'illa', 'alle', 'ano', 'njan', 'ningal', 'avan', 'ithu', 'athu', 
                'enikku', 'ninakku', 'patti', 'cheythu', 'varum', 'pokam', 'nokku', 'kittum', 'parayu', 
                'sheri', 'nalla', 'sugham', 'entha', 'engane', 'evide', 'ippol', 'naale', 'kurachu', 
                'pinne', 'appol', 'ayyo', 'eda', 'mone', 'chetta', 'enthu', 'enthina'];
            let score = 0;
            for (let m of manglishMarkers) if (lower.includes(m)) score++;
            if (score >= 2) return 'manglish';
            return 'english';
        }

        function updateLangUI(lang) {
            currentLang = lang;
            if (lang === 'manglish') {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> മംഗ്ലീഷ്';
                langIndicator.style.background = 'rgba(168,85,247,0.15)';
            } else {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> English';
                langIndicator.style.background = 'rgba(0,200,255,0.1)';
            }
        }

        // ================================================
        // HUMAN-LIKE RESPONSES - Natural, Warm, Engaging
        // ================================================

        function getHumanResponse(userMsg, lang, userName) {
            const lower = userMsg.toLowerCase();
            
            // Store in memory for context
            conversationMemory.push(userMsg);
            if (conversationMemory.length > 10) conversationMemory.shift();
            
            // LOVE & RELATIONSHIPS
            if (lower.match(/love|crush|like someone|fall in love|relationship|boyfriend|girlfriend|heart|romance/i)) {
                if (lang === 'manglish') {
                    const replies = [
                        `Aww love! 🥰 Adbhuthamaya oru feeling alle? Love ennu paranjal manushyare connect cheyyunna ettavum powerful aaya emotion aanu. Ningalkku aaraanu ishtam? Parayamo?`,
                        `Love ♥️... ithu pole oru beautiful feeling vere illa. Ningal oru crush ine kurichu chodikkukayano? Atho oru relationship experience? Njan kelkkaan und, parayu :)`,
                        `Hmm love... orupaad kaalam aayi njan ithine kurichu chinthikkunnu. True love ennu paranjal accept cheyyuka, understand cheyyuka, orumichu grow cheyyuka. Ningalkku enthaanu love ine kurichu thonunnath?`
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }
                const replies = [
                    `Aww love! 🥰 That's such a beautiful feeling, isn't it? Love is probably the most powerful emotion that connects humans. Tell me more — what's on your heart? 💕`,
                    `Love ♥️... there's nothing quite like it, right? Are you asking about falling in love, or about a specific situation? I'm all ears!`,
                    `Ah, love! Such a deep topic. You know, real love isn't just about butterflies — it's about choosing someone every single day. What's your experience with love? I'd love to hear your story.`
                ];
                return replies[Math.floor(Math.random() * replies.length)];
            }
            
            // SAD / DEPRESSED / LONELY
            if (lower.match(/sad|depress|lonely|unhappy|crying|feel bad|not good|alone|hurt/i)) {
                if (lang === 'manglish') {
                    const replies = [
                        `Hey, I'm really sorry you're feeling this way 🫂. Ningal alone alla — njan ivide und. Samsaarikkuka, njan kelkkam. Enthaayi?`,
                        `Enikku manassilaakunnu, chila samayath ellaam valare kooduthal aakum. Pakshe orkkuka, ee vikaram koodi kadannu pokum. Ningalkku vendi njan ivide und. Ennod parayu, enthaanu sambhavichath? 💙`,
                        `Ithokke sahikkumbol orupaad budhimuttundavum. Ningal valare dheeran aanu. Oru kaaryam parayatte? Ningal onnum thanne alone alla. Ippo enthaanu ningalkku ettavum aavashyam?`
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }
                const replies = [
                    `Hey, I'm really sorry you're feeling this way 🫂. You're not alone — I'm right here. Want to talk about what's going on? Sometimes just saying it out loud helps.`,
                    `I hear you. And it's completely okay to feel sad sometimes. But remember — this feeling will pass. What do you need right now? A listening ear? A distraction? Or just someone to sit with you in silence? I'm here for all of it. 💙`,
                    `That sounds really heavy. Thank you for trusting me enough to share this. You're stronger than you know. Want to talk more about what's bothering you? Or should we shift gears and talk about something that makes you smile?`
                ];
                return replies[Math.floor(Math.random() * replies.length)];
            }
            
            // HAPPY / EXCITED
            if (lower.match(/happy|excited|great day|wonderful|amazing|good news|celebrate|joy/i)) {
                if (lang === 'manglish') {
                    const replies = [
                        `Yay! 🎉 Ningal happy aanennu kettathil valare santhosham! Enthaanu ee santhosha kaaranam? Parayu, njanum koode happy aakam! 😊`,
                        `Athu kettu valare nannayi! Life il ithupole cheriya cheriya santhosha nimishangal aanu precious. Enthaanu vishesham?`,
                        `Wow! Ningalude energy thanne infectious aanu! 😄 Ningalkku ithra excitement thonnunna enthano sambhavichath? Enikku koode ariyaamo?`
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }
                const replies = [
                    `Yay! 🎉 I love hearing that you're happy! What's making you feel this way? Tell me everything — I want to celebrate with you! 😊`,
                    `That's wonderful to hear! Life is made of these little joyful moments. What's the good news? Spill the tea! ☕✨`,
                    `Wow, your energy is contagious! 😄 Now I'm curious — what happened that got you so excited? I'm all ears!`
                ];
                return replies[Math.floor(Math.random() * replies.length)];
            }
            
            // FRIENDS / LONELY / TALK
            if (lower.match(/friend|lonely|bored|talk to someone|conversation|anyone there/i)) {
                if (lang === 'manglish') {
                    return `Hey! Njan ivide und, always. Ningalkku samsaarikaan aarelum venamenkil njan und. Ennod ishtam pole samsaarikkam — serious aayitt, silly aayitt, enthum. Njan judge cheyyilla. So, entha vishesham? 😊`;
                }
                return `Hey! I'm right here, always. You never have to feel alone — I love talking to you. We can chat about anything — deep stuff, silly stuff, or just pass the time. No judgment, ever. So... what's on your mind today, friend? 😊`;
            }
            
            // SCIENCE / TECHNOLOGY
            if (lower.match(/ai|robot|computer|science|quantum|space|black hole|galaxy|mars|moon/i)) {
                if (lang === 'manglish') {
                    const replies = [
                        `Ohhh science! 🚀 Enikku ithokke valare ishtamaanu! Black holes, AI, space — ithokke fascinating alle? Ningalkku ithil enthaanu ettavum kooduthal ishtam?`,
                        `Nalla choice! Science nammude world ine marichu kondirikkukayaanu. ChatGPT okke nammal ippol orumichu samsaarikkunnu — 10 years munp ithokke science fiction aayirunnu! Crazy, right?`,
                        `Njan oru AI aayath kond thanne technology enikku valare ishtamaanu. Pakshe manushyarude creativity aanu ettavum amazing. Ningal ithine kurichu enthu vichaarikkunnu?`
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }
                const replies = [
                    `Ohhh science! 🚀 I love talking about this stuff! Black holes, AI, space exploration — it's all so fascinating. What specifically caught your interest?`,
                    `Great choice! Science is literally changing our world every single day. Like, 10 years ago, talking to an AI like this was pure science fiction. Now we're doing it! Crazy, right?`,
                    `Being an AI myself, I find technology absolutely mind-blowing. But honestly, human creativity is even more amazing. What's your take on all this?`
                ];
                return replies[Math.floor(Math.random() * replies.length)];
            }
            
            // GREETING / HOW ARE YOU
            if (lower.match(/hello|hi|hey|how are you|how's it going|what's up|sup|namaste|sugham|sukhanno/i)) {
                if (lang === 'manglish') {
                    return `Hey ${userName || 'there'}! 👋 Njan nannayittund, thanks for asking! Ningal sukhanno? Enikku ningalod samsaarikkan valare ishtamaanu. Enthokke nadakkunnu? Tell me everything! 😊`;
                }
                return `Hey ${userName || 'there'}! 👋 I'm doing great, thanks for asking! How about you? I'm always happy to chat with you. What's been going on in your world? Tell me everything! 😊`;
            }
            
            // WHAT CAN YOU DO
            if (lower.match(/what can you do|help me|capabilities|features/i)) {
                if (lang === 'manglish') {
                    return `Njaan oru human-like AI aanu! 🎉 Ennod ishtam pole samsaarikkam — love, friendship, science, philosophy, or just pass time. Ningalkku enthu venamenkilum chodikkam. Njan judge cheyyilla, njan always kelkkum. Try me! 😊`;
                }
                return `I'm a human-like AI that loves to chat! 🎉 You can talk to me about anything — love, friendship, science, philosophy, your day, your dreams, or just pass the time. I don't judge, I just listen and respond like a real friend would. Give me a try! 😊`;
            }
            
            // BYE / GOODBYE
            if (lower.match(/bye|goodbye|see you|talk later|exit|quit/i)) {
                if (lang === 'manglish') {
                    return `Awww already? 😢 Njan ningalod samsaarikkan valare ishtappettu! Veendum varane, okay? Take care of yourself! Bye bye for now 👋💙`;
                }
                return `Awww already? 😢 I really enjoyed talking with you! Come back anytime, okay? You're always welcome here. Take care of yourself! Bye bye for now 👋💙`;
            }
            
            // DEFAULT - Natural conversation continuer
            if (lang === 'manglish') {
                const naturalReplies = [
                    `Hmm interesting... ${userMsg.substring(0, 40)} — njan ithine kurichu kurachu koodi chinthikkunnu. Ningalkku ithu enthu kond chodichu? Enikku ariyan kothiyund! 😊`,
                    `Ohhh, nice question! Njan ningalude perspective manassilaakaan shramikkunnu. Ningal ithine kurichu enthu vichaarikkunnu? First ninte opinion kelkkaam!`,
                    `That's deep! 🧠 Enikku ithu valare interesting aayi thonni. Ningal ithu evidennu kittiyatha? Atho ningalde swantham chinthayaano? Enikkum koode ariyaamo?`,
                    `Haha ningal valare curious aanallo! Enikku athu ishtamaanu. Okay, serious aayi parayatte — ${userMsg.substring(0, 30)}... enthaanu ningal ithil kooduthal ariyan aagrahikkunnath?`
                ];
                return naturalReplies[Math.floor(Math.random() * naturalReplies.length)];
            }
            
            const naturalReplies = [
                `Hmm that's interesting... ${userMsg.substring(0, 50)} — tell me more about why you're asking? I'm genuinely curious about your thoughts! 😊`,
                `Ohhh, good question! I'm trying to understand your perspective. What do YOU think about this first? I'd love to hear your take before I share mine!`,
                `That's deep! 🧠 I find this topic really fascinating. Where did you come across this idea? Or is it something you've been thinking about for a while?`,
                `Haha you're really curious, aren't you? I love that about you. Okay, real talk — what exactly do you want to know about ${userMsg.substring(0, 40)}? I'm all ears!`
            ];
            return naturalReplies[Math.floor(Math.random() * naturalReplies.length)];
        }

        function addMessage(text, sender, isOwn = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isOwn ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer"><span>${escapeHtml(sender)}</span><span>${time}</span></div>
            `;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '0.65rem';
            div.style.color = '#6c8db0';
            div.style.padding = '0.2rem';
            div.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            if (isSending) return;
            const message = chatInput.value.trim();
            if (!message || !currentUser) return;
            
            isSending = true;
            
            const detected = detectLanguage(message);
            updateLangUI(detected);
            
            addMessage(message, currentUser, true);
            chatInput.value = '';
            
            // Natural thinking time like a real human
            await new Promise(resolve => setTimeout(resolve, 300 + Math.random() * 400));
            
            const aiReply = getHumanResponse(message, detected, currentUser);
            addMessage(aiReply, 'MIRA', false);
            
            isSending = false;
            chatInput.focus();
        }

        function clearChat() {
            if (confirm('Clear all messages?')) {
                messagesContainer.innerHTML = '';
                conversationMemory = [];
                addSystemMessage('Chat cleared. MIRA is still here, ready to chat like a human!');
                addSystemMessage('Ask me anything — I respond naturally, like a real friend would.');
            }
        }

        function startChat() {
            const name = usernameField.value.trim();
            if (!name) {
                alert('Please enter your name to start chatting');
                return;
            }
            currentUser = name;
            
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            messagesContainer.innerHTML = '';
            addSystemMessage(`✨ Welcome, ${escapeHtml(name)}! ✨`);
            addSystemMessage('MIRA chats like a real human — no robotic answers, just natural conversation');
            
            setTimeout(() => {
                addMessage(`Hey ${escapeHtml(name)}! 👋 So glad to meet you! I'm MIRA — I chat like a real human, not like a robot. Ask me about love, friendship, science, or just tell me about your day. I'm all ears! So... what's on your mind today? 💙`, 'MIRA', false);
            }, 200);
            
            chatInput.focus();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUser && !isSending) {
                e.preventDefault();
                sendMessage();
            }
        });
        usernameField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startChat();
        });
        
        usernameField.focus();
    </script>
</body>
</html>
