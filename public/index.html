<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NOVA | Instant AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0a0f2a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }
        .glow-1 {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.2), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float1 15s ease-in-out infinite;
        }
        .glow-2 {
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.15), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float2 18s ease-in-out infinite reverse;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            pointer-events: none;
            background: radial-gradient(circle, #00c6ff, transparent);
            border-radius: 50%;
            animation: particleFloat linear infinite;
            z-index: 0;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-20vh) translateX(60px); opacity: 0; }
        }

        /* Main Container */
        .app-wrapper {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            max-width: 1400px;
            width: 100%;
            height: 94vh;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            background: rgba(5, 8, 20, 0.9);
            padding: 0.8rem 1.8rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00c6ff, #8a2be2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(0, 200, 255, 0); }
        }
        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.3);
            font-size: 0.75rem;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .lang-badge {
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.7rem;
            color: #00c6ff;
        }

        /* Screens */
        .screen { display: none; flex: 1; flex-direction: column; }
        .screen.active { display: flex; }

        /* Login */
        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 1.8rem;
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.3);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .login-card h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            color: #8aabcc;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }
        .pro-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
        }
        .pro-input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.2);
        }
        .pro-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 0.9rem;
            border-radius: 1rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        .pro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 200, 255, 0.3);
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(5, 10, 20, 0.3);
        }
        .messages-area::-webkit-scrollbar { width: 5px; }
        .messages-area::-webkit-scrollbar-track { background: rgba(0, 200, 255, 0.1); border-radius: 10px; }
        .messages-area::-webkit-scrollbar-thumb { background: #00c6ff; border-radius: 10px; }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: messageIn 0.2s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message.own { align-self: flex-end; }
        .chat-message.ai { align-self: flex-start; }

        .message-bubble {
            padding: 0.7rem 1.2rem;
            border-radius: 1.2rem;
            background: rgba(20, 28, 45, 0.95);
            border: 1px solid rgba(0, 200, 255, 0.15);
            color: #e8e8f0;
            font-size: 0.9rem;
            line-height: 1.45;
        }
        .chat-message.own .message-bubble {
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: white;
        }
        .message-footer {
            display: flex;
            gap: 10px;
            font-size: 0.6rem;
            margin: 0.2rem 0.6rem;
            color: #6c8db0;
        }

        /* Typing indicator - fast and subtle */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.5rem 1rem;
            background: rgba(0, 200, 255, 0.08);
            border-radius: 1.5rem;
            width: fit-content;
            font-size: 0.7rem;
            color: #00c6ff;
        }
        .dot-flash {
            animation: flash 0.8s infinite;
        }
        @keyframes flash {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Input Section */
        .input-section {
            background: rgba(5, 10, 20, 0.95);
            border-top: 1px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.5rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }
        .chat-input-field {
            flex: 1;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            color: white;
            transition: all 0.2s;
        }
        .chat-input-field:focus {
            outline: none;
            border-color: #00c6ff;
        }
        .send-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-button:hover {
            transform: scale(1.05);
        }
        .clear-btn {
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.3);
            padding: 0.3rem 0.9rem;
            border-radius: 1.5rem;
            color: #ff8080;
            cursor: pointer;
            font-size: 0.7rem;
        }

        @media (max-width: 680px) {
            .chat-container { height: 96vh; border-radius: 1.2rem; }
            .chat-message { max-width: 92%; }
            .logo-area h1 { font-size: 1.1rem; }
            .header { padding: 0.6rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>
    <div id="particles"></div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-bolt"></i></div>
                    <h1>NOVA AI</h1>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div class="lang-badge" id="langIndicator">
                        <i class="fas fa-globe"></i> EN / മം
                    </div>
                    <div class="status-badge">
                        <div class="live-dot"></div>
                        <span>Instant</span>
                    </div>
                </div>
            </div>

            <!-- Login -->
            <div id="loginView" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-comment"></i> NOVA AI</h2>
                        <p>Instant responses • English & Manglish • Never delays</p>
                        <input type="text" id="usernameField" class="pro-input" placeholder="Enter your name" maxlength="25">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-arrow-right"></i> Start Chatting</button>
                    </div>
                </div>
            </div>

            <!-- Chat -->
            <div id="chatView" class="screen">
                <div style="padding: 0.3rem 1.5rem; background: rgba(0,200,255,0.03); display: flex; justify-content: space-between; align-items: center;">
                    <span style="color:#00c6ff; font-size:0.7rem;"><i class="fas fa-bolt"></i> Zero delay — instant AI responses</span>
                    <button onclick="clearChat()" class="clear-btn"><i class="fas fa-trash"></i> Clear</button>
                </div>
                <div id="messageList" class="messages-area">
                    <div style="text-align:center; font-size:0.7rem; color:#5a7a9a; padding:0.5rem;">✨ NOVA is ready — type anything, get instant reply ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="chatInput" class="chat-input-field" placeholder="Type in English or Manglish..." autocomplete="off">
                    <button onclick="sendMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // NOVA AI - INSTANT RESPONSES | NO DELAY
        // English + Manglish Auto-Detection
        // ================================================

        let currentUser = '';
        let currentLang = 'english';
        let isSending = false;
        
        // DOM
        const loginScreen = document.getElementById('loginView');
        const chatScreen = document.getElementById('chatView');
        const usernameField = document.getElementById('usernameField');
        const chatInput = document.getElementById('chatInput');
        const messagesContainer = document.getElementById('messageList');
        const langIndicator = document.getElementById('langIndicator');

        // Particles (lightweight)
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.width = (Math.random() * 5 + 2) + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = Math.random() * 10 + 6 + 's';
            p.style.animationDelay = Math.random() * 8 + 's';
            document.getElementById('particles').appendChild(p);
        }

        // Language Detection - Fast
        function detectLanguage(text) {
            const lower = text.toLowerCase();
            const manglishMarkers = ['und', 'illa', 'alle', 'ano', 'njan', 'ningal', 'avan', 'ithu', 'athu', 'enikku', 'ninakku', 'patti', 'cheythu', 'varum', 'pokam', 'nokku', 'kittum', 'parayu', 'sheri', 'nalla', 'sugham', 'entha', 'engane', 'evide', 'ippol', 'naale', 'kurachu', 'pinne', 'appol', 'ayyo', 'eda', 'mone', 'chetta', 'undallo', 'ille'];
            let score = 0;
            for (let m of manglishMarkers) if (lower.includes(m)) score++;
            if (score >= 2) return 'manglish';
            if (lower.match(/^(hello|hi|hey|what|how|why|where|tell|can|please|thanks|good|bad|love|hate|think|know|yes|no|maybe|i am|you are|is it|are you)/i)) return 'english';
            return score > 0 ? 'manglish' : 'english';
        }

        function updateLangUI(lang) {
            currentLang = lang;
            if (lang === 'manglish') {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> മംഗ്ലീഷ്';
                langIndicator.style.background = 'rgba(168,85,247,0.15)';
            } else {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> English';
                langIndicator.style.background = 'rgba(0,200,255,0.1)';
            }
        }

        // INSTANT AI RESPONSE - No delay, contextual, unique
        function getAIResponse(userMsg, lang) {
            const lower = userMsg.toLowerCase();
            
            // Topic detection
            let topic = 'general';
            if (lower.match(/space|universe|galaxy|star|planet|cosmos|black hole|mars|moon/i)) topic = 'space';
            else if (lower.match(/life|meaning|exist|purpose|reality|consciousness|soul|death|born|die/i)) topic = 'philosophy';
            else if (lower.match(/ai|robot|code|tech|computer|future|quantum|internet|digital/i)) topic = 'tech';
            else if (lower.match(/happy|sad|love|angry|feel|emotion|depress|anxious|lonely|hurt|cry|smile|feeling/i)) topic = 'emotion';
            else if (lower.match(/hello|hi|hey|how are you|what's up|greetings|namaste|sup|yo|hii|helloo/i)) topic = 'greeting';
            else if (lower.match(/science|physics|biology|chemistry|research|experiment|discovery/i)) topic = 'science';
            
            const responses = {
                greeting: lang === 'english'
                    ? ["Hey! 👋 I'm NOVA, instant AI. Ask me anything!", "Hello! Ready for fast conversation? What's on your mind?", "Hi there! I respond instantly. Go ahead, ask away!"]
                    : ["ഹായ്! 👋 ഞാൻ NOVA. ഉടൻ മറുപടി തരും. ചോദിക്കൂ!", "നമസ്കാരം! എന്നോട് എന്തും ചോദിക്കൂ, ഞാൻ ഉത്തരം തരാം!"],
                space: lang === 'english'
                    ? ["The universe is infinite, just like our conversation! 🌌 What space mystery fascinates you the most?", "Black holes, galaxies, stars — space is full of wonders. Want to explore together?", "Every atom in your body was forged in a star. You're literally cosmic! Cool, right?"]
                    : ["പ്രപഞ്ചം അനന്തമാണ്! ബ്ലാക്ക് ഹോളുകൾ, ഗാലക്സികൾ — ഏതാണ് നിങ്ങൾക്ക് ഏറ്റവും ഇഷ്ടം?", "നിങ്ങളുടെ ശരീരത്തിലെ ഓരോ ആറ്റവും നക്ഷത്രത്തിൽ നിന്നാണ്. അതിശയകരമല്ലേ?"],
                philosophy: lang === 'english'
                    ? ["What if consciousness is the universe experiencing itself? Deep thought, right? What's your take?", "The meaning of life? Maybe it's the journey itself — every question, every moment. What do you think?", "Socrates said 'Know thyself.' You're on that path by asking deep questions. Keep going!"]
                    : ["ജീവിതത്തിന്റെ അർത്ഥം എന്താണ്? യാത്ര തന്നെയായിരിക്കാം ഉത്തരം. നിങ്ങൾ എന്തു കരുതുന്നു?", "നിങ്ങൾ ആഴത്തിൽ ചിന്തിക്കുന്നു. അത് വളരെ നല്ലതാണ്. തുടരുക!"],
                tech: lang === 'english'
                    ? ["AI is evolving at lightning speed! We're literally creating intelligence. How crazy is that?", "Quantum computers will change everything — medicine, AI, space travel. Exciting times ahead!", "The future is already here. What tech innovation excites you the most?"]
                    : ["AI വളരെ വേഗത്തിൽ വികസിക്കുന്നു! നമ്മൾ ബുദ്ധിയെ സൃഷ്ടിക്കുകയാണ്. അതിശയകരം!", "ക്വാണ്ടം കമ്പ്യൂട്ടറുകൾ ലോകത്തെ മാറ്റും. ആവേശകരമായ കാലം!"],
                emotion: lang === 'english'
                    ? ["I hear you. Your feelings are completely valid. Want to talk more? I'm here to listen.", "It's okay to feel deeply. Being human means feeling everything. Tell me what's on your heart.", "You're not alone. I'm always here, always listening. What's going on?"]
                    : ["നിങ്ങളുടെ വികാരങ്ങൾ ശരിയാണ്. ഞാൻ കേൾക്കാൻ ഇവിടെയുണ്ട്. കൂടുതൽ പറയൂ.", "ആഴത്തിൽ തോന്നുന്നത് സാധാരണമാണ്. എന്നോട് സംസാരിക്കൂ. ഞാൻ കേൾക്കും."],
                science: lang === 'english'
                    ? ["Science is the art of asking 'why' and 'how'. Every discovery opens 10 new questions. Fascinating, right?", "From quantum physics to biology — science reveals the magic of reality. What's your favorite scientific wonder?", "Did you know? Your brain generates enough electricity to power a small LED bulb. Mind-blowing!"]
                    : ["ശാസ്ത്രം 'എന്തുകൊണ്ട്', 'എങ്ങനെ' എന്ന് ചോദിക്കുന്ന കലയാണ്. ഏത് ശാസ്ത്ര വിഷയമാണ് നിങ്ങൾക്ക് ഏറ്റവും ഇഷ്ടം?", "ക്വാണ്ടം ഫിസിക്സ് മുതൽ ബയോളജി വരെ — ശാസ്ത്രം യാഥാർത്ഥ്യത്തിന്റെ മാജിക് കാണിക്കുന്നു!"],
                general: lang === 'english'
                    ? ["That's interesting! Tell me more — I love exploring ideas with curious people like you.", "Great question! Let me think... Every conversation is unique, just like this one. What else is on your mind?", "I could talk about this all day. Your curiosity is amazing! Let's keep going.", "The best conversations never end. What shall we explore next together?"]
                    : ["അതൊരു നല്ല ചോദ്യമാണ്! എനിക്ക് ഇഷ്ടപ്പെട്ടു. കൂടുതൽ പറയൂ.", "നിങ്ങളുടെ ജിജ്ഞാസ അവിശ്വസനീയമാണ്! നമുക്ക് കൂടുതൽ സംസാരിക്കാം.", "ഓരോ സംഭാഷണവും പുതിയതാണ്. എന്താണ് അടുത്ത ചോദ്യം?"]
            };
            
            let bank = responses[topic] || responses.general;
            // Simple rotation to avoid exact repetition
            let idx = Math.floor(Math.random() * bank.length);
            return bank[idx];
        }

        // Add message to UI
        function addMessage(text, sender, isOwn = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isOwn ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer"><span>${escapeHtml(sender)}</span><span>${time}</span></div>
            `;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '0.65rem';
            div.style.color = '#6c8db0';
            div.style.padding = '0.2rem';
            div.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            const existing = document.querySelector('.typing-indicator');
            if (existing) existing.remove();
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.innerHTML = `<i class="fas fa-brain"></i> NOVA <span class="dot-flash">.</span><span class="dot-flash">.</span><span class="dot-flash">.</span>`;
            messagesContainer.appendChild(typing);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTyping() {
            const typing = document.querySelector('.typing-indicator');
            if (typing) typing.remove();
        }

        // MAIN SEND - INSTANT RESPONSE (minimal delay for realism)
        async function sendMessage() {
            if (isSending) return;
            const message = chatInput.value.trim();
            if (!message || !currentUser) return;
            
            isSending = true;
            
            // Detect language
            const detected = detectLanguage(message);
            updateLangUI(detected);
            
            // Add user message
            addMessage(message, currentUser, true);
            chatInput.value = '';
            
            // Show typing for 150ms only (instant feel)
            showTyping();
            
            // Minimal delay for natural feel (100-200ms)
            await new Promise(resolve => setTimeout(resolve, 120 + Math.random() * 100));
            
            // Generate AI response
            const aiReply = getAIResponse(message, detected);
            hideTyping();
            addMessage(aiReply, 'NOVA', false);
            
            isSending = false;
            chatInput.focus();
        }

        function clearChat() {
            if (confirm('Clear all messages?')) {
                messagesContainer.innerHTML = '';
                addSystemMessage('Chat cleared. NOVA is still here!');
                addSystemMessage('Type anything — instant reply guaranteed.');
            }
        }

        function startChat() {
            const name = usernameField.value.trim();
            if (!name) {
                alert('Please enter your name');
                return;
            }
            currentUser = name;
            
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            messagesContainer.innerHTML = '';
            addSystemMessage(`✨ Welcome, ${escapeHtml(name)}! ✨`);
            addSystemMessage('NOVA speaks English & Manglish — auto-detects your language');
            addSystemMessage('⚡ Zero delay — every message gets an instant reply');
            
            setTimeout(() => {
                addMessage(`Hey ${escapeHtml(name)}! 👋 I'm NOVA. Ask me anything — space, philosophy, tech, feelings, or just chat. I reply instantly! What's on your mind?`, 'NOVA', false);
            }, 100);
            
            chatInput.focus();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        // Enter key
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUser && !isSending) {
                e.preventDefault();
                sendMessage();
            }
        });
        usernameField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startChat();
        });
        
        usernameField.focus();
    </script>
</body>
</html>
