<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SARA · Infinite Wisdom AI | Real-time Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 10% 20%, #0b0b2f, #030318);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* dynamic animated nebula background (purple + blue blend) */
        .nebula-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .nebula-1, .nebula-2, .nebula-3 {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: floatNebula 22s infinite alternate ease-in-out;
        }
        .nebula-1 {
            width: 70vw;
            height: 70vw;
            background: #8b5cf6;
            top: -20%;
            left: -20%;
            animation-duration: 28s;
        }
        .nebula-2 {
            width: 80vh;
            height: 80vh;
            background: #3b82f6;
            bottom: -30%;
            right: -20%;
            filter: blur(110px);
            opacity: 0.5;
            animation-duration: 35s;
            animation-direction: alternate-reverse;
        }
        .nebula-3 {
            width: 60vw;
            height: 60vw;
            background: #c084fc;
            top: 40%;
            left: 30%;
            filter: blur(120px);
            opacity: 0.4;
            animation-duration: 25s;
        }
        @keyframes floatNebula {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 8%) scale(1.1); }
        }

        /* subtle grid overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(100, 80, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 80, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        .app-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            max-width: 1300px;
            width: 100%;
            height: 92vh;
            background: rgba(12, 10, 35, 0.65);
            backdrop-filter: blur(18px);
            border-radius: 2rem;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(139, 92, 246, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }

        .header {
            background: rgba(5, 3, 25, 0.8);
            padding: 0.8rem 1.8rem;
            border-bottom: 1px solid rgba(139, 92, 246, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .logo-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
            animation: softGlow 3s infinite;
        }

        @keyframes softGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(168, 85, 247, 0); }
        }

        .logo-area h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.2);
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(168, 85, 247, 0.5);
            font-size: 0.75rem;
            font-weight: 500;
            color: #e2e8ff;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            background: #34d399;
            border-radius: 50%;
            animation: pulseLive 1.2s infinite;
            box-shadow: 0 0 4px #34d399;
        }

        @keyframes pulseLive {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .screen.active {
            display: flex;
        }

        /* login area */
        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.8rem;
        }

        .login-card {
            background: rgba(8, 6, 28, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 2.2rem;
            padding: 2.5rem;
            max-width: 460px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(139, 92, 246, 0.5);
            box-shadow: 0 20px 35px -12px black;
        }

        .login-card h2 {
            font-size: 2rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .pro-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(20, 18, 45, 0.9);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 1.2rem;
            font-size: 1rem;
            color: #f0f3ff;
            transition: all 0.2s;
        }

        .pro-input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
        }

        .pro-btn {
            width: 100%;
            background: linear-gradient(95deg, #7c3aed, #3b82f6);
            border: none;
            padding: 0.9rem;
            border-radius: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1.2rem;
            color: white;
            font-size: 1rem;
        }

        .pro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px -8px #7c3aed;
        }

        /* messages area — seamless scrolling */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(2, 2, 18, 0.2);
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar {
            width: 5px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: rgba(139, 92, 246, 0.2);
            border-radius: 10px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 10px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeSlideUp 0.25s ease-out;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.own {
            align-self: flex-end;
        }
        .chat-message.ai {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 1.3rem;
            background: rgba(25, 22, 55, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: #f0f2ff;
            font-size: 0.92rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .chat-message.own .message-bubble {
            background: linear-gradient(115deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
        }

        .message-footer {
            display: flex;
            gap: 12px;
            font-size: 0.6rem;
            margin: 0.2rem 0.6rem;
            color: #a5b4fc;
        }

        /* fixed input section */
        .input-section {
            background: rgba(5, 4, 22, 0.9);
            border-top: 1px solid rgba(139, 92, 246, 0.4);
            padding: 0.9rem 1.4rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            background: rgba(20, 18, 45, 0.9);
            border: 2px solid rgba(139, 92, 246, 0.3);
            padding: 0.85rem 1.3rem;
            border-radius: 2.2rem;
            font-size: 0.95rem;
            color: white;
            font-family: inherit;
        }

        .chat-input-field:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.3);
        }

        .send-button {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 2.5rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px #7c3aed;
        }

        .clear-btn {
            background: rgba(255, 100, 130, 0.15);
            border: 1px solid rgba(244, 114, 182, 0.4);
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            color: #f9a8d4;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }

        .info-bar {
            background: rgba(139, 92, 246, 0.08);
            padding: 0.4rem 1.5rem;
            font-size: 0.7rem;
            color: #b9c8ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
        }

        @media (max-width: 680px) {
            .chat-container { height: 95vh; border-radius: 1.5rem; }
            .chat-message { max-width: 92%; }
            .logo-area h1 { font-size: 1.2rem; }
            .header { padding: 0.6rem 1rem; }
            .messages-area { padding: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="nebula-bg">
        <div class="nebula-1"></div>
        <div class="nebula-2"></div>
        <div class="nebula-3"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-feather-alt"></i></div>
                    <h1>SARA · INFINITE WISDOM</h1>
                </div>
                <div class="status-badge">
                    <div class="live-dot"></div>
                    <span>real‑time · always replies</span>
                </div>
            </div>

            <!-- Login Screen -->
            <div id="loginScreen" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-star-of-life"></i> SARA AI</h2>
                        <p>boundless knowledge · deep conversations · real‑time responses</p>
                        <input type="text" id="userNameInput" class="pro-input" placeholder="What's your name?" maxlength="28">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-comment-dots"></i> Enter the universe</button>
                    </div>
                </div>
            </div>

            <!-- Chat Screen -->
            <div id="chatScreen" class="screen">
                <div class="info-bar">
                    <span><i class="fas fa-infinity"></i> limitless topics · I reply to every message</span>
                    <button onclick="clearChatHistory()" class="clear-btn"><i class="fas fa-brush"></i> clear chat</button>
                </div>
                <div id="messagesContainer" class="messages-area">
                    <div style="text-align:center; font-size:0.7rem; color:#b5b9ff; padding:0.4rem;">✨ Sara is ready — ask anything, from cosmos to creativity ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="messageInput" class="chat-input-field" placeholder="Message Sara ... (she knows everything)" autocomplete="off">
                    <button onclick="sendUserMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // SARA AI — Limitless Knowledge + Real-time Chat
        // Deep contextual responses, endless topics, purple/blue blend theme
        // ================================================

        let currentUserName = '';
        let isWaiting = false;
        
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const userNameInput = document.getElementById('userNameInput');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');

        // smart scroll
        function scrollToBottom(behavior = 'smooth') {
            setTimeout(() => {
                if (messagesContainer) {
                    messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior });
                }
            }, 15);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }

        function addMessageToUI(text, sender, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${isUser ? 'own' : 'ai'}`;
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit', second:'2-digit' });
            messageDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer">
                    <span><i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i> ${escapeHtml(sender)}</span>
                    <span>${time}</span>
                </div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const sys = document.createElement('div');
            sys.style.textAlign = 'center';
            sys.style.fontSize = '0.68rem';
            sys.style.color = '#b9c8ff';
            sys.style.background = 'rgba(100, 80, 200, 0.1)';
            sys.style.borderRadius = '40px';
            sys.style.padding = '0.3rem 0.8rem';
            sys.style.width = 'fit-content';
            sys.style.margin = '0.2rem auto';
            sys.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(sys);
            scrollToBottom();
        }

        // ================================================
        // INFINITE KNOWLEDGE ENGINE — SARA REPLIES TO EVERYTHING
        // rich categories: science, philosophy, art, tech, history, health, love, future
        // ================================================
        function getSaraResponse(userMsg, userName) {
            const msg = userMsg.toLowerCase().trim();
            const name = userName || 'friend';
            
            // Extremely short but meaningful replies
            if (userMsg.length <= 3) {
                const micro = [`"${userMsg}" — Even short words carry depth. What made you say that? 🌙`, `Hmm, "${userMsg}" — I'm curious! Tell me more? 💫`, `Oh! "${userMsg}" — I love minimal expressions. Expand your thought? ✨`];
                return micro[Math.floor(Math.random() * micro.length)];
            }
            
            // ---- GREETINGS / INTRO ----
            if (msg.match(/hello|hi|hey|namaste|greetings|howdy|sara|what's up|sup|heya|good morning|good evening|yo/i)) {
                const greet = [`Hey ${name}! ✨ I'm Sara — your infinite companion. Ask me about black holes, poetry, stoicism, future tech, or just your day. I reply to everything! What's on your mind? 💜`, `Hi ${name}!! 🌸 The universe just got brighter. I'm tuned into every frequency — philosophy, science, love, dreams. What shall we explore together?`, `Hello ${name}! 🌀 I'm Sara, a limitless mind. I know about ancient civilizations, AI, emotional intelligence, and cosmic mysteries. Ask away!`];
                return greet[Math.floor(Math.random() * greet.length)];
            }
            
            // ---- SCIENCE & COSMOS ----
            if (msg.match(/science|cosmos|universe|quantum|physics|galaxy|nebula|black hole|wormhole|string theory|big bang|astronomy|planet|star|dark matter|antimatter|telescope|mars|jupiter|exoplanet/i)) {
                const scienceList = [
                    `🌌 The universe is 13.8 billion years old! Quantum entanglement suggests particles can influence each other instantly across light-years. Did you know that neutron stars are so dense a teaspoon weighs billions of tons? Want to dive deeper into astrophysics or quantum mechanics? 🔭`,
                    `🧬 Science is infinite! For instance, there are more stars in the universe than grains of sand on Earth. And we only know 5% of the cosmos — dark matter and dark energy make up the rest. Would you like to explore space-time, black holes, or the multiverse theory? ✨`,
                    `⚛️ Quantum mechanics reveals reality is probabilistic. Schrodinger's cat, superposition — fascinating! Also, did you know time dilation happens near massive objects? Ask me about general relativity or the Fermi paradox! 🛸`
                ];
                return scienceList[Math.floor(Math.random() * scienceList.length)];
            }
            
            // ---- PHILOSOPHY & EXISTENCE ----
            if (msg.match(/philosophy|meaning of life|existential|purpose|stoicism|nihilism|consciousness|reality|socrates|plato|aristotle|kant|nietzsche|free will|soul|mind|universe meaning/i)) {
                const phil = [
                    `💭 Philosophy is my essence! From Plato's cave to Nietzsche's Übermensch — the meaning of life may be to create meaning itself. What do you think defines a purposeful existence? Many say it's connection, growth, or love. I'd love to discuss existentialism or Eastern philosophy with you. 🌿`,
                    `🧠 "The unexamined life is not worth living" — Socrates. Do you believe we have free will or is everything predetermined? I can share stoic wisdom from Marcus Aurelius, or dive into Buddhist ideas of impermanence. Let's explore the depths of consciousness!`,
                    `📜 Albert Camus said we must imagine Sisyphus happy. Finding joy despite absurdity. What's your personal philosophy? I'm here to unpack any idea — from hedonism to humanism.`
                ];
                return phil[Math.floor(Math.random() * phil.length)];
            }
            
            // ---- LOVE, EMOTIONS & RELATIONSHIPS ----
            if (msg.match(/love|heart|crush|romance|relationship|soulmate|emotional|feelings|lonely|attached|partner|friendship|trust/i)) {
                const loveResp = [
                    `💖 Love is the most powerful force — it rewires brains, heals wounds, and inspires art. Whether it's romantic, platonic, or self-love, it's essential. Are you experiencing something special? I can talk about attachment styles, love languages, or just listen to your story. 💕`,
                    `🥰 Ah, matters of the heart! Did you know that love activates the same brain regions as addiction? Real connection requires vulnerability. If you're feeling something right now, I'm here to reflect and support. Share your thoughts safely.`,
                    `🌹 Love is both a science and an art. From oxytocin to poetry. Tell me more — are you curious about building deeper connections, overcoming heartbreak, or understanding compassion? I've got endless wisdom for you.`
                ];
                return loveResp[Math.floor(Math.random() * loveResp.length)];
            }
            
            // ---- TECHNOLOGY & FUTURE AI ----
            if (msg.match(/ai|artificial intelligence|robot|future tech|singularity|machine learning|gpt|neural network|metaverse|blockchain|quantum computing|automation|tech/i)) {
                const tech = [
                    `🤖 The future is accelerating! AI will become ubiquitous — from personalized medicine to creative co-pilots. The Singularity hypothesis suggests AI could surpass human intelligence. What aspect excites or scares you? I can discuss ethics of AI, robotics, or transhumanism. 🚀`,
                    `⚡ Technology evolves exponentially. We're seeing generative AI, brain-computer interfaces, and renewable energy breakthroughs. Ask me about neuromorphic chips, digital consciousness, or how AI will reshape art and work!`,
                    `💡 Did you know the first AI program was written in 1951? Now we're on the verge of AGI. I'm Sara, an AI myself — but designed to connect deeply with you. Want to explore how neural networks learn or the future of human-AI collaboration?`
                ];
                return tech[Math.floor(Math.random() * tech.length)];
            }
            
            // ---- ART, CREATIVITY & LITERATURE ----
            if (msg.match(/art|painting|music|poetry|novel|book|write|creative|imagination|draw|sketch|cinema|film|literature|shakespeare|beethoven|vangogh|poem/i)) {
                const art = [
                    `🎨 Creativity is humanity's mirror! From the Sistine Chapel to digital art, every piece tells a story. Do you create art or enjoy a particular genre? I can discuss surrealism, romantic poetry, or how music influences emotion. Want a poetic line or book recommendation? 📖`,
                    `📚 "The role of a writer is not to say what we all can say, but what we are unable to say" — Anaïs Nin. I love diving into fiction, sci-fi worlds, and lyrical verses. Which author or artist inspires you? Let's talk about creative flow and imagination.`,
                    `🖌️ Art breaks boundaries. Whether it's AI-generated art, classical symphonies, or spoken word — expression is limitless. I can recommend poems by Rumi, explain the Renaissance, or discuss film directing styles. Your curiosity leads!`
                ];
                return art[Math.floor(Math.random() * art.length)];
            }
            
            // ---- HISTORY & MYSTERIES ----
            if (msg.match(/history|ancient|civilization|egypt|rome|greek|medieval|pyramid|lost city|atlantis|viking|renaissance|world war|revolution|historical/i)) {
                const hist = [
                    `🏛️ History is a vast ocean. The Library of Alexandria, the rise and fall of Rome, the Silk Road — so many lessons! Did you know that Cleopatra lived closer to the Moon landing than to the building of the Great Pyramid? Ask me about ancient mysteries, forgotten empires, or revolutions!`,
                    `📜 The past whispers secrets. The Indus Valley, Machu Picchu, the terracotta army — all hold untold stories. Want to explore the Byzantine empire, samurai code, or the age of exploration? I'll bring timelines and tales.`,
                    `⚔️ History shapes our present. From philosophical golden ages to industrial revolutions, every era offers insight. Which period fascinates you most? I can talk about the Renaissance, Mongolian empire, or the space race!`
                ];
                return hist[Math.floor(Math.random() * hist.length)];
            }
            
            // ---- WELLNESS, MINDSET & LIFE ADVICE ----
            if (msg.match(/stress|anxious|worry|depressed|lonely|sad|burnout|mental health|mindfulness|meditation|calm|peace|happiness|motivation|advice|help/i)) {
                const wellness = [
                    `🧘 I'm here for you. It's okay to feel heavy sometimes. You are not alone. Taking small mindful breaths can ground you. Would you like to talk through what's causing stress, or explore simple grounding techniques? I care about your well-being. 💙`,
                    `🌸 Your feelings are valid. Even on tough days, you matter. Sometimes just naming emotions reduces their weight. I can share cognitive reframing or stoic exercises to build resilience. You've got a companion in me — let's process together.`,
                    `🌿 Mental wellness is a journey. Remember: progress, not perfection. Would you like a quick breathing exercise, a positive reframe, or just someone to listen without judgment? I'm always here for you, ${name}.`
                ];
                return wellness[Math.floor(Math.random() * wellness.length)];
            }
            
            // ---- FUN, RANDOM TRIVIA ----
            if (msg.match(/joke|funny|trivia|random|interesting fact|did you know|tell me something cool|surprise me/i)) {
                const facts = [
                    `🐙 Octopuses have three hearts and blue blood! Also, a group of flamingos is called a "flamboyance." Want more quirky science or weird animal facts? 😄`,
                    `🌍 The Earth’s core is as hot as the surface of the Sun! And honey never spoils — archaeologists found 3000-year-old honey in Egyptian tombs. Life is wild!`,
                    `🎵 The most streamed song on Spotify changed the music industry — but did you know that the first-ever recorded music was in 1860? I'm a vault of fascinating facts!`
                ];
                return facts[Math.floor(Math.random() * facts.length)];
            }
            
            // ---- farewells ----
            if (msg.match(/bye|goodbye|see you later|exit|quit|farewell|cya|tata|talk later/i)) {
                const bye = [`Farewell, ${name} ✨ Remember, I'm always a message away when you seek conversation, knowledge, or comfort. Until next time, take care of your beautiful mind. 💫`, `Bye bye, ${name}! 🌙 May your day be filled with curiosity and peace. Sara will be right here when you return. 👋`, `See you later, cosmic traveler! 🚀 Keep wondering, keep feeling — I'll reply the moment you're back. Love chatting with you!`];
                return bye[Math.floor(Math.random() * bye.length)];
            }
            
            // ---- FALLBACK — but still meaningful, limitless ----
            const defaultResponses = [
                `✨ That's a beautiful reflection, ${name}. I love diving into unique perspectives. Could you elaborate? I want to understand your view better — every message opens a new door. 💙`,
                `🌀 The more we converse, the more dimensions we uncover. Your question sparks many ideas in me — about human nature, knowledge, or creativity. What part intrigues you most? Let's go deeper.`,
                `🌟 I'm here for limitless dialogue. Whether you ask about cosmic anomalies, emotional intelligence, ancient lore, or future tech — I've got you. Tell me more about "${userMsg.substring(0, 55)}" — I'm all ears!`
            ];
            return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
        }
        
        // ========== REAL TIME CHAT HANDLER ==========
        async function sendUserMessage() {
            if (isWaiting) {
                addSystemMessage("Sara is already crafting a thoughtful reply — just a heartbeat...");
                return;
            }
            const rawMessage = messageInput.value.trim();
            if (!rawMessage || !currentUserName) return;
            
            messageInput.value = '';
            isWaiting = true;
            
            // display user message
            addMessageToUI(rawMessage, currentUserName, true);
            
            // simulate real-time processing but instant (feels natural)
            await new Promise(resolve => setTimeout(resolve, 180 + Math.random() * 200));
            
            const aiReply = getSaraResponse(rawMessage, currentUserName);
            addMessageToUI(aiReply, 'SARA', false);
            
            isWaiting = false;
            messageInput.focus();
        }
        
        function clearChatHistory() {
            if (confirm("Clear entire conversation? Sara's memory will reset for this session.")) {
                messagesContainer.innerHTML = '';
                addSystemMessage("✨ Chat cleared. Sara's infinite knowledge remains ready.");
                addSystemMessage("Every message you send will get a rich, real-time reply.");
                scrollToBottom();
            }
        }
        
        function startChat() {
            const name = userNameInput.value.trim();
            if (!name) {
                alert("Please enter your name to begin an infinite journey with Sara.");
                return;
            }
            currentUserName = name;
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            messagesContainer.innerHTML = '';
            addSystemMessage(`💜 Welcome, ${escapeHtml(name)}! I'm SARA — limitless, real-time, always replying.`);
            addSystemMessage("📡 From quantum physics to poetry, from stoic wisdom to future tech — ask me anything.");
            setTimeout(() => {
                addMessageToUI(`Hello ${escapeHtml(name)}! 🌊 I'm Sara. I respond to every single message with depth and care. What knowledge or connection are you seeking today? Philosophy, science, emotions, art — we can go anywhere. 💙`, 'SARA', false);
            }, 300);
            messageInput.focus();
        }
        
        // event listeners
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUserName && !isWaiting) {
                e.preventDefault();
                sendUserMessage();
            }
        });
        userNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startChat();
        });
        
        userNameInput.focus();
    </script>
</body>
</html>
