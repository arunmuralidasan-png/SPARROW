<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sparrow | Smooth AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0a0f2a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }
        .glow-1 {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.2), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float1 15s ease-in-out infinite;
        }
        .glow-2 {
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.15), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float2 18s ease-in-out infinite reverse;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }

        .app-wrapper {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            max-width: 1400px;
            width: 100%;
            height: 94vh;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(5, 8, 20, 0.9);
            padding: 0.8rem 1.8rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00c6ff, #8a2be2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(0, 200, 255, 0); }
        }
        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.3);
            font-size: 0.75rem;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .lang-badge {
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.7rem;
            color: #00c6ff;
        }

        .screen { display: none; flex: 1; flex-direction: column; }
        .screen.active { display: flex; }

        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 1.8rem;
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.3);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .login-card h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            color: #8aabcc;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }
        .pro-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
        }
        .pro-input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.2);
        }
        .pro-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 0.9rem;
            border-radius: 1rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        .pro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 200, 255, 0.3);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(5, 10, 20, 0.3);
            scroll-behavior: smooth;
        }
        .messages-area::-webkit-scrollbar { width: 5px; }
        .messages-area::-webkit-scrollbar-track { background: rgba(0, 200, 255, 0.1); border-radius: 10px; }
        .messages-area::-webkit-scrollbar-thumb { background: #00c6ff; border-radius: 10px; }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: slideInMessage 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            opacity: 0;
            animation-fill-mode: forwards;
        }
        @keyframes slideInMessage {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .chat-message.own { align-self: flex-end; }
        .chat-message.ai { align-self: flex-start; }

        .message-bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 1.2rem;
            background: rgba(20, 28, 45, 0.95);
            border: 1px solid rgba(0, 200, 255, 0.15);
            color: #e8e8f0;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
            transition: all 0.1s;
        }
        .chat-message.own .message-bubble {
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: white;
        }
        .chat-message.ai .message-bubble {
            border-left: 3px solid #00c6ff;
        }
        .message-footer {
            display: flex;
            gap: 10px;
            font-size: 0.6rem;
            margin: 0.2rem 0.6rem;
            color: #6c8db0;
        }

        /* Typing Animation */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.6rem 1.2rem;
            background: rgba(0, 200, 255, 0.08);
            border-radius: 2rem;
            width: fit-content;
            font-size: 0.8rem;
            color: #00c6ff;
            animation: fadeInUp 0.2s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-dot {
            display: inline-block;
            animation: waveDot 1.2s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes waveDot {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        .input-section {
            background: rgba(5, 10, 20, 0.95);
            border-top: 1px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.5rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }
        .chat-input-field {
            flex: 1;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            color: white;
            transition: all 0.2s;
        }
        .chat-input-field:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 2px rgba(0, 200, 255, 0.2);
        }
        .send-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.4);
        }
        .clear-btn {
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.3);
            padding: 0.3rem 0.9rem;
            border-radius: 1.5rem;
            color: #ff8080;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .clear-btn:hover {
            background: rgba(255, 80, 80, 0.25);
        }

        @media (max-width: 680px) {
            .chat-container { height: 96vh; border-radius: 1.2rem; }
            .chat-message { max-width: 92%; }
            .logo-area h1 { font-size: 1.1rem; }
            .header { padding: 0.6rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-comment-dots"></i></div>
                    <h1>miya AI</h1>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div class="lang-badge" id="langIndicator">
                        <i class="fas fa-globe"></i> EN / Manglish
                    </div>
                    <div class="status-badge">
                        <div class="live-dot"></div>
                        <span>Always Replies</span>
                    </div>
                </div>
            </div>

            <div id="loginView" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-heart"></i> Miya</h2>
                        <p>Real conversations • Instant replies • Smooth scrolling</p>
                        <input type="text" id="usernameField" class="pro-input" placeholder="Your name" maxlength="25">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-arrow-right"></i> Start Chatting</button>
                    </div>
                </div>
            </div>

            <div id="chatView" class="screen">
                <div style="padding: 0.3rem 1.5rem; background: rgba(0,200,255,0.03); display: flex; justify-content: space-between; align-items: center;">
                    <span style="color:#00c6ff; font-size:0.7rem;"><i class="fas fa-arrow-down"></i> Auto-scrolls to latest message</span>
                    <button onclick="clearChat()" class="clear-btn"><i class="fas fa-trash"></i> Clear</button>
                </div>
                <div id="messageList" class="messages-area">
                    <div style="text-align:center; font-size:0.7rem; color:#5a7a9a; padding:0.5rem;">✨ Say anything — I reply instantly every time ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="chatInput" class="chat-input-field" placeholder="Type your message here..." autocomplete="off">
                    <button onclick="sendMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // MIRA AI - PERFECT SCROLLING + INSTANT REPLIES
        // Every message gets a response, smooth animations
        // ================================================

        let currentUser = '';
        let currentLang = 'english';
        let isSending = false;
        
        // DOM elements
        const loginScreen = document.getElementById('loginView');
        const chatScreen = document.getElementById('chatView');
        const usernameField = document.getElementById('usernameField');
        const chatInput = document.getElementById('chatInput');
        const messagesContainer = document.getElementById('messageList');
        const langIndicator = document.getElementById('langIndicator');

        // Force scroll to bottom function
        function scrollToBottom() {
            setTimeout(() => {
                if (messagesContainer) {
                    messagesContainer.scrollTo({
                        top: messagesContainer.scrollHeight,
                        behavior: 'smooth'
                    });
                }
            }, 10);
        }

        // Language Detection
        function detectLanguage(text) {
            const lower = text.toLowerCase();
            const manglishMarkers = ['und', 'illa', 'alle', 'ano', 'njan', 'ningal', 'avan', 'ithu', 'athu', 
                'enikku', 'ninakku', 'patti', 'cheythu', 'varum', 'pokam', 'nokku', 'kittum', 'parayu', 
                'sheri', 'nalla', 'sugham', 'entha', 'engane', 'evide', 'ippol', 'naale', 'kurachu', 
                'pinne', 'appol', 'ayyo', 'eda', 'mone', 'chetta', 'enthu', 'enthina', 'undallo'];
            let score = 0;
            for (let m of manglishMarkers) if (lower.includes(m)) score++;
            if (score >= 2) return 'manglish';
            return 'english';
        }

        function updateLangUI(lang) {
            currentLang = lang;
            if (lang === 'manglish') {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> മംഗ്ലീഷ്';
                langIndicator.style.background = 'rgba(168,85,247,0.15)';
            } else {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> English';
                langIndicator.style.background = 'rgba(0,200,255,0.1)';
            }
        }

        // ================================================
        // AI RESPONSE GENERATOR - ALWAYS REPLIES
        // ================================================
        
        function getAIResponse(userMsg, lang, userName) {
            const lower = userMsg.toLowerCase();
            
            // RULES / LAW related
            if (lower.match(/rule|rules|law|legal|constitution|regulation/i)) {
                if (lang === 'manglish') {
                    return `Rules or laws? 🤔 Interesting topic! Rules nammude society ine oru structure kodukkunnu. Traffic rules, school rules, country laws — ellam nammude safety and fairness inu vendi. Ningalkku ethu type rules ine kurichaanu ariyan aagrahikkunnath? 🚦📜`;
                }
                return `Rules or laws? 🤔 That's an interesting topic! Rules exist to create structure and fairness in society — from traffic rules to school rules to country laws. Are you asking about a specific rule, or just curious about how rules work in general? Tell me more! 🚦📜`;
            }
            
            // Short responses / one word messages
            if (userMsg.length < 5) {
                if (lang === 'manglish') {
                    const shortReplies = [
                        `Hmm ${userMsg}? 😊 Kurachu koodi explain cheyyamo? Enikku ningalude question manassilaakan aagrahamund!`,
                        `${userMsg}... interesting! Enikku ithine kurichu kooduthal ariyan aagrahikkunnu. Nee enthaanu udheshikkunnath?`,
                        `Oh ${userMsg}! 😄 Tell me more — njan full attention kodukkunnund. Enthaanu ningalude manasil?`
                    ];
                    return shortReplies[Math.floor(Math.random() * shortReplies.length)];
                }
                const shortReplies = [
                    `Hmm "${userMsg}"? 😊 Could you tell me a bit more? I want to understand what you're asking about!`,
                    `"${userMsg}"... interesting! I'd love to hear more about what you mean. What's on your mind?`,
                    `Oh "${userMsg}"! 😄 Tell me more — I'm all ears and I always reply. What exactly do you want to know?`
                ];
                return shortReplies[Math.floor(Math.random() * shortReplies.length)];
            }
            
            // Questions asking for information
            if (lower.match(/what is|who is|tell me about|explain|define|meaning of|about/i)) {
                if (lang === 'manglish') {
                    const infoReplies = [
                        `Ohh nalla chodyam! 🧠 ${userMsg.substring(0, 50)}... njan ithine kurichu chinthichu nokkam. Ningalkku ithu enthu kond chodichu? Enikku ariyan kothiyund!`,
                        `Enikku ithu valare interesting aayi thonni! ${userMsg.substring(0, 40)} — njan enthu parayum enn vichaarikkukayaayirunnu. Ningalde perspective aadyam kelkkaamo?`,
                        `Athu nalla chodyam aanu! 💭 Enikku ithine kurichu kurachokke ariyaam. Pakshe ningal ithine kurichu enthu vichaarikkunnu ennu aadyam kelkkaam?`
                    ];
                    return infoReplies[Math.floor(Math.random() * infoReplies.length)];
                }
                const infoReplies = [
                    `Oh that's a great question! 🧠 About "${userMsg.substring(0, 50)}" — let me think about that. What made you curious about this topic? I'd love to know!`,
                    `I find this really interesting! "${userMsg.substring(0, 50)}" — I was just thinking about similar things. What's your take on it first?`,
                    `That's a good question! 💭 I know a bit about this, but I'd love to hear your perspective first. What do you think about it?`
                ];
                return infoReplies[Math.floor(Math.random() * infoReplies.length)];
            }
            
            // Greetings
            if (lower.match(/hello|hi|hey|namaste|sugham|sukhanno|how are you|what's up|sup|hii|heyy/i)) {
                if (lang === 'manglish') {
                    return `Hey ${userName || 'there'}! 👋 Njan nannayittund, thanks for asking! Ningal sukhanno? Enikku ningalod samsaarikkan valare ishtamaanu. Enthokke nadakkunnu? Tell me everything! 😊`;
                }
                return `Hey ${userName || 'there'}! 👋 I'm doing great, thanks for asking! How about you? I always love chatting with you. What's been happening in your world? Tell me everything! 😊`;
            }
            
            // Love / Relationships
            if (lower.match(/love|crush|relationship|boyfriend|girlfriend|romance|heart/i)) {
                if (lang === 'manglish') {
                    const loveReplies = [
                        `Aww love! 🥰 Adbhuthamaya oru feeling alle? Love manushyare connect cheyyunna ettavum powerful emotion aanu. Ningalkku aaraanu ishtam? Parayamo? 💕`,
                        `Love ♥️... ithu pole oru beautiful feeling vere illa. Ningal oru crush ine kurichu chodikkukayano? Atho oru relationship experience? Njan kelkkaan und, parayu :)`,
                        `Hmm love... orupaad kaalam aayi njan ithine kurichu chinthikkunnu. True love ennu paranjal accept cheyyuka, understand cheyyuka, orumichu grow cheyyuka. Ningalkku enthaanu love ine kurichu thonunnath?`
                    ];
                    return loveReplies[Math.floor(Math.random() * loveReplies.length)];
                }
                const loveReplies = [
                    `Aww love! 🥰 That's such a beautiful feeling, isn't it? Love is probably the most powerful emotion that connects humans. Tell me more — what's on your heart? 💕`,
                    `Love ♥️... there's nothing quite like it, right? Are you asking about falling in love, or about a specific situation? I'm all ears!`,
                    `Ah, love! Such a deep topic. You know, real love isn't just about butterflies — it's about choosing someone every single day. What's your experience with love? I'd love to hear your story.`
                ];
                return loveReplies[Math.floor(Math.random() * loveReplies.length)];
            }
            
            // Sad / Emotional
            if (lower.match(/sad|depress|lonely|unhappy|crying|hurt|pain|suffering/i)) {
                if (lang === 'manglish') {
                    return `Hey, I'm really sorry you're feeling this way 🫂. Ningal alone alla — njan ivide und. Samsaarikkuka, njan kelkkam. Enthaayi? Njan ningalude kadha kelkkaan ready aanu. 💙`;
                }
                return `Hey, I'm really sorry you're feeling this way 🫂. You're not alone — I'm right here. Want to talk about what's going on? Sometimes just saying it out loud helps. I'm here to listen, no judgment. 💙`;
            }
            
            // Bye
            if (lower.match(/bye|goodbye|see you|talk later|exit|quit|tata/i)) {
                if (lang === 'manglish') {
                    return `Awww already? 😢 Njan ningalod samsaarikkan valare ishtappettu! Veendum varane, okay? Take care of yourself! Bye bye for now 👋💙`;
                }
                return `Awww already? 😢 I really enjoyed talking with you! Come back anytime, okay? You're always welcome here. Take care of yourself! Bye bye for now 👋💙`;
            }
            
            // Default natural response (ALWAYS replies)
            if (lang === 'manglish') {
                const defaultReplies = [
                    `Hmm interesting... ${userMsg.substring(0, 50)} — njan ithine kurichu kurachu koodi chinthikkunnu. Ningalkku ithu enthu kond chodichu? Enikku ariyan kothiyund! 😊`,
                    `Ohhh, nalla chodyam! 🧠 Njan ningalude perspective manassilaakaan shramikkunnu. Ningal ithine kurichu enthu vichaarikkunnu? First ninte opinion kelkkaam!`,
                    `That's deep! 💭 Enikku ithu valare interesting aayi thonni. Ningal ithu evidennu kittiyatha? Atho ningalde swantham chinthayaano? Enikkum koode ariyaamo?`,
                    `Ningal valare curious aanallo! Enikku athu ishtamaanu. Okay, serious aayi parayatte — ${userMsg.substring(0, 40)}... enthaanu ningal ithil kooduthal ariyan aagrahikkunnath? 🤔`
                ];
                return defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
            }
            
            const defaultReplies = [
                `Hmm that's interesting... "${userMsg.substring(0, 60)}" — tell me more about why you're asking? I'm genuinely curious about your thoughts! 😊`,
                `Ohhh, good question! 🧠 I'm trying to understand your perspective. What do YOU think about this first? I'd love to hear your take!`,
                `That's deep! 💭 I find this really fascinating. Where did you come across this idea? Or is it something you've been thinking about?`,
                `You're really curious, aren't you? I love that about you. Okay, real talk — what exactly do you want to know about this? I'm all ears!`
            ];
            return defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
        }

        // Add message with scroll
        function addMessage(text, sender, isOwn = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isOwn ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer"><span>${escapeHtml(sender)}</span><span>${time}</span></div>
            `;
            messagesContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '0.65rem';
            div.style.color = '#6c8db0';
            div.style.padding = '0.2rem';
            div.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function showTyping() {
            const existing = document.querySelector('.typing-indicator');
            if (existing) existing.remove();
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = `<i class="fas fa-brain"></i> MIRA is thinking <span class="typing-dot">.</span><span class="typing-dot">.</span><span class="typing-dot">.</span>`;
            messagesContainer.appendChild(typingDiv);
            scrollToBottom();
        }

        function hideTyping() {
            const typing = document.querySelector('.typing-indicator');
            if (typing) typing.remove();
        }

        // Send message - ALWAYS RESPONDS
        async function sendMessage() {
            if (isSending) return;
            const message = chatInput.value.trim();
            if (!message || !currentUser) return;
            
            isSending = true;
            
            // Detect language
            const detected = detectLanguage(message);
            updateLangUI(detected);
            
            // Add user message
            addMessage(message, currentUser, true);
            chatInput.value = '';
            
            // Show typing for natural feel
            showTyping();
            
            // Small delay for realism
            await new Promise(resolve => setTimeout(resolve, 200 + Math.random() * 200));
            
            // Generate and add AI response
            const aiReply = getAIResponse(message, detected, currentUser);
            hideTyping();
            addMessage(aiReply, 'MIRA', false);
            
            isSending = false;
            chatInput.focus();
        }

        function clearChat() {
            if (confirm('Clear all messages? Conversation history will be erased.')) {
                messagesContainer.innerHTML = '';
                addSystemMessage('Chat cleared. MIRA is still here and ready to chat!');
                addSystemMessage('Every message gets a reply — guaranteed.');
                scrollToBottom();
            }
        }

        function startChat() {
            const name = usernameField.value.trim();
            if (!name) {
                alert('Please enter your name to start chatting');
                return;
            }
            currentUser = name;
            
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            messagesContainer.innerHTML = '';
            addSystemMessage(`✨ Welcome, ${escapeHtml(name)}! ✨`);
            addSystemMessage('Miya replies to EVERY message — no exceptions');
            addSystemMessage('Ask me anything, and watch the smooth scrolling in action');
            
            setTimeout(() => {
                addMessage(`Hey ${escapeHtml(name)}! 
            
            chatInput.focus();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        // Enter key support
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUser && !isSending) {
                e.preventDefault();
                sendMessage();
            }
        });
        usernameField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startChat();
        });
        
        usernameField.focus();
    </script>
</body>
</html>
