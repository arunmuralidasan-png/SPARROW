<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SparrowChat - Talk to Strangers</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🌟</span>
                <h1>SparrowChat</h1>
            </div>
            <div class="status" id="status">Connecting...</div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Login Screen -->
            <div id="login-screen" class="screen active">
                <div class="login-box">
                    <h2>Talk to Strangers</h2>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="Enter a nickname" maxlength="15">
                        <button onclick="joinChat()" class="start-btn">Start Chatting</button>
                    </div>
                    <div class="features">
                        <span>✅ Anonymous</span>
                        <span>✅ Real-time</span>
                        <span>✅ Mobile</span>
                    </div>
                </div>
            </div>

            <!-- Chat Screen -->
            <div id="chat-screen" class="screen">
                <div class="chat-header">
                    <div class="user-info">
                        <span class="user-name" id="partner-name">Stranger</span>
                        <span class="online-indicator"></span>
                    </div>
                    <div class="actions">
                        <button onclick="nextChat()" class="next-btn">Next</button>
                        <button onclick="leaveChat()" class="stop-btn">Stop</button>
                    </div>
                </div>
                
                <div id="messages" class="messages"></div>
                
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Say something..." maxlength="500">
                    <button onclick="sendMessage()" class="send-icon">➤</button>
                </div>
            </div>
        </main>
    </div>
