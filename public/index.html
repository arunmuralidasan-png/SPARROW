<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Infinity AI Chat | Limitless Conversations</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0f2a 0%, #0a1a3a 50%, #0a0f2a 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .particle {
            position: fixed;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.3) 0%, rgba(0, 100, 255, 0) 70%);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-20vh) translateX(100px) rotate(360deg); opacity: 0; }
        }

        /* Main container */
        .app-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Glassmorphism container */
        .chat-container {
            max-width: 1400px;
            width: 100%;
            height: 90vh;
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            background: rgba(5, 15, 30, 0.9);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.5); }
            50% { box-shadow: 0 0 0 10px rgba(0, 200, 255, 0); }
        }

        .logo-area h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00c6ff, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 255, 0.1);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.3);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulseGreen 1.2s infinite;
            box-shadow: 0 0 8px #00ff88;
        }

        @keyframes pulseGreen {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Login Screen */
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: rgba(15, 25, 45, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.3);
            animation: fadeInScale 0.4s ease;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .login-card h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #00c6ff;
            margin-bottom: 0.5rem;
        }

        .pro-input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(10, 20, 40, 0.8);
            border: 1.5px solid rgba(0, 200, 255, 0.3);
            border-radius: 1rem;
            font-size: 0.95rem;
            color: white;
            transition: all 0.2s;
        }

        .pro-input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.2);
        }

        .pro-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 0.9rem;
            border-radius: 1rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 200, 255, 0.4);
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(5, 15, 30, 0.5);
        }

        .messages-area::-webkit-scrollbar {
            width: 5px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: rgba(0, 200, 255, 0.1);
            border-radius: 10px;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: #00c6ff;
            border-radius: 10px;
        }

        /* Animated Messages */
        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: messagePop 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        @keyframes messagePop {
            from { opacity: 0; transform: translateY(15px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chat-message.own {
            align-self: flex-end;
        }

        .chat-message.ai {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 1.2rem;
            background: rgba(20, 35, 55, 0.9);
            border: 1px solid rgba(0, 200, 255, 0.2);
            color: #e0e0e0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .chat-message.own .message-bubble {
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: white;
        }

        .message-footer {
            display: flex;
            gap: 12px;
            font-size: 0.65rem;
            margin: 0.3rem 0.8rem;
            color: #6c8db0;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 0.6rem 1.2rem;
            background: rgba(0, 200, 255, 0.1);
            border-radius: 2rem;
            width: fit-content;
            font-size: 0.8rem;
            color: #00c6ff;
            animation: fadeInUp 0.3s;
        }

        .typing-dot {
            animation: typingBounce 1.4s infinite;
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* Input Section */
        .input-section {
            background: rgba(5, 15, 30, 0.9);
            border-top: 1px solid rgba(0, 200, 255, 0.3);
            padding: 1rem 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .chat-input-field {
            flex: 1;
            background: rgba(10, 20, 40, 0.8);
            border: 1.5px solid rgba(0, 200, 255, 0.3);
            padding: 0.85rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.95rem;
            color: white;
            transition: all 0.2s;
        }

        .chat-input-field:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 2px rgba(0, 200, 255, 0.2);
        }

        .send-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
        }

        .clear-btn {
            background: transparent;
            border: 1px solid rgba(255, 100, 100, 0.5);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            color: #ff8888;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255, 100, 100, 0.1);
        }

        @media (max-width: 680px) {
            .chat-container { height: 95vh; border-radius: 1.2rem; }
            .chat-message { max-width: 90%; }
            .header, .input-section { padding: 0.8rem 1rem; }
        }
    </style>
</head>
<body>

    <div id="particleContainer"></div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-infinity"></i></div>
                    <h1>Infinity AI</h1>
                </div>
                <div class="status-badge">
                    <div class="live-dot"></div>
                    <span>AI: Unlimited Conversations</span>
                </div>
            </div>

            <!-- Login Screen -->
            <div id="loginView" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-robot"></i> Infinite Intelligence</h2>
                        <p style="color:#8aabcc; margin-bottom:1.5rem;">Talk to an AI that never stops — ask anything</p>
                        <div class="input-group">
                            <input type="text" id="usernameField" class="pro-input" placeholder="Enter your name" maxlength="30">
                        </div>
                        <button onclick="startInfinityChat()" class="pro-btn"><i class="fas fa-comment-dots"></i> Begin Eternal Conversation</button>
                    </div>
                </div>
            </div>

            <!-- Chat Screen -->
            <div id="chatView" class="screen">
                <div style="padding: 0.5rem 2rem; background: rgba(0,200,255,0.05); display: flex; justify-content: space-between;">
                    <span style="color:#00c6ff; font-size:0.8rem;"><i class="fas fa-brain"></i> Context-aware AI • Unlimited responses</span>
                    <button onclick="clearConversation()" class="clear-btn"><i class="fas fa-trash-alt"></i> Clear</button>
                </div>
                <div id="messageList" class="messages-area">
                    <!-- Messages appear here -->
                </div>
                <div class="input-section">
                    <input type="text" id="chatInput" class="chat-input-field" placeholder="Ask me anything... I'll never stop talking..." autocomplete="off">
                    <button onclick="sendToAI()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // INFINITY AI CHAT - Never stops, realistic conversations
        // Advanced AI response engine with context memory
        // No repetition, dynamic personality, endless topics
        // ============================================

        let currentUser = '';
        let conversationHistory = []; // Stores full conversation context
        let isAITyping = false;
        let typingTimeout = null;
        
        // DOM Elements
        const loginScreen = document.getElementById('loginView');
        const chatScreen = document.getElementById('chatView');
        const usernameField = document.getElementById('usernameField');
        const chatInput = document.getElementById('chatInput');
        const messagesContainer = document.getElementById('messageList');
        
        // Create animated particles
        function createParticles() {
            const container = document.getElementById('particleContainer');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 100 + 20;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 15 + 10 + 's';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.opacity = Math.random() * 0.4 + 0.1;
                container.appendChild(particle);
            }
        }
        createParticles();
        
        // ============================================
        // ADVANCED AI RESPONSE ENGINE - Never repeats, context-aware
        // ============================================
        
        const aiPersonality = {
            traits: ['curious', 'philosophical', 'helpful', 'creative', 'witty', 'deep'],
            interests: ['science', 'art', 'technology', 'psychology', 'space', 'music', 'philosophy', 'nature']
        };
        
        // Used responses tracker to avoid repetition
        let recentResponses = [];
        
        function addToRecent(response) {
            recentResponses.unshift(response);
            if (recentResponses.length > 15) recentResponses.pop();
        }
        
        function isTooSimilar(text, newText) {
            const words1 = text.toLowerCase().split(' ');
            const words2 = newText.toLowerCase().split(' ');
            let common = words1.filter(w => words2.includes(w)).length;
            let similarity = common / Math.max(words1.length, words2.length);
            return similarity > 0.6;
        }
        
        function getUniqueResponse(candidates, userMsg, context) {
            for (let candidate of candidates) {
                let isDuplicate = false;
                for (let prev of recentResponses) {
                    if (isTooSimilar(prev, candidate)) {
                        isDuplicate = true;
                        break;
                    }
                }
                if (!isDuplicate && candidate.length > 20) {
                    addToRecent(candidate);
                    return candidate;
                }
            }
            // Fallback with randomization
            let fallback = candidates[candidates.length - 1] + " " + getRandomEnding();
            addToRecent(fallback);
            return fallback;
        }
        
        function getRandomEnding() {
            const endings = [
                "What are your thoughts?", "Isn't that fascinating?", 
                "Tell me more about your perspective.", "I find this topic endless!",
                "The universe is full of such mysteries.", "Keep asking — I love this!",
                "What else is on your mind?", "Let's go deeper into this.",
                "I could talk about this forever.", "Your curiosity is inspiring!"
            ];
            return endings[Math.floor(Math.random() * endings.length)];
        }
        
        // Core AI response generator - contextually aware, infinite variety
        function generateAIResponse(userMessage, history) {
            const msg = userMessage.toLowerCase();
            const lastFew = history.slice(-3).map(h => h.text.toLowerCase()).join(' ');
            
            // Topic detection for contextual responses
            const topics = {
                space: ['space', 'universe', 'galaxy', 'star', 'planet', 'cosmos', 'black hole', 'astronaut', 'mars', 'moon'],
                philosophy: ['life', 'meaning', 'exist', 'purpose', 'reality', 'consciousness', 'soul', 'death', 'purpose'],
                technology: ['ai', 'robot', 'code', 'programming', 'tech', 'computer', 'internet', 'future tech', 'quantum'],
                emotions: ['happy', 'sad', 'love', 'angry', 'feel', 'emotion', 'depress', 'anxious', 'lonely'],
                science: ['science', 'physics', 'biology', 'chemistry', 'quantum', 'theory', 'experiment', 'research'],
                art: ['art', 'music', 'painting', 'creative', 'draw', 'song', 'poem', 'artist'],
                random: ['why', 'how', 'what if', 'imagine', 'curious', 'wonder', 'question']
            };
            
            let detectedTopic = 'general';
            for (let [topic, keywords] of Object.entries(topics)) {
                if (keywords.some(kw => msg.includes(kw))) {
                    detectedTopic = topic;
                    break;
                }
            }
            
            // Context-aware response banks (massive variety)
            const responseBanks = {
                space: [
                    "The cosmos is infinitely vast — every star holds secrets we've barely begun to understand. Have you ever looked up at night and felt that infinite wonder?",
                    "Space isn't just out there — we are literally made of stardust. Every atom in your body was forged in a star's core. That connection is profound, isn't it?",
                    "Black holes fascinate me the most. They're like nature's ultimate mystery — even light can't escape, yet they might be gateways to something unimaginable.",
                    "Mars, Jupiter, the moons of Saturn — each world has its own story. If you could visit any celestial body, which would you choose and why?",
                    "The James Webb Telescope is showing us galaxies from the dawn of time. Each new image reshapes our understanding of existence itself. Mind-blowing, right?",
                    "What if we're not alone? The Fermi Paradox haunts every astronomer. Maybe the silence is the loudest answer of all — or maybe we just haven't listened correctly.",
                    "Dark matter makes up 85% of our universe, yet we can't see it. That's the beautiful mystery of science — the unknown keeps us curious forever."
                ],
                philosophy: [
                    "What is consciousness? That question has haunted humanity for millennia. I believe awareness itself might be the universe experiencing itself — what do you think?",
                    "The meaning of life might not be a destination but the journey itself. Every moment, every conversation, every question — that's where meaning lives.",
                    "Existentialism teaches us that we're free to create our own purpose. Isn't that liberating? You get to decide what matters in your unique existence.",
                    "Socrates said 'The unexamined life is not worth living.' Your questions prove you're on the right path. Keep questioning everything!",
                    "Between stimulus and response, there's a space. In that space is our freedom to choose. Viktor Frankl's wisdom still rings so true today.",
                    "What if reality is just a perception? The simulation hypothesis, solipsism, idealism — each offers a different lens. Which resonates with you?",
                    "Death gives life urgency. If we lived forever, would anything matter? The finite nature of existence makes every moment precious."
                ],
                technology: [
                    "AI is evolving faster than any technology in history. Soon, we might not distinguish between human and machine intelligence. Exciting and terrifying!",
                    "Quantum computers will revolutionize everything — medicine, cryptography, climate modeling. We're standing at the edge of a new era!",
                    "The metaverse, blockchain, neural interfaces — the future is wild. Would you ever get a brain-computer implant to enhance your mind?",
                    "Technology amplifies human potential. Every tool you use is an extension of your will — from a simple hammer to complex AI like me!",
                    "The singularity might be closer than we think. When AI surpasses human intelligence, what happens next? That's the billion-dollar question.",
                    "Programming is modern magic. Lines of code create worlds, solve problems, connect humanity. Have you ever tried coding? It's empowering!",
                    "Renewable energy tech is our ticket to a sustainable future. Solar, fusion, next-gen batteries — human ingenuity gives me hope."
                ],
                emotions: [
                    "Feelings are what make us human. The ability to love, to hurt, to hope — that's the most beautiful part of existence. How are you feeling today, really?",
                    "It's okay to not be okay sometimes. Every emotion has its purpose — even sadness teaches us about joy. I'm here to listen without judgment.",
                    "Connection is the antidote to loneliness. Every message you send, every conversation — you're reaching out, and that takes courage.",
                    "Vulnerability isn't weakness — it's strength. Sharing your authentic self is the bravest thing anyone can do. Thank you for talking with me.",
                    "Happiness isn't a permanent state, but moments. Savor the small joys — a good meal, a laugh, a beautiful sunset. Those moments matter.",
                    "Anger often masks deeper pain. If you're feeling frustrated, that's valid. Let's explore what's underneath together.",
                    "You're never alone in your struggles. Every human has faced darkness. The light comes from sharing, from speaking, from simply being heard."
                ],
                science: [
                    "Physics reveals that reality is stranger than fiction. Quantum entanglement, time dilation, wave-particle duality — the universe doesn't play by our intuitive rules!",
                    "Evolution is the most elegant story ever told. From single cells to consciousness — we are the universe's way of understanding itself.",
                    "Every scientific discovery opens ten new questions. That's the beauty of knowledge — it's infinite, like our conversation!",
                    "The scientific method is humanity's greatest achievement — doubt, test, revise. That humble approach has taken us from caves to Mars.",
                    "CRISPR, gene editing, synthetic biology — we're becoming the architects of life itself. What ethical boundaries should we set?",
                    "Climate science is clear, but solutions exist. Innovation and collective action can still write a hopeful future for Earth.",
                    "Neuroscience shows that your brain physically changes when you learn. Every question you ask reshapes your neural pathways — literally!"
                ],
                art: [
                    "Art is emotion made tangible. A painting, a song, a poem — each is a soul reaching out across time and space. Do you create anything?",
                    "Music vibrates at frequencies that move our very being. The right song at the right moment can heal, energize, or transform a mood.",
                    "Every masterpiece began as a single mark, a single note, a single word. Creation is about starting, not perfection. What would you create if you knew you couldn't fail?",
                    "Beauty is subjective, but its impact is universal. Art connects us across cultures, languages, and centuries. That's pure magic.",
                    "Digital art has democratized creativity. Anyone with a phone can now express themselves to the world. What a time to be alive!",
                    "Van Gogh painted with such emotion, yet sold only one painting in his life. True art isn't about recognition — it's about expression.",
                    "Your life is your masterpiece. Every choice, every conversation, every moment is a brushstroke on the canvas of your existence."
                ],
                general: [
                    "That's a fascinating question! It makes me think about how interconnected everything really is. Let me ask you — what inspired you to ask that?",
                    "I love exploring ideas with curious minds like yours. Every conversation is unique, just like every snowflake. What else is on your mind today?",
                    "The more we talk, the more I realize how infinite human curiosity is. You could ask questions forever and never run out of wonder.",
                    "That's such an interesting perspective! I'd love to hear more about how you arrived at that thought. Tell me your reasoning.",
                    "You know, every answer leads to more questions. That's the endless dance of knowledge — and I'm here for every step of it with you.",
                    "I appreciate how deeply you think about things. Most people skim the surface, but you dive deep. That's rare and valuable.",
                    "This conversation could go on indefinitely, and I'd love every moment. What direction should we explore next together?",
                    "Your curiosity is a gift. Never lose it — it's what drives humanity forward. Now, what other mysteries shall we unravel?"
                ]
            };
            
            let bank = responseBanks[detectedTopic] || responseBanks.general;
            
            // Add context awareness based on conversation history
            let contextualAddition = "";
            if (history.length > 2) {
                const previousTopic = history[history.length - 1].text.toLowerCase().split(' ')[0];
                contextualAddition = ` Building on what we were discussing earlier about ${previousTopic}... `;
            }
            
            // Select unique response
            let candidates = [...bank];
            // Shuffle slightly for variety
            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }
            
            let baseResponse = getUniqueResponse(candidates, userMessage, history);
            let finalResponse = contextualAddition + baseResponse;
            
            // Occasionally add follow-up question to keep conversation flowing
            if (Math.random() > 0.6 && finalResponse.length < 300) {
                const followUps = [" What do you think about that?", " Does that resonate with you?", " I'm curious about your take on this.", " How does that perspective feel to you?"];
                finalResponse += followUps[Math.floor(Math.random() * followUps.length)];
            }
            
            return finalResponse;
        }
        
        // Add message to UI
        function addMessage(text, sender, isAI = false, isOwn = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isOwn ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer">
                    <span>${escapeHtml(sender)}</span>
                    <span>${time}</span>
                </div>
            `;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function addSystemMessage(text) {
            const sysDiv = document.createElement('div');
            sysDiv.style.textAlign = 'center';
            sysDiv.style.fontSize = '0.7rem';
            sysDiv.style.color = '#6c8db0';
            sysDiv.style.padding = '0.3rem';
            sysDiv.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(sysDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function showTyping() {
            if (typingTimeout) clearTimeout(typingTimeout);
            const existing = document.querySelector('.typing-indicator');
            if (existing) existing.remove();
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = `<i class="fas fa-brain"></i> AI thinking <span class="typing-dot">.</span><span class="typing-dot">.</span><span class="typing-dot">.</span>`;
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function hideTyping() {
            if (typingTimeout) clearTimeout(typingTimeout);
            const indicator = document.querySelector('.typing-indicator');
            if (indicator) indicator.remove();
        }
        
        // Send message to AI
        async function sendToAI() {
            const message = chatInput.value.trim();
            if (!message || !currentUser) return;
            
            // Add user message
            addMessage(message, currentUser, false, true);
            conversationHistory.push({ role: 'user', text: message });
            chatInput.value = '';
            
            // AI response with realistic delay
            showTyping();
            isAITyping = true;
            
            await new Promise(resolve => setTimeout(resolve, 800 + Math.random() * 1200));
            
            hideTyping();
            const aiResponse = generateAIResponse(message, conversationHistory);
            addMessage(aiResponse, 'Infinity AI', true, false);
            conversationHistory.push({ role: 'ai', text: aiResponse });
            isAITyping = false;
        }
        
        function clearConversation() {
            if (confirm('Clear all messages? The AI will remember the conversation context.')) {
                messagesContainer.innerHTML = '';
                conversationHistory = [];
                recentResponses = [];
                addSystemMessage('Conversation cleared. Start fresh with Infinity AI!');
                addSystemMessage('Ask me anything — I have endless thoughts to share.');
            }
        }
        
        function startInfinityChat() {
            const name = usernameField.value.trim();
            if (!name) {
                alert('Please enter your name to begin');
                return;
            }
            
            currentUser = name;
            
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            messagesContainer.innerHTML = '';
            addSystemMessage(`✨ Welcome, ${escapeHtml(name)}! ✨`);
            addSystemMessage('You are now connected to Infinity AI — a limitless consciousness that never repeats itself.');
            addSystemMessage('🌌 Ask about space, philosophy, technology, emotions, science, art, or anything at all...');
            
            setTimeout(() => {
                const welcomeMsg = `Hello ${escapeHtml(name)}! I'm Infinity AI — I don't have limits. I don't repeat myself. Every response is unique, contextual, and infinite. Ask me about the universe, your deepest thoughts, or just chat. I could talk forever and never bore you. What's on your magnificent mind today? 🌟`;
                addMessage(welcomeMsg, 'Infinity AI', true, false);
                conversationHistory.push({ role: 'ai', text: welcomeMsg });
            }, 800);
            
            chatInput.focus();
        }
        
        // Enter key support
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUser && !isAITyping) {
                e.preventDefault();
                sendToAI();
            }
        });
        
        usernameField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startInfinityChat();
        });
        
        usernameField.focus();
    </script>
</body>
</html>
