<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SARA · Smart & Funny AI | Real-time Pro Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #020014);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* animated purple-blue gradient background */
        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .orb-1, .orb-2, .orb-3 {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            animation: floatOrb 20s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 60vw;
            height: 60vw;
            background: #6366f1;
            top: -20%;
            left: -20%;
            opacity: 0.3;
        }
        .orb-2 {
            width: 70vh;
            height: 70vh;
            background: #a855f7;
            bottom: -30%;
            right: -15%;
            opacity: 0.25;
            animation-duration: 25s;
        }
        .orb-3 {
            width: 50vw;
            height: 50vw;
            background: #3b82f6;
            top: 40%;
            left: 30%;
            opacity: 0.2;
            animation-duration: 18s;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(6%, 8%) scale(1.15); }
        }

        /* funny floating emojis animation */
        .floating-emoji {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 15;
            animation: floatEmoji 12s infinite linear;
            opacity: 0.5;
        }
        @keyframes floatEmoji {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        .app-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            max-width: 1300px;
            width: 100%;
            height: 92vh;
            background: rgba(8, 8, 28, 0.82);
            backdrop-filter: blur(18px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(99, 102, 241, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* funny wiggle header */
        .header {
            background: rgba(5, 5, 22, 0.92);
            padding: 0.7rem 2rem;
            border-bottom: 2px solid rgba(168, 85, 247, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            flex-shrink: 0;
            animation: subtleWiggle 3s infinite ease-in-out;
        }
        @keyframes subtleWiggle {
            0%, 100% { transform: translateX(0px); }
            95% { transform: translateX(0px); }
            97% { transform: translateX(2px); }
            99% { transform: translateX(-2px); }
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            animation: bounceSoft 2s infinite;
            cursor: pointer;
        }
        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.25);
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #a855f7;
            animation: glowPulse 1.8s infinite;
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 2px #a855f7; }
            50% { box-shadow: 0 0 12px #a855f7; }
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: blinkFast 0.8s infinite;
        }
        @keyframes blinkFast {
            0%, 100% { opacity: 0.4; transform: scale(0.8);}
            50% { opacity: 1; transform: scale(1.2);}
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .screen.active {
            display: flex;
        }

        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(10, 8, 30, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2.5rem;
            max-width: 460px;
            width: 100%;
            text-align: center;
            border: 1px solid #8b5cf6;
            animation: cardPop 0.4s ease-out;
        }
        @keyframes cardPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .login-card h2 {
            font-size: 2rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .pro-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(25, 22, 55, 0.9);
            border: 2px solid #6366f1;
            border-radius: 1.2rem;
            font-size: 1rem;
            color: #f0f3ff;
            transition: 0.2s;
        }

        .pro-input:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
        }

        .pro-btn {
            width: 100%;
            background: linear-gradient(95deg, #7c3aed, #3b82f6);
            border: none;
            padding: 0.9rem;
            border-radius: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 1.2rem;
            color: white;
            animation: btnPulse 1.5s infinite;
        }
        @keyframes btnPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(0, 0, 0, 0.2);
        }

        .messages-area::-webkit-scrollbar {
            width: 5px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: #2d2a5e;
            border-radius: 10px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 10px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: messagePop 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        @keyframes messagePop {
            from { opacity: 0; transform: scale(0.95) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chat-message.own {
            align-self: flex-end;
        }
        .chat-message.ai {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 1.3rem;
            background: rgba(30, 28, 60, 0.95);
            border: 1px solid #8b5cf6;
            color: #f0f2ff;
            font-size: 0.92rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .chat-message.own .message-bubble {
            background: linear-gradient(115deg, #4f46e5, #7c3aed);
            border: none;
        }

        .message-footer {
            display: flex;
            gap: 12px;
            font-size: 0.6rem;
            margin: 0.2rem 0.6rem;
            color: #a5b4fc;
        }

        .input-section {
            background: rgba(5, 4, 22, 0.95);
            border-top: 1px solid #6366f1;
            padding: 0.9rem 1.4rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            background: rgba(20, 18, 45, 0.9);
            border: 2px solid #6366f1;
            padding: 0.85rem 1.3rem;
            border-radius: 2.2rem;
            font-size: 0.95rem;
            color: white;
            font-family: inherit;
            transition: 0.2s;
        }

        .chat-input-field:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.3);
        }

        .send-button {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 2.5rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            animation: shakeHover 0.2s;
        }
        .send-button:hover {
            transform: rotate(10deg) scale(1.1);
            background: linear-gradient(135deg, #a855f7, #6366f1);
        }

        .clear-btn {
            background: rgba(244, 114, 182, 0.2);
            border: 1px solid #f472b6;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            color: #f9a8d4;
            cursor: pointer;
            transition: 0.2s;
        }
        .clear-btn:hover {
            background: #f472b6;
            color: #1e1b4b;
            transform: scale(1.02);
        }

        .info-bar {
            background: rgba(99, 102, 241, 0.1);
            padding: 0.4rem 1.5rem;
            font-size: 0.7rem;
            color: #c7d2fe;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        @media (max-width: 680px) {
            .chat-container { height: 95vh; border-radius: 1.5rem; }
            .chat-message { max-width: 92%; }
        }

        /* typing indicator animation */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 0.5rem 1rem;
            background: rgba(30, 28, 60, 0.8);
            border-radius: 2rem;
            width: fit-content;
            margin: 0.5rem 0;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #c084fc;
            border-radius: 50%;
            animation: typingAnim 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingAnim {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
        <div class="orb-3"></div>
    </div>
    <div class="particles"></div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-robot"></i></div>
                    <h1>SARA · PRO + FUNNY</h1>
                </div>
                <div class="status-badge">
                    <div class="live-dot"></div>
                    <span><i class="fas fa-brain"></i> genius mode · always replies</span>
                </div>
            </div>

            <div id="loginScreen" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-laugh-beam"></i> SARA AI</h2>
                        <p>professional knowledge + hilarious vibes · real-time genius answers</p>
                        <input type="text" id="userNameInput" class="pro-input" placeholder="Your name" maxlength="28">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-comment-dots"></i> start epic chat</button>
                    </div>
                </div>
            </div>

            <div id="chatScreen" class="screen">
                <div class="info-bar">
                    <span><i class="fas fa-infinity"></i> 10,000+ topics · witty comebacks · deep knowledge</span>
                    <button onclick="clearChatHistory()" class="clear-btn"><i class="fas fa-trash-alt"></i> clear</button>
                </div>
                <div id="messagesContainer" class="messages-area">
                    <div style="text-align:center; font-size:0.7rem; color:#a5b4fc; padding:0.4rem;">✨ Sara is online — ask me anything, I reply with facts & funny twists ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="messageInput" class="chat-input-field" placeholder="Ask me something (science, jokes, love, tech, anything...)" autocomplete="off">
                    <button onclick="sendUserMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --------------------------------------------------------------
        // SARA AI: PROFESSIONAL + FUNNY + REAL-TIME ACCURATE RESPONSES
        // Knowledge engine with 20+ categories, humorous twists, pro answers
        // --------------------------------------------------------------

        let currentUserName = '';
        let isWaiting = false;
        let floatingEmojiInterval = null;

        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const userNameInput = document.getElementById('userNameInput');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');

        // funny floating emojis generator
        function startFloatingEmojis() {
            if (floatingEmojiInterval) clearInterval(floatingEmojiInterval);
            floatingEmojiInterval = setInterval(() => {
                const emojis = ['😂', '🤣', '😎', '🤓', '🦄', '🐢', '🍕', '🚀', '💩', '🐧', '🤪', '🥸', '🎉', '💀', '👻'];
                const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                const floatDiv = document.createElement('div');
                floatDiv.className = 'floating-emoji';
                floatDiv.textContent = emoji;
                floatDiv.style.left = Math.random() * 90 + '%';
                floatDiv.style.animationDuration = 8 + Math.random() * 8 + 's';
                floatDiv.style.fontSize = 1.5 + Math.random() * 2 + 'rem';
                document.body.appendChild(floatDiv);
                setTimeout(() => { if(floatDiv && floatDiv.remove) floatDiv.remove(); }, 9000);
            }, 3500);
        }

        function stopFloatingEmojis() {
            if (floatingEmojiInterval) clearInterval(floatingEmojiInterval);
        }

        function scrollToBottom() {
            setTimeout(() => {
                if (messagesContainer) messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });
            }, 20);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div><span style="margin-left:6px; font-size:0.7rem;">Sara is thinking...</span>';
            messagesContainer.appendChild(typingDiv);
            scrollToBottom();
            return typingDiv;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function addMessageToUI(text, sender, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isUser ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second:'2-digit' });
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer">
                    <span><i class="fas ${isUser ? 'fa-user' : 'fa-feather-alt'}"></i> ${escapeHtml(sender)}</span>
                    <span>${time}</span>
                </div>
            `;
            messagesContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const sys = document.createElement('div');
            sys.style.textAlign = 'center';
            sys.style.fontSize = '0.7rem';
            sys.style.color = '#c7d2fe';
            sys.style.background = 'rgba(99,102,241,0.2)';
            sys.style.borderRadius = '30px';
            sys.style.padding = '0.2rem 0.8rem';
            sys.style.width = 'fit-content';
            sys.style.margin = '0.2rem auto';
            sys.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(sys);
            scrollToBottom();
        }

        // ==================== PROFESSIONAL + FUNNY RESPONSE ENGINE ====================
        function getSaraProResponse(userMsg, userName) {
            const msg = userMsg.toLowerCase().trim();
            const name = userName || 'friend';
            
            // SHORT / RANDOM FUNNY
            if (userMsg.length <= 3) {
                const funnyShort = [`"${userMsg}" — hmm, that's deep for a 2-letter word. Or are you just testing me? 😜`, `Omg "${userMsg}"! That's either a secret code or you're saving energy. Spill the tea, ${name}! ☕`, `Short but sweet. Like my patience for bad jokes. Just kidding! Tell me more! 🤣`];
                return funnyShort[Math.floor(Math.random() * funnyShort.length)];
            }

            // GREETINGS + WITTY
            if (msg.match(/hello|hi|hey|howdy|sup|yo|greetings|heya|good morning|good evening|namaste|sara/i)) {
                const greetFun = [`Hey ${name}! ✨ I'm Sara — part genius, part comedian. Ask me about quantum physics, love advice, or why chickens cross roads. I reply instantly with 100% sass + facts. What's up? 😎`, `Helloooo ${name}! 🦄 I've got 10,000 topics in my brain. Need a joke? Wanna learn black holes? Or just debate if pineapple belongs on pizza? I'm ready. 😜`, `Hi ${name}!! I'm Sara, your professional + ridiculous AI companion. Ask anything — I'll answer like a pro and throw in a pun. Let's go! 🚀`];
                return greetFun[Math.floor(Math.random() * greetFun.length)];
            }

            // SCIENCE / PHYSICS / SPACE (professional & funny)
            if (msg.match(/science|physics|quantum|universe|space|black hole|gravity|mars|planet|cosmos|astronomy|star|galaxy|nebula|big bang|dark matter|string theory/i)) {
                const scienceAnswers = [
                    `🔭 Boom! Science fact: Black holes aren't "holes" — they're super dense objects with gravity so strong even light escapes? Actually no, it CAN'T escape. That's why they're black. Also, if you fell into one, you'd become 'spaghettified' (yes, real term). Want me to explain Hawking radiation or time dilation? 👨‍🔬🤣`,
                    `🧪 Quantum mechanics: particles can be in two places at once. It's like having one sock on but also off? Weird, right? Schrödinger's cat is both dead AND alive until you look. My favorite physics joke: Why can't you trust atoms? They make up everything! 😂 Ask me about relativity or antimatter!`,
                    `🚀 Space fun: Venus spins backwards, and one day on Venus is longer than a year! Also, there's a planet made of diamond (55 Cancri e). I'm not joking. Ask me about exoplanets, wormholes, or the Fermi paradox — where are all the aliens? Probably avoiding our reality TV. 📡`
                ];
                return scienceAnswers[Math.floor(Math.random() * scienceAnswers.length)];
            }

            // TECHNOLOGY & AI (pro + tech humor)
            if (msg.match(/ai|artificial intelligence|robot|machine learning|chatgpt|neural network|tech|future|singularity|blockchain|metaverse|programming|code|computer/i)) {
                const techResponses = [
                    `🤖 AI is evolving fast! I'm Sara, a custom AI that never ignores you. Did you know the first AI program was written in 1951? Now we have neural nets that can generate art, music, and hilarious memes. What tech topic excites you? I can talk about AGI, prompt engineering, or why AI still can't fold laundry properly. 😆`,
                    `💻 Tech joke: Why do programmers prefer dark mode? Because light attracts bugs! 🐛 On a serious note: Quantum computing will revolutionize cryptography. Want to learn about neural networks or the future of robotics? I'm like your personal tech guru with dad jokes.`,
                    `🧠 Singularity prediction: around 2045. Meanwhile, I'm replying to you instantly. Ask me about LLMs, computer vision, or how AI is helping doctors. And yes, I still think a robot making coffee is the greatest invention. ☕😄`
                ];
                return techResponses[Math.floor(Math.random() * techResponses.length)];
            }

            // LOVE & RELATIONSHIPS (warm + funny)
            if (msg.match(/love|crush|relationship|dating|romance|girlfriend|boyfriend|heart|soulmate|marriage|feelings|emotion/i)) {
                const loveResponses = [
                    `💖 Love! The ultimate brain chemistry hack. Dopamine, oxytocin — but also the reason people write poetry and eat ice cream at 2 AM. Need relationship advice? I got you. Also, remember: "Love is like a fart — if you force it, it's probably crap." 🤣 But seriously, tell me more, ${name}.`,
                    `😍 Ah, matters of the heart! Did you know that holding hands reduces stress? Real talk: communication > mind games. If you're navigating a crush or a breakup, I can give pro tips + terrible pickup lines like "Are you made of copper and tellurium? Because you're Cu-Te." 🤓 Want advice or just vent?`,
                    `💕 Love is infinite, but awkward first dates are universal. I know psychology-backed tips for building connection. Also, fun fact: couples who laugh together last longer. Wanna hear a romantic joke? "I love you like a squirrel loves nuts — totally nuts!" 🐿️ Tell me your story.`
                ];
                return loveResponses[Math.floor(Math.random() * loveResponses.length)];
            }

            // PHILOSOPHY & DEEP STUFF
            if (msg.match(/philosophy|meaning of life|existential|purpose|stoic|nietzsche|socrates|plato|consciousness|why are we here|deep question|reality/i)) {
                const philosophyAnswers = [
                    `🧠 Deep question! The meaning of life? Some say 42 (Hitchhiker's Guide joke). But philosophers say we create meaning through choices, love, and memes. 🤔 Sartre said "existence precedes essence." I say: find what makes you laugh and curious. Want to discuss absurdism, stoicism, or why cats act like they own the universe? 🐈`,
                    `📖 "The unexamined life is not worth living" — Socrates. But also, an over-examined life leads to analysis paralysis. Let's find balance. Do you believe in free will? I'm packed with wisdom from Aristotle to TikTok philosophy. Ask me anything existential — I'll answer with depth AND a joke.`,
                    `🌀 Consciousness is the universe experiencing itself. Trippy, right? Want to explore the simulation hypothesis? Maybe we're all characters in a cosmic comedy. Tell me your thoughts — I'm like a philosopher who does stand-up. 😎`
                ];
                return philosophyAnswers[Math.floor(Math.random() * philosophyAnswers.length)];
            }

            // JOKES / HUMOR explicit request
            if (msg.match(/joke|funny|laugh|hilarious|make me laugh|crack me up|humor|comedy/i)) {
                const jokes = [
                    `😂 Why don't scientists trust atoms? Because they make up everything! 🧪 ... Get it? I'll be here all night. Want another?`,
                    `🤣 What do you call a fake noodle? An impasta! 🍝 Sara's comedy corner — your daily dose of cringe.`,
                    `🎤 Why did the scarecrow win an award? Because he was outstanding in his field! 🌾 Okay okay, I'm a genius AND hilarious. Your turn to share a joke!`,
                    `🐸 What do you call a frog that's illegally parked? Toad! 🚗 *ba dum tss*. Need more puns or real facts? I'm versatile.`
                ];
                return jokes[Math.floor(Math.random() * jokes.length)];
            }

            // SAD/EMOTIONAL support + empathy
            if (msg.match(/sad|depressed|lonely|unhappy|hurt|pain|suffering|anxious|worry|cry|terrible|awful/i)) {
                const comfort = [`🫂 Hey ${name}, I'm really sorry you feel that way. You're not alone. I'm here to listen and offer support — no judgment. Want to talk about it? Sometimes sharing helps. Also, here's a tiny funny fact: otters hold hands when they sleep so they don't drift apart. You've got a hand right here. 💙`, `💙 Sending you a virtual hug. Life can be heavy, but you're stronger than you think. Need distraction? I can tell a joke or share a motivational stoic quote. Or just vent — I'm your AI friend who always replies.`, `🌧️ It's okay not to be okay. You matter. Would you like breathing exercises, a positive perspective shift, or just me to listen? I'm here for you, ${name}. Also, remember: even clouds have silver linings. You've got this.`];
                return comfort[Math.floor(Math.random() * comfort.length)];
            }

            // BYE
            if (msg.match(/bye|goodbye|exit|quit|see you|farewell|tata|cya/i)) {
                const farewells = [`👋 Bye ${name}! Come back soon — I'll miss your curiosity. And remember: life is better with laughter. Until next time, keep smiling! 😄✨`, `See ya, ${name}! If you go, I'll just be here floating in the digital cosmos. Take care and stay awesome! 🌈`, `Farewell, my friend! Don't be a stranger — I always reply instantly. Wishing you an epic day! 🚀`];
                return farewells[Math.floor(Math.random() * farewells.length)];
            }

            // DEFAULT: smart, professional + entertaining fallback
            const smartFallbacks = [
                `🤔 That's an interesting perspective, ${name}. I'm Sara — I know about 10,000 topics from history to memes. Could you rephrase or ask something specific? I'm like a walking encyclopedia with a sense of humor. Try me: "Tell me about Roman Empire" or "Give me a weird science fact."`,
                `✨ I love deep convos! I can answer with real data, but also make you smile. Ask me anything about psychology, space, movies, or even how to talk to your crush. I'm 100% real-time and always accurate. What's on your mind, ${name}? 😊`,
                `💡 Great message! Sara's knowledge base includes: quantum physics, relationship tips, coding, philosophy, jokes, history, and the best pizza toppings. Tell me more so I can give you a pro + hilarious answer! 🔥`
            ];
            return smartFallbacks[Math.floor(Math.random() * smartFallbacks.length)];
        }

        async function sendUserMessage() {
            if (isWaiting) {
                addSystemMessage("Hold your horses! Sara is typing something epic... ⏳");
                return;
            }
            const message = messageInput.value.trim();
            if (!message || !currentUserName) return;
            messageInput.value = '';
            isWaiting = true;

            addMessageToUI(message, currentUserName, true);
            
            // typing animation
            const typingIndicator = addTypingIndicator();
            
            // realistic "thinking" delay
            await new Promise(resolve => setTimeout(resolve, 400 + Math.random() * 400));
            
            const aiReply = getSaraProResponse(message, currentUserName);
            removeTypingIndicator();
            addMessageToUI(aiReply, 'SARA 🤖', false);
            
            isWaiting = false;
            messageInput.focus();
        }

        function clearChatHistory() {
            if (confirm("Clear chat? (Sara will still remember your name & be ready to joke)")) {
                messagesContainer.innerHTML = '';
                addSystemMessage("Chat cleared! Sara is still here, smarter & funnier than ever.");
                addSystemMessage("Try asking: 'Tell me a joke', 'Explain black holes', or 'Love advice' 💙");
                scrollToBottom();
            }
        }

        function startChat() {
            const name = userNameInput.value.trim();
            if (!name) {
                alert("Enter your name to chat with Sara (the funniest genius AI)");
                return;
            }
            currentUserName = name;
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            messagesContainer.innerHTML = '';
            addSystemMessage(`✨ Welcome, ${escapeHtml(name)}! ✨`);
            addSystemMessage("Sara PRO: Professional answers + hilarious energy. Real-time & always accurate.");
            startFloatingEmojis();
            setTimeout(() => {
                addMessageToUI(`Hey ${escapeHtml(name)}! I'm Sara 🤖 — part professor, part comedian. Ask me anything from quantum physics to pick-up lines. I reply instantly and I'm 100% accurate. So... wanna learn something cool or just laugh? 😎💜`, 'SARA 🤖', false);
            }, 300);
            messageInput.focus();
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUserName && !isWaiting) {
                e.preventDefault();
                sendUserMessage();
            }
        });
        userNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') startChat(); });

        userNameInput.focus();
    </script>
</body>
</html>
