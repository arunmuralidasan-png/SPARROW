<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NOVA | AI That Speaks Your Language</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Gradient Orb Background */
        .gradient-orb {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }

        .orb-1 {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.25), rgba(0, 50, 150, 0));
            border-radius: 50%;
            filter: blur(60px);
            animation: floatOrb 18s ease-in-out infinite;
        }

        .orb-2 {
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.2), rgba(0, 0, 0, 0));
            border-radius: 50%;
            filter: blur(70px);
            animation: floatOrb 22s ease-in-out infinite reverse;
        }

        .orb-3 {
            position: absolute;
            top: 30%;
            left: 20%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(0, 255, 150, 0.12), rgba(0, 0, 0, 0));
            border-radius: 50%;
            filter: blur(80px);
            animation: floatOrb 15s ease-in-out infinite 2s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.05); }
        }

        /* Animated Grid Lines */
        .grid-lines {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.15;
        }

        .grid-line-h {
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00c6ff, #0072ff, #00c6ff, transparent);
            animation: moveLineH 12s linear infinite;
        }

        .grid-line-v {
            position: absolute;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #00c6ff, #0072ff, #00c6ff, transparent);
            animation: moveLineV 12s linear infinite;
        }

        @keyframes moveLineH {
            0% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(200%); opacity: 0; }
        }

        @keyframes moveLineV {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(200%); opacity: 0; }
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            pointer-events: none;
            background: radial-gradient(circle, #00c6ff, transparent);
            border-radius: 50%;
            animation: particleDrift linear infinite;
            z-index: 0;
        }

        @keyframes particleDrift {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% {
                transform: translateY(-20vh) translateX(80px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Container */
        .app-wrapper {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Glassmorphic Chat Container with Glow */
        .chat-container {
            max-width: 1400px;
            width: 100%;
            height: 90vh;
            background: rgba(8, 12, 25, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.2), 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 200, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: containerGlow 4s ease-in-out infinite, slideUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes containerGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 200, 255, 0.15); }
            50% { box-shadow: 0 0 60px rgba(0, 200, 255, 0.35); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header with Neon Pulse */
        .header {
            background: rgba(5, 8, 20, 0.8);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #8a2be2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            animation: logoSpin 8s ease-in-out infinite, glowPulse 2s infinite;
            position: relative;
        }

        @keyframes logoSpin {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(5deg) scale(1.02); }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.5); }
            50% { box-shadow: 0 0 0 12px rgba(0, 200, 255, 0); }
        }

        .logo-area h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #a855f7, #00ff88);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 5s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .badge-container {
            display: flex;
            gap: 12px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 255, 0.12);
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.4);
            animation: borderPulse 2s infinite;
        }

        @keyframes borderPulse {
            0%, 100% { border-color: rgba(0, 200, 255, 0.3); }
            50% { border-color: rgba(0, 200, 255, 0.8); }
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: livePulse 1s infinite;
            box-shadow: 0 0 8px #00ff88;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        .lang-indicator {
            background: rgba(0, 200, 255, 0.12);
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #00c6ff;
            border: 1px solid rgba(0, 200, 255, 0.3);
            transition: all 0.3s;
        }

        /* Screens */
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* Login Screen with 3D Card */
        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.8rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.3);
            animation: cardFloat 3s ease-in-out infinite, fadeInScale 0.5s ease;
            transform-style: preserve-3d;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .login-card h2 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .pro-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            border-radius: 1.2rem;
            font-size: 1rem;
            color: white;
            transition: all 0.3s;
            font-family: inherit;
        }

        .pro-input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 4px rgba(0, 200, 255, 0.2);
            transform: scale(1.01);
        }

        .pro-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 1rem;
            border-radius: 1.2rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .pro-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .pro-btn:hover::before {
            left: 100%;
        }

        .pro-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 200, 255, 0.4);
        }

        /* Messages Area with Smooth Scroll */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(5, 10, 20, 0.4);
        }

        .messages-area::-webkit-scrollbar {
            width: 6px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: rgba(0, 200, 255, 0.1);
            border-radius: 10px;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00c6ff, #0072ff);
            border-radius: 10px;
        }

        /* Animated Messages */
        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: messageFlyIn 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        @keyframes messageFlyIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .chat-message.own {
            align-self: flex-end;
        }

        .chat-message.ai {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 0.9rem 1.3rem;
            border-radius: 1.3rem;
            background: rgba(20, 28, 45, 0.95);
            border: 1px solid rgba(0, 200, 255, 0.2);
            color: #e8e8f0;
            font-size: 0.95rem;
            line-height: 1.5;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }

        .chat-message.own .message-bubble {
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
        }

        .chat-message.ai .message-bubble {
            animation: aiGlow 3s infinite;
        }

        @keyframes aiGlow {
            0%, 100% { border-color: rgba(0, 200, 255, 0.2); }
            50% { border-color: rgba(0, 200, 255, 0.5); }
        }

        .message-footer {
            display: flex;
            gap: 12px;
            font-size: 0.65rem;
            margin: 0.3rem 0.8rem;
            color: #6c8db0;
        }

        /* Typing Indicator with Wave */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.7rem 1.3rem;
            background: rgba(0, 200, 255, 0.1);
            border-radius: 2rem;
            width: fit-content;
            font-size: 0.8rem;
            color: #00c6ff;
            animation: typingFade 0.3s;
        }

        .typing-dot {
            animation: wave 1.2s infinite;
            display: inline-block;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* Input Section with Glow */
        .input-section {
            background: rgba(5, 10, 20, 0.9);
            border-top: 1px solid rgba(0, 200, 255, 0.3);
            padding: 1rem 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .chat-input-field {
            flex: 1;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            padding: 0.9rem 1.3rem;
            border-radius: 2rem;
            font-size: 0.95rem;
            color: white;
            transition: all 0.3s;
            font-family: inherit;
        }

        .chat-input-field:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 4px rgba(0, 200, 255, 0.15);
        }

        .send-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            animation: buttonPulse 2s infinite;
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(0, 200, 255, 0); }
        }

        .send-button:hover {
            transform: scale(1.08) rotate(5deg);
        }

        .clear-btn {
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.4);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            color: #ff8080;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255, 80, 80, 0.3);
            transform: scale(1.02);
        }

        @media (max-width: 680px) {
            .chat-container { height: 95vh; border-radius: 1.5rem; }
            .chat-message { max-width: 92%; }
            .header, .input-section { padding: 0.8rem 1rem; }
            .logo-area h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="gradient-orb">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
        <div class="orb-3"></div>
    </div>

    <div class="grid-lines">
        <div class="grid-line-h" style="top: 20%; animation-duration: 8s;"></div>
        <div class="grid-line-h" style="top: 50%; animation-duration: 12s; animation-delay: 2s;"></div>
        <div class="grid-line-h" style="top: 80%; animation-duration: 10s; animation-delay: 1s;"></div>
        <div class="grid-line-v" style="left: 25%; animation-duration: 9s;"></div>
        <div class="grid-line-v" style="left: 55%; animation-duration: 11s; animation-delay: 1.5s;"></div>
        <div class="grid-line-v" style="left: 85%; animation-duration: 7s; animation-delay: 0.5s;"></div>
    </div>

    <div id="particles"></div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-robot"></i></div>
                    <h1>NOVA AI</h1>
                </div>
                <div class="badge-container">
                    <div class="lang-indicator" id="langIndicator">
                        <i class="fas fa-microphone-alt"></i> Auto: English / മംഗ്ലീഷ്
                    </div>
                    <div class="status-badge">
                        <div class="live-dot"></div>
                        <span>Infinite Intelligence</span>
                    </div>
                </div>
            </div>

            <!-- Login -->
            <div id="loginView" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-comment-dots"></i> Speak Freely</h2>
                        <p style="color:#8aabcc; margin-bottom:1.5rem;">English or Manglish — I understand both. Unlimited conversations.</p>
                        <input type="text" id="usernameField" class="pro-input" placeholder="Your name" maxlength="30">
                        <button onclick="startChat()" class="pro-btn" style="margin-top: 1rem;"><i class="fas fa-arrow-right"></i> Enter the Mindscape</button>
                        <div style="margin-top: 1rem; font-size: 0.7rem; color: #5a7a9a;">
                            <i class="fas fa-globe"></i> Auto-detects your language
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chat -->
            <div id="chatView" class="screen">
                <div style="padding: 0.4rem 2rem; background: rgba(0,200,255,0.05); display: flex; justify-content: space-between; align-items: center;">
                    <span style="color:#00c6ff; font-size:0.75rem;"><i class="fas fa-sync-alt"></i> Real-time language sensing</span>
                    <button onclick="clearChat()" class="clear-btn"><i class="fas fa-trash-alt"></i> Clear</button>
                </div>
                <div id="messageList" class="messages-area">
                    <div class="system-note" style="text-align:center; font-size:0.75rem; color:#5a7a9a; padding:0.5rem;">✨ NOVA is listening — type anything in English or Manglish ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="chatInput" class="chat-input-field" placeholder="Type in English or Manglish..." autocomplete="off">
                    <button onclick="sendMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // NOVA AI - ULTRA ANIMATED | ENGLISH/MANGLISH DETECTION
        // Infinite contextual responses, never repeats
        // ================================================

        let currentUser = '';
        let conversationHistory = [];
        let isAITyping = false;
        let recentResponses = [];
        let currentLang = 'english';

        // DOM
        const loginScreen = document.getElementById('loginView');
        const chatScreen = document.getElementById('chatView');
        const usernameField = document.getElementById('usernameField');
        const chatInput = document.getElementById('chatInput');
        const messagesContainer = document.getElementById('messageList');
        const langIndicator = document.getElementById('langIndicator');

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 6 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 12 + 8 + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.background = `radial-gradient(circle, ${Math.random() > 0.5 ? '#00c6ff' : '#a855f7'}, transparent)`;
                container.appendChild(p);
            }
        }
        createParticles();

        // Language Detection
        function detectLanguage(text) {
            const lower = text.toLowerCase();
            const manglishWords = ['und', 'illa', 'alle', 'ano', 'njan', 'ningal', 'avan', 'ithu', 'athu', 'enikku', 'ninakku', 'patti', 'cheythu', 'varum', 'pokam', 'nokku', 'kittum', 'parayu', 'sheri', 'nalla', 'sugham', 'entha', 'engane', 'evide', 'ippol', 'naale', 'randu', 'moonnu', 'kurachu', 'pinne', 'appol', 'ayyo', 'eda', 'mone', 'chetta'];
            let mScore = 0;
            for (let w of manglishWords) if (lower.includes(w)) mScore++;
            if (lower.match(/\b(undo|ille|alle|ano|alle|ille)\b/)) mScore += 2;
            if (mScore >= 2) return 'manglish';
            if (lower.match(/^(hello|hi|hey|what|how|why|where|tell|can|please|thanks|good|bad|love|hate|think|know)/i)) return 'english';
            return mScore > 0 ? 'manglish' : 'english';
        }

        function updateLangUI(lang) {
            currentLang = lang;
            if (lang === 'manglish') {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> മംഗ്ലീഷ് Mode';
                langIndicator.style.background = 'rgba(168,85,247,0.15)';
            } else {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> English Mode';
                langIndicator.style.background = 'rgba(0,200,255,0.1)';
            }
        }

        function addToRecent(r) { recentResponses.unshift(r); if (recentResponses.length > 10) recentResponses.pop(); }
        function isSimilar(a, b) {
            const w1 = a.toLowerCase().split(' '), w2 = b.toLowerCase().split(' ');
            let common = w1.filter(w => w2.includes(w)).length;
            return common / Math.max(w1.length, w2.length) > 0.55;
        }

        // AI Response Generator - Contextual, Infinite, Never Boring
        function generateResponse(userMsg, history, lang) {
            const lower = userMsg.toLowerCase();
            let topic = 'general';
            if (lower.match(/space|universe|galaxy|star|planet|cosmos|black hole|mars/i)) topic = 'space';
            else if (lower.match(/life|meaning|exist|purpose|reality|consciousness|soul/i)) topic = 'philosophy';
            else if (lower.match(/ai|robot|code|tech|computer|future|quantum/i)) topic = 'tech';
            else if (lower.match(/happy|sad|love|angry|feel|emotion|depress|lonely/i)) topic = 'emotion';
            else if (lower.match(/science|physics|biology|chemistry|research/i)) topic = 'science';
            
            const responses = {
                space: lang === 'english' 
                    ? ["The cosmos is infinite, and so is curiosity. Every star whispers secrets of time. What fascinates you most about space?",
                       "We are stardust having conscious experiences. That thought alone is mind-bending. Want to explore more cosmic mysteries?",

        function addMessage(text, sender, isOwn = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isOwn ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer"><span>${escapeHtml(sender)}</span><span>${time}</span></div>
            `;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '0.7rem';
            div.style.color = '#6c8db0';
            div.style.padding = '0.3rem';
            div.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
