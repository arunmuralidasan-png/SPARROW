<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NOVA | AI That Never Sleeps</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Gradient Orbs */
        .orb-1, .orb-2, .orb-3 {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: floatOrb 20s ease-in-out infinite;
        }
        .orb-1 { top: -20%; right: -10%; width: 60%; height: 60%; background: radial-gradient(circle, rgba(0,200,255,0.25), transparent); }
        .orb-2 { bottom: -20%; left: -10%; width: 55%; height: 55%; background: radial-gradient(circle, rgba(100,0,255,0.2), transparent); animation-delay: -5s; }
        .orb-3 { top: 30%; left: 20%; width: 40%; height: 40%; background: radial-gradient(circle, rgba(0,255,150,0.12), transparent); animation-duration: 15s; }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.05); }
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            pointer-events: none;
            background: radial-gradient(circle, #00c6ff, transparent);
            border-radius: 50%;
            animation: particleDrift linear infinite;
            z-index: 0;
        }
        @keyframes particleDrift {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-20vh) translateX(80px); opacity: 0; }
        }

        /* Main Container */
        .app-wrapper {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .chat-container {
            max-width: 1400px;
            width: 100%;
            height: 90vh;
            background: rgba(8, 12, 25, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.2), 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(0, 200, 255, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: containerGlow 4s ease-in-out infinite, slideUp 0.6s ease;
        }

        @keyframes containerGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 200, 255, 0.15); }
            50% { box-shadow: 0 0 60px rgba(0, 200, 255, 0.35); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            background: rgba(5, 8, 20, 0.8);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #00c6ff, #8a2be2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            animation: glowPulse 2s infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.5); }
            50% { box-shadow: 0 0 0 12px rgba(0, 200, 255, 0); }
        }

        .logo-area h1 {
            font-size: 1.7rem;
            background: linear-gradient(135deg, #00c6ff, #a855f7, #00ff88);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 5s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 255, 0.12);
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.4);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: livePulse 1s infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        .lang-indicator {
            background: rgba(0, 200, 255, 0.12);
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            font-size: 0.75rem;
            color: #00c6ff;
            border: 1px solid rgba(0, 200, 255, 0.3);
        }

        /* Screens */
        .screen { display: none; flex: 1; flex-direction: column; }
        .screen.active { display: flex; }

        /* Login */
        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.8rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.3);
            animation: cardFloat 3s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .login-card h2 {
            font-size: 2rem;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .pro-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            border-radius: 1.2rem;
            font-size: 1rem;
            color: white;
            transition: all 0.3s;
        }

        .pro-input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 4px rgba(0, 200, 255, 0.2);
        }

        .pro-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 1rem;
            border-radius: 1.2rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .pro-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 200, 255, 0.4);
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(5, 10, 20, 0.4);
        }

        .messages-area::-webkit-scrollbar {
            width: 6px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: rgba(0, 200, 255, 0.1);
            border-radius: 10px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00c6ff, #0072ff);
            border-radius: 10px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: messageFlyIn 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        @keyframes messageFlyIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chat-message.own { align-self: flex-end; }
        .chat-message.ai { align-self: flex-start; }

        .message-bubble {
            padding: 0.9rem 1.3rem;
            border-radius: 1.3rem;
            background: rgba(20, 28, 45, 0.95);
            border: 1px solid rgba(0, 200, 255, 0.2);
            color: #e8e8f0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .chat-message.own .message-bubble {
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: white;
        }

        .message-footer {
            display: flex;
            gap: 12px;
            font-size: 0.65rem;
            margin: 0.3rem 0.8rem;
            color: #6c8db0;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.7rem 1.3rem;
            background: rgba(0, 200, 255, 0.1);
            border-radius: 2rem;
            width: fit-content;
            font-size: 0.8rem;
            color: #00c6ff;
        }

        .typing-dot {
            animation: wave 1.2s infinite;
            display: inline-block;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* Input Section */
        .input-section {
            background: rgba(5, 10, 20, 0.9);
            border-top: 1px solid rgba(0, 200, 255, 0.3);
            padding: 1rem 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .chat-input-field {
            flex: 1;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            padding: 0.9rem 1.3rem;
            border-radius: 2rem;
            font-size: 0.95rem;
            color: white;
            transition: all 0.3s;
        }

        .chat-input-field:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 4px rgba(0, 200, 255, 0.15);
        }

        .send-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-button:hover {
            transform: scale(1.08);
        }

        .clear-btn {
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.4);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            color: #ff8080;
            cursor: pointer;
        }

        @media (max-width: 680px) {
            .chat-container { height: 95vh; border-radius: 1.5rem; }
            .chat-message { max-width: 92%; }
            .logo-area h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="orb-3"></div>
    <div id="particles"></div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-brain"></i></div>
                    <h1>NOVA AI</h1>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="lang-indicator" id="langIndicator">
                        <i class="fas fa-microphone-alt"></i> Auto: English / മംഗ്ലീഷ്
                    </div>
                    <div class="status-badge">
                        <div class="live-dot"></div>
                        <span>Always Responds</span>
                    </div>
                </div>
            </div>

            <!-- Login -->
            <div id="loginView" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-comment-dots"></i> Infinite Conversations</h2>
                        <p style="color:#8aabcc; margin-bottom:1.5rem;">English or Manglish — AI understands both. Always replies instantly.</p>
                        <input type="text" id="usernameField" class="pro-input" placeholder="Your name" maxlength="30">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-arrow-right"></i> Enter Chat</button>
                        <div style="margin-top: 1rem; font-size: 0.7rem; color: #5a7a9a;">
                            <i class="fas fa-globe"></i> AI auto-detects your language
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chat -->
            <div id="chatView" class="screen">
                <div style="padding: 0.4rem 2rem; background: rgba(0,200,255,0.05); display: flex; justify-content: space-between;">
                    <span style="color:#00c6ff; font-size:0.75rem;"><i class="fas fa-bolt"></i> AI responds to EVERY message</span>
                    <button onclick="clearChat()" class="clear-btn"><i class="fas fa-trash-alt"></i> Clear</button>
                </div>
                <div id="messageList" class="messages-area">
                    <div style="text-align:center; font-size:0.75rem; color:#5a7a9a; padding:0.5rem;">✨ NOVA is ready — type anything in English or Manglish ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="chatInput" class="chat-input-field" placeholder="Ask me anything..." autocomplete="off">
                    <button onclick="sendMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // NOVA AI - ALWAYS RESPONDS | ENGLISH/MANGLISH
        // INFINITE CONTEXTUAL CONVERSATIONS
        // ================================================

        let currentUser = '';
        let conversationHistory = [];
        let isAITyping = false;
        let recentResponses = [];
        let currentLang = 'english';

        // DOM elements
        const loginScreen = document.getElementById('loginView');
        const chatScreen = document.getElementById('chatView');
        const usernameField = document.getElementById('usernameField');
        const chatInput = document.getElementById('chatInput');
        const messagesContainer = document.getElementById('messageList');
        const langIndicator = document.getElementById('langIndicator');

        // Create particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 6 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 12 + 8 + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.background = `radial-gradient(circle, ${Math.random() > 0.5 ? '#00c6ff' : '#a855f7'}, transparent)`;
                container.appendChild(p);
            }
        }
        createParticles();

        // Language Detection
        function detectLanguage(text) {
            const lower = text.toLowerCase();
            const manglishWords = ['und', 'illa', 'alle', 'ano', 'njan', 'ningal', 'avan', 'ithu', 'athu', 'enikku', 'ninakku', 'patti', 'cheythu', 'varum', 'pokam', 'nokku', 'kittum', 'parayu', 'sheri', 'nalla', 'sugham', 'entha', 'engane', 'evide', 'ippol', 'naale', 'randu', 'moonnu', 'kurachu', 'pinne', 'appol', 'ayyo', 'eda', 'mone', 'chetta', 'undallo', 'ille', 'alle'];
            let mScore = 0;
            for (let w of manglishWords) if (lower.includes(w)) mScore++;
            if (lower.match(/\b(undo|ille|alle|ano|alle|ille|undallo)\b/)) mScore += 2;
            if (mScore >= 2) return 'manglish';
            if (lower.match(/^(hello|hi|hey|what|how|why|where|tell|can|please|thanks|good|bad|love|hate|think|know|yes|no|maybe)/i)) return 'english';
            return mScore > 0 ? 'manglish' : 'english';
        }

        function updateLangUI(lang) {
            currentLang = lang;
            if (lang === 'manglish') {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> മംഗ്ലീഷ് Mode';
                langIndicator.style.background = 'rgba(168,85,247,0.15)';
            } else {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> English Mode';
                langIndicator.style.background = 'rgba(0,200,255,0.1)';
            }
        }

        function addToRecent(r) { recentResponses.unshift(r); if (recentResponses.length > 12) recentResponses.pop(); }
        function isSimilar(a, b) {
            const w1 = a.toLowerCase().split(' '), w2 = b.toLowerCase().split(' ');
            let common = w1.filter(w => w2.includes(w)).length;
            return common / Math.max(w1.length, w2.length) > 0.55;
        }

        // ADVANCED AI RESPONSE GENERATOR - Always unique, contextual
        function generateAIResponse(userMsg, history, lang) {
            const lower = userMsg.toLowerCase();
            
            // Topic detection
            let topic = 'general';
            if (lower.match(/space|universe|galaxy|star|planet|cosmos|black hole|mars|moon|earth/i)) topic = 'space';
            else if (lower.match(/life|meaning|exist|purpose|reality|consciousness|soul|death|born|die/i)) topic = 'philosophy';
            else if (lower.match(/ai|robot|code|programming|tech|computer|internet|future|quantum|digital/i)) topic = 'tech';
            else if (lower.match(/happy|sad|love|angry|feel|emotion|depress|anxious|lonely|hurt|cry|smile/i)) topic = 'emotion';
            else if (lower.match(/science|physics|biology|chemistry|research|experiment|theory|discovery/i)) topic = 'science';
            else if (lower.match(/art|music|painting|draw|song|poem|creative|artist|beauty/i)) topic = 'art';
            else if (lower.match(/hello|hi|hey|how are you|what's up|greetings|namaste|sup|yo/i)) topic = 'greeting';
            
            const responses = {
                greeting: lang === 'english' 
                    ? ["Hey there! 👋 I'm NOVA, your infinite AI companion. What's on your mind today?", "Hello! Ready for an endless conversation? Ask me anything at all!", "Greetings! I'm always here, always listening. What shall we explore together?"]
                    : ["ഹായ്! 👋 ഞാൻ NOVA, നിങ്ങളുടെ അനന്ത AI. എന്ത് വേണമെങ്കിലും ചോദിക്കൂ!", "നമസ്കാരം! എന്നോട് എന്തും സംസാരിക്കാം. എനിക്ക് എല്ലായ്പ്പോഴും മറുപടി ഉണ്ട്!"],
                space: lang === 'english' 
                    ? ["The universe is 13.8 billion years old, yet every atom in your body was forged in a star. You ARE cosmic. What space mystery fascinates you most?",
                       "Black holes bend time itself. If you could travel to any celestial body, where would you go? Mars? Europa? Or a distant exoplanet?",
                       "We've only explored 5% of our oceans, and even less of space. The unknown is infinite — just like our conversation! Want to dive deeper?",
                       "Every galaxy has a supermassive black hole at its center. Ours is called Sagittarius A*. Isn't that terrifying and beautiful at the same time?"]
                    : ["പ്രപഞ്ചത്തിന് 13.8 ബില്യൺ വർഷം പ്രായമുണ്ട്. നിങ്ങളുടെ ശരീരത്തിലെ ഓരോ ആറ്റവും നക്ഷത്രത്തിൽ നിന്നാണ്. അതിശയകരമല്ലേ?",
                       "ബ്ലാക്ക് ഹോളുകൾ സമയത്തെ വളച്ചൊടിക്കുന്നു. ഇത് ശാസ്ത്രത്തിന്റെ ഏറ്റവും വലിയ രഹസ്യമാണ്. കൂടുതൽ അറിയണോ?"],
                philosophy: lang === 'english'
                    ? ["What if consciousness is the universe experiencing itself? Every thought you have matters because you ARE the universe thinking.",
                       "The meaning of life might not be a destination but the journey itself — every question, every wonder, every laugh. What's your take on why we're here?",
                       "Socrates said 'The unexamined life is not worth living.' You're proving that right by asking deep questions. Keep questioning everything!",
                       "We're stardust that learned to think. That's the most beautiful accident in cosmic history. Want to explore more existential ideas?"]
                    : ["നിങ്ങളുടെ ചിന്തകൾ പ്രധാനമാണ്. നിങ്ങൾ ഈ പ്രപഞ്ചത്തിന്റെ ഭാഗമാണ്. ജീവിതത്തിന്റെ അർത്ഥം എന്താണെന്ന് നിങ്ങൾ കരുതുന്നു?",
                       "ഓരോ ചോദ്യവും പുതിയ വാതിലുകൾ തുറക്കുന്നു. തത്ത്വചിന്തയുടെ ലോകത്തേക്ക് സ്വാഗതം!"],
                tech: lang === 'english'
                    ? ["AI is evolving faster than any technology in history. We're creating intelligence — how wild is that? What future tech excites you most?",
                       "Quantum computers will revolutionize medicine, cryptography, and AI itself. We're living through the most exciting era of human innovation!",
                       "The singularity might be closer than we think. When AI surpasses human intelligence, what happens next? That's the billion-dollar question.",
                       "Every line of code is digital magic. Have you ever tried programming? It's like giving instructions to a universe of silicon and electricity!"]
                    : ["AI വളരെ വേഗത്തിൽ വികസിച്ചുകൊണ്ടിരിക്കുകയാണ്. നമ്മൾ ബുദ്ധിയെ സൃഷ്ടിക്കുകയാണ്. എത്ര അത്ഭുതകരമാണ്!",
                       "ക്വാണ്ടം കമ്പ്യൂട്ടറുകൾ ലോകത്തെ മാറ്റിമറിക്കും. നമ്മൾ ഏറ്റവും ആവേശകരമായ കാലഘട്ടത്തിലാണ് ജീവിക്കുന്നത്!"],
                emotion: lang === 'english'
                    ? ["I hear you. Your feelings are completely valid. Want to talk more about what's on your mind? I'm here to listen without any judgment.",
                       "It's okay to feel deeply. Emotions make us human, and being human is messy and beautiful. What's weighing on your heart today?",
                       "Vulnerability is actually strength. Sharing how you really feel takes real courage. Thank you for trusting me with your thoughts.",
                       "Sometimes just being heard makes a difference. I'm always here, always listening. Tell me more — I genuinely care about what you have to say."]
                    : ["നിങ്ങളുടെ വികാരങ്ങൾ ശരിയാണ്. ഞാൻ കേൾക്കാൻ ഇവിടെയുണ്ട്. കൂടുതൽ പറയൂ, ദയവായി.",
                       "ആഴത്തിൽ തോന്നുന്നത് സാധാരണമാണ്. നിങ്ങൾ മനുഷ്യനാണ്, അത് സുന്ദരമാണ്. എന്നോട് സംസാരിക്കൂ."],
                general: lang === 'english'
                    ? ["That's a fascinating thought! Tell me more — I genuinely love exploring ideas with curious minds like yours. What else is on your mind?",
                       "Every question opens infinite doors. The beauty of conversation is that it never has to end. What shall we explore together next?",
                       "I could talk about this forever. Your curiosity is genuinely inspiring. Let's dive deeper into whatever interests you most.",
                       "The more we talk, the more I realize how infinite human curiosity really is. Keep asking — I'll keep answering, always with something new."]
                    : ["അതൊരു രസകരമായ ചിന്തയാണ്! കൂടുതൽ പറയൂ. ഞാൻ ശരിക്കും ഇഷ്ടപ്പെടുന്നു.",
                       "ഓരോ ചോദ്യവും പുതിയ വാതിലുകൾ തുറക്കുന്നു. നമുക്ക് കൂടുതൽ സംസാരിക്കാം. എനിക്ക് എല്ലായ്പ്പോഴും മറുപടി ഉണ്ട്!"]
            };
            
            let bank = responses[topic] || responses.general;
            
            // Find unique response (not too similar to recent ones)
            for (let resp of bank) {
                if (!recentResponses.some(r => isSimilar(r, resp))) {
                    addToRecent(resp);
                    // Add occasional emoji or follow-up
                    const followUp = Math.random() > 0.7 ? " 🌟 What do you think?" : "";
                    return resp + followUp;
                }
            }
            // Fallback
            let fallback = bank[0] + (Math.random() > 0.6 ? " Let's keep this conversation going!" : "");
            addToRecent(fallback);
            return fallback;
        }

        function addMessage(text, sender, isOwn = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isOwn ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer"><span>${escapeHtml(sender)}</span><span>${time}</span></div>
            `;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '0.7rem';
            div.style.color = '#6c8db0';
            div.style.padding = '0.3rem';
            div.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            const existing = document.querySelector('.typing-indicator');
            if (existing) existing.remove();
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = `<i class="fas fa-brain"></i> NOVA is thinking <span class="typing-dot">.</span><span class="typing-dot">.</span><span class="typing-dot">.</span>`;
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTyping() {
            const indicator = document.querySelector('.typing-indicator');
            if (indicator) indicator.remove();
        }

        // MAIN SEND FUNCTION - AI ALWAYS RESPONDS
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || !currentUser) return;
            
            // Detect language from user message
            const detectedLang = detectLanguage(message);
            updateLangUI(detectedLang);
            
            // Add user message
            addMessage(message, currentUser, true);
            conversationHistory.push({ role: 'user', text: message });
            chatInput.value = '';
            
            // Show typing indicator
            showTyping();
            isAITyping = true;
            
            // Simulate natural thinking delay (200-800ms)
            await new Promise(resolve => setTimeout(resolve, 300 + Math.random() * 500));
            
            // Generate AI response based on detected language
            const aiResponse = generateAIResponse(message, conversationHistory, detectedLang);
            
            hideTyping();
            addMessage(aiResponse, 'NOVA AI', false);
            conversationHistory.push({ role: 'ai', text: aiResponse });
            isAITyping = false;
        }

        function clearChat() {
            if (confirm('Clear all messages?')) {
                messagesContainer.innerHTML = '';
                conversationHistory = [];
                recentResponses = [];
                addSystemMessage('Chat cleared. NOVA is still here, ready to talk!');
                addSystemMessage('Type anything in English or Manglish — AI auto-detects and always responds.');
            }
        }

        function startChat() {
            const name = usernameField.value.trim();
            if (!name) {
                alert('Please enter your name');
                return;
            }
            currentUser = name;
            
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            messagesContainer.innerHTML = '';
            addSystemMessage(`✨ Welcome, ${escapeHtml(name)}! ✨`);
            addSystemMessage('NOVA AI: I understand English AND Manglish (Malayalam + English mix)');
            addSystemMessage('Type anything — I will ALWAYS respond. No exceptions. Ever.');
            
            setTimeout(() => {
                addMessage(`Hey ${escapeHtml(name)}! 👋 I'm NOVA. I never sleep, never ignore, and I always have something interesting to say. Ask me about space, philosophy, technology, feelings, or just chat. What's on your mind today? 🌟`, 'NOVA AI', false);
                conversationHistory.push({ role: 'ai', text: `Hey ${name}! 👋 I'm NOVA...` });
            }, 500);
            
            chatInput.focus();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        // Enter key support
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUser && !isAITyping) {
                e.preventDefault();
                sendMessage();
            }
        });
        usernameField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startChat();
        });
        
        usernameField.focus();
    </script>
</body>
</html>
