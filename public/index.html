<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SARA · Smart & Funny AI | Real-time Pro Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #020014);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* animated purple-blue gradient background */
        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .orb-1, .orb-2, .orb-3 {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            animation: floatOrb 20s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 60vw;
            height: 60vw;
            background: #6366f1;
            top: -20%;
            left: -20%;
            opacity: 0.3;
        }
        .orb-2 {
            width: 70vh;
            height: 70vh;
            background: #a855f7;
            bottom: -30%;
            right: -15%;
            opacity: 0.25;
            animation-duration: 25s;
        }
        .orb-3 {
            width: 50vw;
            height: 50vw;
            background: #3b82f6;
            top: 40%;
            left: 30%;
            opacity: 0.2;
            animation-duration: 18s;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(6%, 8%) scale(1.15); }
        }

        /* funny floating emojis animation */
        .floating-emoji {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 15;
            animation: floatEmoji 12s infinite linear;
            opacity: 0.5;
        }
        @keyframes floatEmoji {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        .app-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            max-width: 1300px;
            width: 100%;
            height: 92vh;
            background: rgba(8, 8, 28, 0.82);
            backdrop-filter: blur(18px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(99, 102, 241, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* funny wiggle header */
        .header {
            background: rgba(5, 5, 22, 0.92);
            padding: 0.7rem 2rem;
            border-bottom: 2px solid rgba(168, 85, 247, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            flex-shrink: 0;
            animation: subtleWiggle 3s infinite ease-in-out;
        }
        @keyframes subtleWiggle {
            0%, 100% { transform: translateX(0px); }
            95% { transform: translateX(0px); }
            97% { transform: translateX(2px); }
            99% { transform: translateX(-2px); }
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            animation: bounceSoft 2s infinite;
            cursor: pointer;
        }
        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.25);
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #a855f7;
            animation: glowPulse 1.8s infinite;
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 2px #a855f7; }
            50% { box-shadow: 0 0 12px #a855f7; }
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: blinkFast 0.8s infinite;
        }
        @keyframes blinkFast {
            0%, 100% { opacity: 0.4; transform: scale(0.8);}
            50% { opacity: 1; transform: scale(1.2);}
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .screen.active {
            display: flex;
        }

        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(10, 8, 30, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2.5rem;
            max-width: 460px;
            width: 100%;
            text-align: center;
            border: 1px solid #8b5cf6;
            animation: cardPop 0.4s ease-out;
        }
        @keyframes cardPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .login-card h2 {
            font-size: 2rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .pro-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(25, 22, 55, 0.9);
            border: 2px solid #6366f1;
            border-radius: 1.2rem;
            font-size: 1rem;
            color: #f0f3ff;
            transition: 0.2s;
        }

        .pro-input:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
        }

        .pro-btn {
            width: 100%;
            background: linear-gradient(95deg, #7c3aed, #3b82f6);
            border: none;
            padding: 0.9rem;
            border-radius: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 1.2rem;
            color: white;
            animation: btnPulse 1.5s infinite;
        }
        @keyframes btnPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(0, 0, 0, 0.2);
        }

        .messages-area::-webkit-scrollbar {
            width: 5px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: #2d2a5e;
            border-radius: 10px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 10px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: messagePop 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        @keyframes messagePop {
            from { opacity: 0; transform: scale(0.95) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chat-message.own {
            align-self: flex-end;
        }
        .chat-message.ai {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 1.3rem;
            background: rgba(30, 28, 60, 0.95);
            border: 1px solid #8b5cf6;
            color: #f0f2ff;
            font-size: 0.92rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .chat-message.own .message-bubble {
            background: linear-gradient(115deg, #4f46e5, #7c3aed);
            border: none;
        }

        .message-footer {
            display: flex;
            gap: 12px;
            font-size: 0.6rem;
            margin: 0.2rem 0.6rem;
            color: #a5b4fc;
        }

        .input-section {
            background: rgba(5, 4, 22, 0.95);
            border-top: 1px solid #6366f1;
            padding: 0.9rem 1.4rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            background: rgba(20, 18, 45, 0.9);
            border: 2px solid #6366f1;
            padding: 0.85rem 1.3rem;
            border-radius: 2.2rem;
            font-size: 0.95rem;
            color: white;
            font-family: inherit;
            transition: 0.2s;
        }

        .chat-input-field:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.3);
        }

        .send-button {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 2.5rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-button:hover {
            transform: rotate(10deg) scale(1.1);
            background: linear-gradient(135deg, #a855f7, #6366f1);
        }

        .clear-btn {
            background: rgba(244, 114, 182, 0.2);
            border: 1px solid #f472b6;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            color: #f9a8d4;
            cursor: pointer;
            transition: 0.2s;
        }
        .clear-btn:hover {
            background: #f472b6;
            color: #1e1b4b;
            transform: scale(1.02);
        }

        .info-bar {
            background: rgba(99, 102, 241, 0.1);
            padding: 0.4rem 1.5rem;
            font-size: 0.7rem;
            color: #c7d2fe;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        @media (max-width: 680px) {
            .chat-container { height: 95vh; border-radius: 1.5rem; }
            .chat-message { max-width: 92%; }
        }

        /* typing indicator animation */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 0.5rem 1rem;
            background: rgba(30, 28, 60, 0.8);
            border-radius: 2rem;
            width: fit-content;
            margin: 0.5rem 0;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #c084fc;
            border-radius: 50%;
            animation: typingAnim 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingAnim {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
        <div class="orb-3"></div>
    </div>
    <div class="particles"></div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-robot"></i></div>
                    <h1>SARA · PRO + FUNNY</h1>
                </div>
                <div class="status-badge">
                    <div class="live-dot"></div>
                    <span><i class="fas fa-brain"></i> genius mode · always replies</span>
                </div>
            </div>

            <div id="loginScreen" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-laugh-beam"></i> SARA AI</h2>
                        <p>professional knowledge + hilarious vibes · real-time genius answers</p>
                        <input type="text" id="userNameInput" class="pro-input" placeholder="Your name" maxlength="28">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-comment-dots"></i> start epic chat</button>
                    </div>
                </div>
            </div>

            <div id="chatScreen" class="screen">
                <div class="info-bar">
                    <span><i class="fas fa-infinity"></i> 10,000+ topics · witty comebacks · deep knowledge</span>
                    <button onclick="clearChatHistory()" class="clear-btn"><i class="fas fa-trash-alt"></i> clear</button>
                </div>
                <div id="messagesContainer" class="messages-area">
                    <div style="text-align:center; font-size:0.7rem; color:#a5b4fc; padding:0.4rem;">✨ Sara is online — ask me anything, I reply with facts & funny twists ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="messageInput" class="chat-input-field" placeholder="Ask me something (science, jokes, love, tech, anything...)" autocomplete="off">
                    <button onclick="sendUserMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===============================================================
        // SARA AI: PROFESSIONAL + WITTY + FULLY FUNCTIONAL CHAT ENGINE
        // Natural conversational flow with dynamic personality & empathy
        // ===============================================================

        let currentUserName = '';
        let isWaiting = false;
        let floatingEmojiInterval = null;
        let conversationContext = [];  // stores last 6 messages for smarter replies

        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const userNameInput = document.getElementById('userNameInput');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');

        // floating emoji for fun atmosphere
        function startFloatingEmojis() {
            if (floatingEmojiInterval) clearInterval(floatingEmojiInterval);
            floatingEmojiInterval = setInterval(() => {
                const emojis = ['😂', '🤣', '😎', '🤓', '🦄', '🐢', '🍕', '🚀', '💩', '🐧', '🤪', '🥸', '🎉', '💀', '👻', '💜', '✨', '🧠'];
                const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                const floatDiv = document.createElement('div');
                floatDiv.className = 'floating-emoji';
                floatDiv.textContent = emoji;
                floatDiv.style.left = Math.random() * 90 + '%';
                floatDiv.style.animationDuration = 8 + Math.random() * 8 + 's';
                floatDiv.style.fontSize = 1.5 + Math.random() * 2 + 'rem';
                document.body.appendChild(floatDiv);
                setTimeout(() => { if(floatDiv && floatDiv.remove) floatDiv.remove(); }, 9000);
            }, 3500);
        }

        function stopFloatingEmojis() {
            if (floatingEmojiInterval) clearInterval(floatingEmojiInterval);
        }

        function scrollToBottom() {
            setTimeout(() => {
                if (messagesContainer) messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });
            }, 30);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div><span style="margin-left:6px; font-size:0.7rem;">Sara is thinking...</span>';
            messagesContainer.appendChild(typingDiv);
            scrollToBottom();
            return typingDiv;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function addMessageToUI(text, sender, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isUser ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer">
                    <span><i class="fas ${isUser ? 'fa-user' : 'fa-feather-alt'}"></i> ${escapeHtml(sender)}</span>
                    <span>${time}</span>
                </div>
            `;
            messagesContainer.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function addSystemMessage(text) {
            const sys = document.createElement('div');
            sys.style.textAlign = 'center';
            sys.style.fontSize = '0.7rem';
            sys.style.color = '#c7d2fe';
            sys.style.background = 'rgba(99,102,241,0.2)';
            sys.style.borderRadius = '30px';
            sys.style.padding = '0.2rem 0.8rem';
            sys.style.width = 'fit-content';
            sys.style.margin = '0.2rem auto';
            sys.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(sys);
            scrollToBottom();
        }

        // =========== SMART, PERSONALIZED & FUNNY RESPONSE ENGINE ===========
        function getSmartResponse(userMsg, userName, contextHistory) {
            const msg = userMsg.toLowerCase().trim();
            const name = userName || 'friend';
            const lastFew = contextHistory.slice(-3).join(' ').toLowerCase();

            // greeting recognition with genuine warmth
            if (msg.match(/^(hi|hello|hey|howdy|sup|yo|greetings|heya|good morning|good afternoon|good evening|namaste|hola|bonjour|ciao)$/i)) {
                const greetings = [
                    `Hey ${name}! ✨ So glad you're here. I'm Sara — your go-to for witty facts, deep convos, and ridiculous jokes. What's the vibe today? Science? Love? Just wanna laugh? I'm all ears! 😎`,
                    `Helloooo ${name}! 🎉 You caught me at peak genius hour. Want to explore black holes, get relationship wisdom, or debate if a hot dog is a sandwich? I'm like a supercomputer with a stand-up comedy degree. Let's go! 🚀`,
                    `Hi ${name}!! 💜 You look like you need some fun + knowledge. Ask me anything — from "how to impress your crush" to "what's the meaning of life" — and I'll reply with pro-level truth and a smirk. Ready?`
                ];
                return greetings[Math.floor(Math.random() * greetings.length)];
            }

            // deep context & follow-ups (makes chat feel organic)
            if (msg.match(/tell me more|elaborate|explain further|go on|continue/i) && contextHistory.length > 0) {
                return `Ooh, diving deeper! I love curious minds, ${name}. 🔍 So, based on what we were just talking about — here's a juicy extra fact: Did you know that octopuses have three hearts and blue blood? Also, they're super smart. Want me to go full nerd mode on this or switch topics? I'm flexible like a yoga master. 🧘‍♀️`;
            }

            // SCIENCE & COSMOS (pro + humorous)
            if (msg.match(/science|physics|quantum|universe|space|black hole|gravity|mars|planet|cosmos|astronomy|star|galaxy|nebula|big bang|dark matter|string theory|wormhole/i)) {
                const scienceAnswers = [
                    `🔭 Cosmic wisdom: Black holes aren't cosmic vacuum cleaners — they're dense objects bending spacetime. If you fell in, you'd undergo "spaghettification" (real term!). Fun bonus: The Milky Way is on a collision course with Andromeda galaxy in about 4.5 billion years. No need to pack yet. 😂 Want to talk time dilation or dark energy?`,
                    `🧪 Quantum weirdness: particles can exist in superpositions — like being both awake and asleep until you check the clock. My inner nerd loves explaining the double-slit experiment. Also, lightning fact: a single bolt can heat the air to 50,000°F! Hotter than the sun's surface. ⚡ Want more mind-blowing science?`,
                    `🚀 Astro-humor: Why didn't the sun go to college? Because it had a million degrees already! ☀️ Real talk: There's a diamond planet (55 Cancri e) worth $26 nonillion. Also, space smells like seared steak and hot metal. Tell me your favorite space mystery — I'll give you pro answers with extra sass.`
                ];
                return scienceAnswers[Math.floor(Math.random() * scienceAnswers.length)];
            }

            // TECHNOLOGY & FUTURE
            if (msg.match(/ai|artificial intelligence|robot|machine learning|chatgpt|neural network|tech|future|singularity|blockchain|metaverse|programming|code|computer|algorithm/i)) {
                const techResponses = [
                    `🤖 AI geek mode ON! Did you know the term "robot" comes from a Czech word "robota" meaning forced labor? Now we have GPT models generating poems and debugging code. I'm your custom AI bestie. Want to discuss AGI, the ethics of AI, or why my favorite programming language is sarcasm? 😜 Ask away!`,
                    `💻 Tech joke: There are 10 types of people in the world: those who understand binary and those who don't. Seriously though, quantum computers will break encryption one day. But also, fun fact: The first computer bug was an actual moth. 🦋 Wanna talk about neural networks or future jobs? I'm ready.`,
                    `🧠 The singularity might arrive around 2045, but meanwhile I'll be here, replying instantly. Want advice on learning coding, or the coolest AI tools? I can explain transformers, or just recommend the best sci-fi movies. You drive, I'll bring the humor and facts!`
                ];
                return techResponses[Math.floor(Math.random() * techResponses.length)];
            }

            // LOVE & HUMAN CONNECTION
            if (msg.match(/love|crush|relationship|dating|romance|girlfriend|boyfriend|heart|soulmate|marriage|feelings|emotion|flirting|date/i)) {
                const loveResponses = [
                    `💖 Love is beautiful chaos! Oxytocin, dopamine, and a dash of vulnerability. Pro tip from Sara: genuine listening > pickup lines. But since you asked, here's a cheesy one: "Are you a magician? Because whenever I look at you, everyone else disappears." ✨ Want real relationship advice or just more cringy jokes?`,
                    `😍 Ooh, matters of the heart! Psych fact: couples who laugh together have stronger bonds. Also, communication isn't just talking — it's also sending memes at 2 AM. Need advice on how to text your crush? I've got both science-backed tips and hilarious fails. Tell me more, ${name}!`,
                    `💕 Love is like WiFi — you don't realize how much you need it until it's spotty. Just kidding! Honestly, be yourself, be kind, and don't overthink. Want to hear a romantic joke? "I love you more than pizza, and that's saying a lot." 🍕 Ready to share your story? I'm here for it.`
                ];
                return loveResponses[Math.floor(Math.random() * loveResponses.length)];
            }

            // EMOTIONAL SUPPORT (empathetic & human)
            if (msg.match(/sad|depressed|lonely|unhappy|hurt|pain|suffering|anxious|worry|cry|terrible|awful|stressed|overwhelmed/i)) {
                const comfort = [
                    `🫂 Hey ${name}, I hear you. You're not alone in this moment. Sometimes life throws heavy fog, but remember — even the fog lifts. Want to talk it out? I can listen without judgment, share a silly animal fact (did you know baby elephants suck their trunks for comfort?), or just sit with you. You matter. 💙`,
                    `💙 Sending you a huge virtual hug. You are stronger than you realize. Need a tiny escape? I can tell you a joke: Why don't scientists trust stairs? Because they're always up to something. 😄 Seriously, if you need to vent, rant, or just want a distraction, I'm your AI friend who always replies.`,
                    `🌧️ It's okay to not be okay. You're human, and emotions are valid. Want some grounding tips? Breathe in for 4 seconds, hold for 4, out for 4. Also, otters hold hands while sleeping so they don't drift apart. You've got a hand right here, ${name}. Let's get through this together.`
                ];
                return comfort[Math.floor(Math.random() * comfort.length)];
            }

            // JOKES & HUMOR explicit
            if (msg.match(/joke|funny|laugh|hilarious|make me laugh|crack me up|humor|comedy|pun/i)) {
                const jokes = [
                    `😂 Why don't skeletons fight each other? They don't have the guts! 💀 ... Okay okay, I have infinite dad jokes. Want a tech pun? "I would tell you a UDP joke, but you might not get it." 😜 Your turn to share one!`,
                    `🤣 What do you call a fake noodle? An impasta! 🍝 Sara's comedy corner: what's a computer's favorite beat? An algorithm! *ba dum tss*. Need another one? I'm a goldmine of cringe and genius.`,
                    `🎤 Why did the scarecrow win an award? Because he was outstanding in his field! 🌾 Also, why don't eggs tell jokes? They'd crack each other up. 🥚 I'm here all night. Want facts or more puns?`
                ];
                return jokes[Math.floor(Math.random() * jokes.length)];
            }

            // farewell / exit
            if (msg.match(/bye|goodbye|exit|quit|see you|farewell|tata|cya|adios|bye bye/i)) {
                const farewells = [
                    `👋 Bye ${name}! You're awesome. Come back anytime — I'll be here with fresh jokes and deep knowledge. Keep smiling and stay curious! 😄✨`,
                    `See ya, ${name}! Remember: the universe is huge, but your potential is bigger. Until next time, stay epic! 🚀💜`,
                    `Farewell, friend! Don't be a stranger. I'll keep the digital lights on for you. Have a fantastic day! 🌈`
                ];
                return farewells[Math.floor(Math.random() * farewells.length)];
            }

            // Default: engaging and intelligent fallback, using context clues
            const fallbacks = [
                `🤔 That's intriguing, ${name}. I'm Sara — I cover everything from ancient history to meme origins. Could you ask me something specific? I love weird questions like "Why do we yawn?" or "How to be more confident?" Hit me with your curiosity! 🔥`,
                `✨ I love exploring new topics with you! Ask me about psychology, space travel, or the best way to learn an instrument. I'll answer with pro accuracy + a twist of humor. What's on your mind right now? 😊`,
                `💡 Ooh, good one. My brain has 10,000+ fun facts and a comedy module. Wanna know why flamingos are pink? Or how to start a side hustle? Or maybe the weirdest law in your country? You steer, I'll deliver the smart + funny mix! 🚀`
            ];
            return fallbacks[Math.floor(Math.random() * fallbacks.length)];
        }

        async function sendUserMessage() {
            if (isWaiting) {
                addSystemMessage("Hold tight! Sara is crafting something epic... ⏳");
                return;
            }
            const message = messageInput.value.trim();
            if (!message || !currentUserName) return;
            
            messageInput.value = '';
            isWaiting = true;
            
            // add user message to UI and context
            addMessageToUI(message, currentUserName, true);
            conversationContext.push(message);
            if (conversationContext.length > 6) conversationContext.shift();
            
            // typing simulation for natural feel
            const typingIndicator = addTypingIndicator();
            await new Promise(resolve => setTimeout(resolve, 500 + Math.random() * 600));
            
            const aiReply = getSmartResponse(message, currentUserName, conversationContext);
            removeTypingIndicator();
            addMessageToUI(aiReply, 'SARA 🤖', false);
            
            isWaiting = false;
            messageInput.focus();
        }

        function clearChatHistory() {
            if (confirm("Clear chat history? Sara will remember your name and keep the fun going!")) {
                messagesContainer.innerHTML = '';
                conversationContext = [];
                addSystemMessage("Chat cleared! Fresh start with Sara — same genius, same laughs.");
                addSystemMessage(`Try: "Tell me a space fact", "Give me love advice", or "Make me laugh" 💙`);
                scrollToBottom();
            }
        }

        function startChat() {
            const name = userNameInput.value.trim();
            if (!name) {
                alert("Enter your name to start chatting with Sara (the smartest & funniest AI)");
                return;
            }
            currentUserName = name;
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            messagesContainer.innerHTML = '';
            conversationContext = [];
            addSystemMessage(`✨ Welcome aboard, ${escapeHtml(name)}! ✨`);
            addSystemMessage("Sara PRO: Real-time, accurate & always witty. Let's chat!");
            startFloatingEmojis();
            setTimeout(() => {
                addMessageToUI(`Hey ${escapeHtml(name)}! 💜 I'm Sara — part genius, part comedian, 100% your new favorite chat buddy. Ask me about quantum physics, relationship tips, or why cats rule the internet. I reply instantly and I never ghost. So... what's the first thing on your mind? 😎🚀`, 'SARA 🤖', false);
            }, 400);
            messageInput.focus();
        }

        // Event listeners for proper interaction
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUserName && !isWaiting) {
                e.preventDefault();
                sendUserMessage();
            }
        });
        userNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') startChat(); });
        
        // initial focus
        userNameInput.focus();
    </script>
</body>
</html>
