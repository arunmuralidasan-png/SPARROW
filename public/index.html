<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MIRA | Manglish + English AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0a0f2a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }
        .glow-1 {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.2), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float1 15s ease-in-out infinite;
        }
        .glow-2 {
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.15), transparent);
            border-radius: 50%;
            filter: blur(70px);
            animation: float2 18s ease-in-out infinite reverse;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }

        .app-wrapper {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            max-width: 1400px;
            width: 100%;
            height: 94vh;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(5, 8, 20, 0.9);
            padding: 0.8rem 1.8rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00c6ff, #8a2be2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(0, 200, 255, 0); }
        }
        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.3);
            font-size: 0.75rem;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .lang-badge {
            background: rgba(0, 200, 255, 0.12);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.7rem;
            color: #00c6ff;
        }

        .screen { display: none; flex: 1; flex-direction: column; }
        .screen.active { display: flex; }

        .login-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 1.8rem;
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.3);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .login-card h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            color: #8aabcc;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }
        .pro-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
        }
        .pro-input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.2);
        }
        .pro-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 0.9rem;
            border-radius: 1rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        .pro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 200, 255, 0.3);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(5, 10, 20, 0.3);
        }
        .messages-area::-webkit-scrollbar { width: 5px; }
        .messages-area::-webkit-scrollbar-track { background: rgba(0, 200, 255, 0.1); border-radius: 10px; }
        .messages-area::-webkit-scrollbar-thumb { background: #00c6ff; border-radius: 10px; }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: messageIn 0.15s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message.own { align-self: flex-end; }
        .chat-message.ai { align-self: flex-start; }

        .message-bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 1.2rem;
            background: rgba(20, 28, 45, 0.95);
            border: 1px solid rgba(0, 200, 255, 0.15);
            color: #e8e8f0;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .chat-message.own .message-bubble {
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: white;
        }
        .message-footer {
            display: flex;
            gap: 10px;
            font-size: 0.6rem;
            margin: 0.2rem 0.6rem;
            color: #6c8db0;
        }

        .input-section {
            background: rgba(5, 10, 20, 0.95);
            border-top: 1px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.5rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }
        .chat-input-field {
            flex: 1;
            background: rgba(15, 20, 40, 0.9);
            border: 2px solid rgba(0, 200, 255, 0.2);
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            color: white;
            transition: all 0.2s;
        }
        .chat-input-field:focus {
            outline: none;
            border-color: #00c6ff;
        }
        .send-button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-button:hover {
            transform: scale(1.05);
        }
        .clear-btn {
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.3);
            padding: 0.3rem 0.9rem;
            border-radius: 1.5rem;
            color: #ff8080;
            cursor: pointer;
            font-size: 0.7rem;
        }

        @media (max-width: 680px) {
            .chat-container { height: 96vh; border-radius: 1.2rem; }
            .chat-message { max-width: 92%; }
            .logo-area h1 { font-size: 1.1rem; }
            .header { padding: 0.6rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <div class="app-wrapper">
        <div class="chat-container">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-star-of-life"></i></div>
                    <h1>MIRA AI</h1>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div class="lang-badge" id="langIndicator">
                        <i class="fas fa-globe"></i> EN / Manglish
                    </div>
                    <div class="status-badge">
                        <div class="live-dot"></div>
                        <span>All-Knowing</span>
                    </div>
                </div>
            </div>

            <div id="loginView" class="screen active">
                <div class="login-area">
                    <div class="login-card">
                        <h2><i class="fas fa-brain"></i> MIRA</h2>
                        <p>Intelligent • English • Manglish (Malayalam in English script)</p>
                        <input type="text" id="usernameField" class="pro-input" placeholder="Enter your name" maxlength="25">
                        <button onclick="startChat()" class="pro-btn"><i class="fas fa-arrow-right"></i> Start Conversation</button>
                    </div>
                </div>
            </div>

            <div id="chatView" class="screen">
                <div style="padding: 0.3rem 1.5rem; background: rgba(0,200,255,0.03); display: flex; justify-content: space-between; align-items: center;">
                    <span style="color:#00c6ff; font-size:0.7rem;"><i class="fas fa-database"></i> Speaks: English & Manglish (Malayalam + English mix)</span>
                    <button onclick="clearChat()" class="clear-btn"><i class="fas fa-trash"></i> Clear</button>
                </div>
                <div id="messageList" class="messages-area">
                    <div style="text-align:center; font-size:0.7rem; color:#5a7a9a; padding:0.5rem;">✨ MIRA is ready — English or Manglish (like "Enikku ariyan und") ✨</div>
                </div>
                <div class="input-section">
                    <input type="text" id="chatInput" class="chat-input-field" placeholder="Ask in English or Manglish... Example: 'Ente peru' or 'What is AI?'" autocomplete="off">
                    <button onclick="sendMessage()" class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // MIRA AI - ENGLISH + MANGLISH (Malayalam in English script)
        // Accurate responses, auto language detection
        // ================================================

        let currentUser = '';
        let currentLang = 'english';
        let isSending = false;
        
        // DOM
        const loginScreen = document.getElementById('loginView');
        const chatScreen = document.getElementById('chatView');
        const usernameField = document.getElementById('usernameField');
        const chatInput = document.getElementById('chatInput');
        const messagesContainer = document.getElementById('messageList');
        const langIndicator = document.getElementById('langIndicator');

        // Language Detection (English vs Manglish)
        function detectLanguage(text) {
            const lower = text.toLowerCase();
            // Manglish (Malayalam written in English script) markers
            const manglishMarkers = [
                'und', 'illa', 'alle', 'ano', 'njan', 'ningal', 'avan', 'ithu', 'athu', 
                'enikku', 'ninakku', 'patti', 'cheythu', 'varum', 'pokam', 'nokku', 'kittum', 
                'parayu', 'sheri', 'nalla', 'sugham', 'entha', 'engane', 'evide', 'ippol', 
                'naale', 'kurachu', 'pinne', 'appol', 'ayyo', 'eda', 'mone', 'chetta', 
                'undallo', 'ille', 'alle', 'ninne', 'enne', 'avane', 'ivide', 'angane', 
                'enthu', 'enthina', 'enikk', 'ninakk', 'avanu', 'avalkku', 'nammal'
            ];
            let score = 0;
            for (let m of manglishMarkers) {
                if (lower.includes(m)) score++;
            }
            if (score >= 2) return 'manglish';
            if (lower.match(/^(hello|hi|hey|what|how|why|where|tell|can|please|thanks|good|bad|love|hate|think|know|yes|no|maybe|i am|you are|is it|are you|who|when|which|explain|define|tell me)/i)) return 'english';
            return score > 0 ? 'manglish' : 'english';
        }

        function updateLangUI(lang) {
            currentLang = lang;
            if (lang === 'manglish') {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> മംഗ്ലീഷ് (Manglish)';
                langIndicator.style.background = 'rgba(168,85,247,0.15)';
            } else {
                langIndicator.innerHTML = '<i class="fas fa-language"></i> English';
                langIndicator.style.background = 'rgba(0,200,255,0.1)';
            }
        }

        // ================================================
        // KNOWLEDGE BASE - ENGLISH + MANGLISH RESPONSES
        // All Manglish responses use English script (Malayalam pronunciation)
        // ================================================

        function getAccurateResponse(userMsg, lang) {
            const lower = userMsg.toLowerCase();
            
            // Black Hole
            if (lower.match(/black hole|blackhole/i)) {
                if (lang === 'manglish') {
                    return "Black hole ennu paranjal spacetime il ulla oru sthalamaanu, avide gravity valare shakthamaanu, light polum rekshapett povilla. Massive stars collapse aakumbol aanu ithu form aakunnathu. Event horizon aanu boundary. Bhoomikk ettavum aduthulla black hole 1,500 light years akale aanu.";
                }
                return "A black hole is a region of spacetime where gravity is so strong that nothing, not even light, can escape. They form when massive stars collapse. The boundary is called the event horizon. The nearest black hole to Earth is about 1,500 light-years away.";
            }
            
            // AI
            if (lower.match(/what is ai|artificial intelligence|what is artificial intelligence/i)) {
                if (lang === 'manglish') {
                    return "Artificial Intelligence (AI) ennu paranjal manushyarude budhi machine il simulate cheyyunnathaanu. It includes machine learning, deep learning, neural networks. Examples: ChatGPT, self-driving cars, facial recognition, Siri, Alexa. AI ippol ella mekhala ilum upayogikkunnu.";
                }
                return "Artificial Intelligence (AI) is the simulation of human intelligence in machines. It includes machine learning, deep learning, and neural networks. Examples: ChatGPT, self-driving cars, facial recognition, and voice assistants like Siri and Alexa.";
            }
            
            // Quantum Computing
            if (lower.match(/what is quantum|quantum computing|quantum computer/i)) {
                if (lang === 'manglish') {
                    return "Quantum computing quantum bits (qubits) upayogikkunnu. Iva oru same time il multiple states il exist cheyyum (superposition). Ith kond avakku certain problems classical computers nekkal valare vegam solve cheyyan pattum. Google's Sycamore 2019 il 'quantum supremacy' achieve cheythu.";
                }
                return "Quantum computing uses quantum bits (qubits) that can exist in multiple states simultaneously (superposition). This allows them to solve certain problems exponentially faster than classical computers. Google's Sycamore achieved 'quantum supremacy' in 2019.";
            }
            
            // World War 2
            if (lower.match(/world war|world war 2|ww2|wwii|second world war/i)) {
                if (lang === 'manglish') {
                    return "World War II (1939-1945) manushya charithrathile ettavum marakamaaya samgharsham aanu. 70-85 million aalkkar marichu. Allies (US, UK, USSR, China) um Axis powers um (Germany, Japan, Italy) aayirunnu. Hiroshima, Nagasaki atomic bombings kond aanu ithu avasaanichathu.";
                }
                return "World War II (1939-1945) was the deadliest conflict in human history, with 70-85 million fatalities. It involved the Allies (US, UK, USSR, China) and Axis powers (Germany, Japan, Italy). It ended with the atomic bombings of Hiroshima and Nagasaki.";
            }
            
            // Einstein
            if (lower.match(/who is albert einstein|einstein/i)) {
                if (lang === 'manglish') {
                    return "Albert Einstein (1879-1955) German il janichcha theoretical physicist aayirunnu. Theory of relativity develop cheythu. Avante famous equation E=mc² mass um energy um equivalent aanennu kaannikkunnu. 1921 il Nobel Prize in Physics kittiyittund.";
                }
                return "Albert Einstein (1879-1955) was a German-born theoretical physicist who developed the theory of relativity. His famous equation E=mc² shows that mass and energy are equivalent. He won the Nobel Prize in Physics in 1921.";
            }
            
            // Blockchain
            if (lower.match(/what is blockchain|blockchain technology/i)) {
                if (lang === 'manglish') {
                    return "Blockchain decentralized digital ledger aanu. Oro 'block' il transaction data, timestamp, cryptographic hash und. Bitcoin inteyum cryptocurrencies inteyum pinnil ulla technology ithaanu. Ith transparency, security, immutability ensure cheyyunnu.";
                }
                return "Blockchain is a decentralized digital ledger. Each 'block' contains transaction data, a timestamp, and a cryptographic hash. It's the technology behind Bitcoin and cryptocurrencies. It ensures transparency, security, and immutability.";
            }
            
            // Metaverse
            if (lower.match(/what is metaverse|metaverse/i)) {
                if (lang === 'manglish') {
                    return "Metaverse oru collective virtual shared space aanu. VR, AR, internet ivayude convergence kond undaakkiyathaanu. Meta (Facebook), Microsoft, Epic Games okke metaverse platforms build cheyyunnu. Future il nammal avide work, play, socialize cheyyum.";
                }
                return "The metaverse is a collective virtual shared space, created by the convergence of VR, AR, and the internet. Companies like Meta, Microsoft, and Epic Games are building metaverse platforms.";
            }
            
            // COVID
            if (lower.match(/covid|coronavirus|covid-19|pandemic/i)) {
                if (lang === 'manglish') {
                    return "COVID-19 SARS-CoV-2 virus moolam undaakunnu. 2019 December il Wuhan, China il ninnu start aayi. Symptoms: fever, cough, breathing difficulty. Pfizer, Moderna vaccines mRNA technology upayogichu record time il develop cheythu.";
                }
                return "COVID-19 is caused by the SARS-CoV-2 virus. It emerged in Wuhan, China in December 2019. Symptoms include fever, cough, and difficulty breathing. Vaccines from Pfizer and Moderna were developed using mRNA technology.";
            }
            
            // Sleep
            if (lower.match(/how to sleep better|insomnia|sleep problem/i)) {
                if (lang === 'manglish') {
                    return "Nalla urakkathinu: consistent sleep schedule follow cheyyuka, urakkunnathinu 1 hour munp screens avoid cheyyuka, bedroom cool (18-20°C) aayi vekkuka, afternoon 2 manikku shesham caffeine avoid cheyyuka, daily exercise cheyyuka pakshe urakkathinu munp alla, meditation or deep breathing try cheyyuka.";
                }
                return "For better sleep: maintain a consistent sleep schedule, avoid screens 1 hour before bed, keep your bedroom cool (65-68°F / 18-20°C), avoid caffeine after 2 PM, exercise daily but not right before bed, and try meditation or deep breathing.";
            }
            
            // Meaning of Life
            if (lower.match(/meaning of life|purpose of life|why are we here/i)) {
                if (lang === 'manglish') {
                    return "Jeevithathinte artham oru philosophical question aanu. Existentialism parayunnu nammal nammude swantham artham create cheyyunnu ennu. Science parayunnu jeevithathinu inherent purpose illa ennu. Ente abhiprayam: Meaning ennu parayunnathu ningal value cheyyan thaerunnathaanu. Ningalkku jeevithathil enthaanu meaning?";
                }
                return "The meaning of life is a philosophical question. Existentialism says we create our own meaning. Science says life has no inherent purpose. My view: Meaning is what you choose to value. What gives YOUR life meaning?";
            }
            
            // Anxiety
            if (lower.match(/what is anxiety|anxiety disorder|feeling anxious/i)) {
                if (lang === 'manglish') {
                    return "Anxiety stress inodu ulla bodyude natural response aanu. Ithoru fear or worry aanu future ine kurichu. Normal anxiety temporary aanu. Manage cheyyan: deep breathing (4-7-8 method), grounding exercises (5-4-3-2-1), regular exercise, vere aarodenkilum samsaarikkuka. Ningal alone alla.";
                }
                return "Anxiety is your body's natural response to stress. It's a feeling of fear or worry about the future. Normal anxiety is temporary. To manage: deep breathing (4-7-8 method), grounding exercises (5-4-3-2-1), regular exercise, and talking to someone. You're not alone.";
            }
            
            // Hello/Greeting
            if (lower.match(/hello|hi|hey|greetings|namaste|sup|how are you|how are you doing|sugham|sukhanno|entha vishesham/i)) {
                if (lang === 'manglish') {
                    return `Halo ${currentUser || ''}! 👞 Njan MIRA. Enikku science, history, technology, health, philosophy okke ariyaam. Ningalkku ishtamulla bhashayil chodikkuka — English or Manglish. Ennod enthum chodikkuka, njan accurate answers tharaam. Ippo entha chodikkaanullath? 😊`;
                }
                return `Hello${currentUser ? ' ' + currentUser : ''}! 👋 I'm MIRA. I have knowledge about science, history, technology, health, philosophy, and more. Ask me anything in English or Manglish — I give accurate, thoughtful answers. What would you like to learn today?`;
            }
            
            // Thank you response
            if (lower.match(/thank|thanks|nanni|welcome/i)) {
                if (lang === 'manglish') {
                    return "Welcome! 😊 Nanni paranjathinu thanks. Ningalkku vere enthelum chodyam undengil chodikkuka. Njan ivide help cheyyaan und. Have a great day! ✨";
                }
                return "You're very welcome! 😊 I'm glad I could help. Feel free to ask me anything else — I'm always here with accurate answers. Have a wonderful day! ✨";
            }
            
            // Default intelligent response
            if (lang === 'manglish') {
                return `"${userMsg.substring(0, 50)}" — nalla chodyam aanu. Enikku ithine kurichu kurachu ariyam. Ningalkku ee vishayathinte ethu bhaagam aanu kooduthal ariyan aagrahikkunnathu? Njan science, history, technology, health, philosophy ivayil ellaam accurate answers tharaam. Kooduthal chodikkuka!`;
            }
            return `That's a great question about "${userMsg.substring(0, 50)}". Based on my knowledge, I can help you with this. Could you clarify which specific aspect you'd like to know more about? I provide accurate information on science, history, technology, health, philosophy, and more. What else would you like to ask?`;
        }

        function addMessage(text, sender, isOwn = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isOwn ? 'own' : 'ai'}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            msgDiv.innerHTML = `
                <div class="message-bubble">${escapeHtml(text)}</div>
                <div class="message-footer"><span>${escapeHtml(sender)}</span><span>${time}</span></div>
            `;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '0.65rem';
            div.style.color = '#6c8db0';
            div.style.padding = '0.2rem';
            div.innerHTML = `✨ ${escapeHtml(text)}`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            if (isSending) return;
            const message = chatInput.value.trim();
            if (!message || !currentUser) return;
            
            isSending = true;
            
            const detected = detectLanguage(message);
            updateLangUI(detected);
            
            addMessage(message, currentUser, true);
            chatInput.value = '';
            
            const aiReply = getAccurateResponse(message, detected);
            
            await new Promise(resolve => setTimeout(resolve, 60));
            
            addMessage(aiReply, 'MIRA', false);
            
            isSending = false;
            chatInput.focus();
        }

        function clearChat() {
            if (confirm('Clear all messages?')) {
                messagesContainer.innerHTML = '';
                addSystemMessage('Chat cleared. MIRA is still here!');
                addSystemMessage('Ask in English or Manglish — accurate answers guaranteed.');
            }
        }

        function startChat() {
            const name = usernameField.value.trim();
            if (!name) {
                alert('Please enter your name');
                return;
            }
            currentUser = name;
            
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            messagesContainer.innerHTML = '';
            addSystemMessage(`✨ Welcome, ${escapeHtml(name)}! ✨`);
            addSystemMessage('MIRA speaks English and Manglish (Malayalam in English script)');
            addSystemMessage('Examples: "Enikku black hole ine kurichu ariyanam" or "What is quantum computing?"');
            
            setTimeout(() => {
                addMessage(`Hi ${escapeHtml(name)}! 👋 Njan MIRA. Ennod English ilo Manglish ilo chodikkam. Examples: "What is AI?" or "Black hole enthaanu?" or "Enikku urakkathinu prashnam und". Enikku ellaam ariyaam — ask me anything! 😊`, 'MIRA', false);
            }, 100);
            
            chatInput.focus();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUser && !isSending) {
                e.preventDefault();
                sendMessage();
            }
        });
        usernameField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startChat();
        });
        
        usernameField.focus();
    </script>
</body>
</html>
